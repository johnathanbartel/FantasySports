<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In - FantasyMotion</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-4); }
  .field label { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; }
  .field input {
    padding: 8px 10px; border-radius: var(--radius-md); border: 1px solid var(--color-divider);
    background: var(--color-bg); color: var(--color-text); font-size: 14px; font-family: var(--font-body);
  }
  .tab-btn {
    flex: 1; padding: var(--space-2) var(--space-3); font-family: var(--font-heading);
    font-size: 14px; border: 1px solid var(--color-divider); background: var(--color-bg);
    color: var(--color-text); cursor: pointer; border-radius: var(--radius-md);
  }
  .tab-btn.active {
    background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent);
  }
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">

  <div class="nav" style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:var(--space-4)">
      <a href="/static/index.html" class="nav-brand" style="text-decoration:none;color:inherit;font-family:var(--font-heading);font-weight:700">FantasyMotion</a>
      <a href="/static/index.html">Home</a>
      <a href="/static/dashboard.html">My leagues</a>
    </div>
    <div id="nav-auth" style="display:flex;align-items:center;gap:var(--space-3)"></div>
  </div>

  <div style="max-width:440px;margin:var(--space-8) auto;padding:0 var(--space-4)">

    <div style="margin-bottom:var(--space-5);text-align:center">
      <div class="card-kicker" style="margin-bottom:var(--space-1);color:var(--color-accent);font-weight:600">Your league. Your rules. Your universe.</div>
      <h1 style="margin:0 0 var(--space-2);font-size:28px" id="page-title">Sign in</h1>
      <p class="text-muted" style="margin:0;font-size:14px" id="page-subtitle">Access your fantasy leagues and draft boards</p>
    </div>

    <div style="display:flex;gap:var(--space-2);margin-bottom:var(--space-4)">
      <button class="tab-btn active" id="tab-login" type="button">Sign In</button>
      <button class="tab-btn" id="tab-register" type="button">Create Account</button>
    </div>

    <div id="error-banner" style="display:none;background:var(--color-accent-2-100);color:var(--color-accent-2-800);padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-4);font-size:14px"></div>

    <!-- Login Form -->
    <div id="login-panel" class="card elev-sm" style="padding:var(--space-5)">
      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">Sign in</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="register-panel" class="card elev-sm" style="display:none;padding:var(--space-5)">
      <form id="register-form">
        <div class="field">
          <label for="reg-name">Display Name</label>
          <input type="text" id="reg-name" required maxlength="100" placeholder="e.g. Wayne Gretzky">
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reg-submit-btn">Create account</button>
      </form>
    </div>

    <!-- Guest / Alternative -->
    <div style="margin-top:var(--space-4);text-align:center">
      <button type="button" class="btn btn-ghost" id="toggle-guest" style="font-size:13px">Or continue with a guest name</button>
      <div id="guest-panel" style="display:none;margin-top:var(--space-3)" class="card elev-sm">
        <div class="field" style="margin-bottom:var(--space-2)">
          <label for="guest-name">Guest Display Name</label>
          <input type="text" id="guest-name" placeholder="e.g. Visitor 99">
        </div>
        <button type="button" class="btn btn-secondary btn-block" id="guest-submit-btn">Enter as Guest</button>
      </div>
    </div>

  </div>
</div>

<script src="/static/session.js"></script>
<script>
const params = new URLSearchParams(location.search);
const redirectUrl = params.get('redirect') || '/static/dashboard.html';

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function showTab(tab) {
  showError('');
  const isLogin = tab === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('login-panel').style.display = isLogin ? 'block' : 'none';
  document.getElementById('register-panel').style.display = isLogin ? 'none' : 'block';
  document.getElementById('page-title').textContent = isLogin ? 'Sign in' : 'Create account';
  document.getElementById('page-subtitle').textContent = isLogin
    ? 'Access your fantasy leagues and draft boards'
    : 'Join leagues, manage your teams, and draft live';
}

document.getElementById('tab-login').onclick = () => showTab('login');
document.getElementById('tab-register').onclick = () => showTab('register');

// Login submission
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  showError('');
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    await FSC.login(email, password);
    location.href = redirectUrl;
  } catch (err) {
    showError(err.message);
  }
};

// Register submission
document.getElementById('register-form').onsubmit = async (e) => {
  e.preventDefault();
  showError('');
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  try {
    await FSC.register(email, name, password);
    location.href = redirectUrl;
  } catch (err) {
    showError(err.message);
  }
};

// Guest toggle & submission
document.getElementById('toggle-guest').onclick = () => {
  const p = document.getElementById('guest-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
};
document.getElementById('guest-submit-btn').onclick = async () => {
  showError('');
  const name = document.getElementById('guest-name').value.trim();
  if (!name) return showError('Please enter a guest name.');
  try {
    await FSC.createGuest(name);
    location.href = redirectUrl;
  } catch (err) {
    showError(err.message);
  }
};

// If already signed in, redirect directly
FSC.current().then(u => {
  if (u && !params.get('stay')) {
    location.href = redirectUrl;
  }
});
</script>
</body>
</html>
