<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHL Schedule &amp; Lineup</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body{margin:0}
  .wrap{max-width:1280px;margin:0 auto;padding:var(--space-6) var(--space-4)}
  .inp{padding:8px 10px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);font-size:14px;font-family:var(--font-body);max-width:100%}
  .banner{display:none;padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-4)}
  .banner.err{background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
  .banner.ok{background:var(--color-accent-100);color:var(--color-accent-800)}
  .muted{color:color-mix(in srgb,var(--color-text) 55%,transparent)}

  /* three zones: [lineup | (tabs over panel)] */
  .zones{display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);grid-template-areas:"lineup days" "lineup panel";grid-template-rows:auto 1fr;gap:var(--space-4) var(--space-6);align-items:start}
  #zone-lineup{grid-area:lineup}
  #zone-days{grid-area:days}
  #zone-panel{grid-area:panel}
  .zone-switch{display:none;gap:0;margin-bottom:var(--space-3)}
  .zone-switch button{flex:1;padding:10px 6px;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);font:inherit;font-size:14px;cursor:pointer}
  .zone-switch button[aria-pressed="true"]{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent)}

  /* pecking order */
  .line{border-top:1px solid var(--color-divider);padding:var(--space-2) 0}
  .line:first-child{border-top:0}
  .line h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
  .prow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:4px 0;font-size:14px}
  .prow .pos{font-family:var(--font-heading);font-size:12px;text-align:center}
  .prow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow.vacant .nm{font-style:italic}
  .st{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 5px;border:1px solid var(--color-divider);white-space:nowrap}
  .st.active{border-color:var(--color-accent);color:var(--color-accent-700)}
  .st.idle{color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .st.unknown{border-style:dashed;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .st.confirmed{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg)}
  .mv{display:inline-flex;gap:2px}
  .mv button{width:32px;height:32px;padding:0;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);cursor:pointer;font-size:14px;line-height:1}
  .mv button:disabled{opacity:.35;cursor:not-allowed}
  .mv button:hover:not(:disabled){background:color-mix(in srgb,var(--color-text) 8%,transparent)}
  .prow[draggable="true"]{cursor:grab}
  .prow.dragover{outline:2px dashed var(--color-accent)}
  details.unranked{border-top:1px solid var(--color-divider);margin-top:var(--space-2);padding-top:var(--space-2);font-size:13px}
  details.unranked summary{cursor:pointer}

  /* series tabs */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
  .tab{flex:1 0 108px;scroll-snap-align:start;text-align:left;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);font:inherit;padding:8px 10px;cursor:pointer;display:grid;gap:2px;border-radius:var(--radius-md)}
  .tab[aria-selected="true"]{border-color:var(--color-accent);box-shadow:inset 0 -3px 0 var(--color-accent)}
  .tab .d{font-family:var(--font-heading);font-size:14px}
  .tab .o{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
  .tab .o span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab .s{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .tab.off{background:color-mix(in srgb,var(--color-text) 5%,transparent)}
  .logo{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--color-neutral-300);color:var(--color-neutral-900);font-size:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
  .gs{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600}
  .gs-none{color:color-mix(in srgb,var(--color-text) 45%,transparent)}
  .gs-low{color:#2d2b2b}
  .gs-mid{color:#d97706}
  .gs-high{color:#FF1E27}
  .series-bar{display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-2);font-size:13px}
  .series-bar .btn{padding:4px 12px;min-width:40px}
  .series-bar .muted{flex:1 1 220px}

  .panel-state{border:1px dashed var(--color-divider);padding:var(--space-6) var(--space-4);text-align:center}
  .panel-state h3{margin-bottom:var(--space-1)}
  .skeleton{height:14px;margin:8px 0;background:linear-gradient(90deg,var(--color-neutral-200),var(--color-neutral-100),var(--color-neutral-200));background-size:200% 100%;animation:sk 1.2s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}

  /* off-day banking */
  .bank-alert{display:none;border:1px solid var(--color-process-yellow);background:#fff8df;color:#4a3a00;padding:var(--space-3);margin-bottom:var(--space-4);border-radius:var(--radius-md);align-items:center;gap:var(--space-3);flex-wrap:wrap}
  .bank-alert.urgent{border-color:var(--color-accent-2);background:var(--color-accent-2-100);color:var(--color-accent-2-900)}
  .bank-alert .msg{flex:1 1 260px}
  .bk{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--color-accent-800);background:var(--color-accent-100);padding:1px 5px;border-radius:2px;justify-self:start}
  .bk.auto{background:var(--color-neutral-200);color:var(--color-neutral-800)}
  .bank-sec{border-top:1px solid var(--color-divider);margin-top:var(--space-4);padding-top:var(--space-3)}
  .credit{border:1px solid var(--color-divider);padding:var(--space-3);margin-top:var(--space-2);display:grid;gap:4px}
  .credit.sel{border-color:var(--color-accent);box-shadow:inset 3px 0 0 var(--color-accent)}
  .credit .top{display:flex;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap;align-items:baseline}
  .chip{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1px solid var(--color-divider);white-space:nowrap}
  .chip.attention{border-color:var(--color-process-yellow);background:#fff2c4;color:#4a3a00}
  .chip.good{border-color:var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800)}
  .chip.info{background:var(--color-neutral-200);color:var(--color-neutral-800)}
  .chip.muted{border-style:dashed;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .chip.cap{border-color:var(--color-accent-2);color:var(--color-accent-2-800)}
  .reco{border:1px solid var(--color-accent);padding:var(--space-3);margin-top:var(--space-3);display:grid;gap:var(--space-2)}
  .reco ul{margin:0;padding-left:18px;font-size:13px}
  .reco .inputs li.no{color:color-mix(in srgb,var(--color-text) 60%,transparent)}
  .reco .row{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .reco fieldset{border:1px solid var(--color-divider);margin:0;padding:var(--space-2) var(--space-3)}
  .reco label.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px;cursor:pointer}
  .reco label.opt input{margin-top:4px}
  .reco .err{background:var(--color-accent-2-100);color:var(--color-accent-2-800);padding:var(--space-2) var(--space-3)}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px}

  @media (max-width:860px){
    .wrap{padding:var(--space-4) var(--space-3)}
    h1{font-size:30px}
    .zone-switch{display:flex}
    .zones{grid-template-columns:minmax(0,1fr);grid-template-areas:"lineup" "days" "panel"}
    .zones .zone{display:none}
    .zones[data-active="lineup"] #zone-lineup,.zones[data-active="days"] #zone-days,.zones[data-active="panel"] #zone-panel{display:block}
    .nav{flex-wrap:wrap;gap:var(--space-2)}
  }
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">

  <div class="nav">
    <span class="nav-brand" id="nav-brand">NHL</span>
    <div style="display:flex;gap:var(--space-4);flex-wrap:wrap">
      <a href="/static/index.html">Home</a>
      <a href="#" id="nav-league">League home</a>
      <a href="#" aria-current="page">Schedule &amp; lineup</a>
    </div>
  </div>

  <main class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);flex-wrap:wrap;margin-bottom:var(--space-4)">
      <div>
        <div class="card-kicker" id="kicker">&nbsp;</div>
        <h1 style="margin:0">Schedule &amp; lineup</h1>
      </div>
      <div>
        <label class="card-kicker" for="team-select" style="display:block;margin-bottom:2px">Team</label>
        <select id="team-select" class="inp" disabled></select>
      </div>
    </div>

    <div id="error-banner" class="banner err" role="alert"></div>
    <div id="result-banner" class="banner ok" role="status" aria-live="polite"></div>

    <div id="page-state" class="panel-state" role="status" aria-live="polite">
      <div class="skeleton" style="width:60%;margin:8px auto"></div><div class="skeleton" style="width:40%;margin:8px auto"></div>
      <p class="muted" style="margin-top:var(--space-3)">Loading…</p>
    </div>

    <div id="viewer" style="display:none">
      <div id="bank-alert" class="bank-alert" role="status" aria-live="polite"></div>
      <div class="zone-switch" role="group" aria-label="Show section">
        <button type="button" data-zone="lineup" aria-pressed="true">Lineup</button>
        <button type="button" data-zone="days" aria-pressed="false">Series days</button>
        <button type="button" data-zone="panel" aria-pressed="false">Matchup</button>
      </div>

      <div class="zones" id="zones" data-active="lineup">
        <section class="zone card elev-sm" id="zone-lineup" aria-labelledby="h-lineup" style="padding:var(--space-4);gap:0">
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2)">
            <h3 id="h-lineup" style="margin:0">Pecking order</h3>
            <span class="muted" style="font-size:12px" id="po-mode"></span>
          </div>
          <p class="muted" style="font-size:12px;margin:4px 0 var(--space-2)" id="po-note"></p>
          <div id="lines" aria-live="polite"></div>
          <div id="unranked"></div>
        </section>

        <section class="zone" id="zone-days" aria-labelledby="h-days">
          <h2 id="h-days" style="font-size:20px;margin-bottom:var(--space-2)">Series days</h2>
          <div class="series-bar" id="series-bar"></div>
          <div class="tabs" id="tabs" role="tablist" aria-label="Series days"></div>
        </section>

        <section class="zone card elev-sm" id="zone-panel" aria-labelledby="h-panel" style="padding:var(--space-4);gap:0">
          <h2 id="h-panel" style="font-size:20px">Matchup</h2>
          <div id="panel"></div>
          <div id="bank-section" class="bank-sec" aria-labelledby="h-bank"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="/static/session.js"></script>
<script src="/static/nhl-schedule-logic.js"></script>
<script src="/static/nhl-banking-logic.js"></script>
<script>
const V = window.NhlViewer;
const params = new URLSearchParams(location.search);
const LEAGUE_ID = params.get('league_id');
const api = FSC.api;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS_LABEL = {scheduled: 'Scheduled', in_progress: 'Live', final: 'Final', postponed: 'Postponed'};
const statusLabel = (s) => STATUS_LABEL[s] || String(s || '').replace(/_/g, ' ');

let me = null, league = null, teams = [];
let teamId = null, order = null, resolved = null, schedule = null;
let seriesIdx = 0, dayIdx = 0, zone = 'lineup';
let busy = false;

function showError(msg) { const el = $('error-banner'); el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
function showResult(msg) { const el = $('result-banner'); el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
function pageState(html) { const el = $('page-state'); el.innerHTML = html; el.style.display = html ? 'block' : 'none'; $('viewer').style.display = html ? 'none' : 'block'; }
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function canManage(team) {
  if (!me || !team) return false;
  return team.is_ai_owned ? league.commissioner_user_id === me.user_id : team.owner_user_id === me.user_id;
}

// ---- zone switcher (narrow screens) ----
function setZone(z) {
  zone = z;
  $('zones').dataset.active = z;
  document.querySelectorAll('.zone-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zone === z)));
}
document.querySelectorAll('.zone-switch button').forEach(b => b.onclick = () => setZone(b.dataset.zone));

// ---- pecking order ----
function renderLines() {
  const editable = canManage(teams.find(t => t.id === teamId)) && !busy;
  $('po-mode').textContent = editable ? 'You can reorder' : 'View only';
  $('po-note').textContent = 'Starters per game: 1 C, 2 W, 2 D, 1 G. Status is projected from the ranking (every ranked player assumed available); no real NHL schedule or confirmed-goalie feed is connected yet.';
  const groupByCode = Object.fromEntries(order.groups.map(g => [g.position_group, g]));
  const lines = V.buildLines(order.groups);
  $('lines').innerHTML = lines.map(line => `<div class="line" role="group" aria-label="Line ${line.line}"><h4>Line ${line.line}${line.line === 1 ? ' (starters)' : ''}</h4>${
    line.slots.map(s => {
      if (s.beyondDepth) return '';
      if (!s.player) return `<div class="prow vacant"><span class="pos">${s.group}</span><span class="nm muted">Empty - rank a ${s.group} here</span><span></span><span></span></div>`;
      const g = groupByCode[s.group], p = s.player;
      const st = V.playerState(p, resolved, []);
      const label = st.state === 'active' ? 'Projected' : st.state === 'idle' ? 'Idle' : 'Unknown';
      const conf = s.group === 'G' ? `<span class="st ${st.confirmed ? 'confirmed' : 'unknown'}">${st.confirmed ? 'Confirmed' : 'Unconfirmed'}</span>` : '';
      return `<div class="prow" data-group="${s.group}" data-rank="${s.rank}" ${editable ? 'draggable="true"' : ''}>
        <span class="pos" title="${esc(p.position)}">${esc(p.position)}</span>
        <span class="nm" title="${esc(p.display_name)}">${esc(p.display_name)}</span>
        <span style="display:inline-flex;gap:4px;flex-wrap:wrap;justify-content:flex-end"><span class="st ${st.state}">${label}</span>${conf}</span>
        <span class="mv">${editable ? `
          <button type="button" data-act="up" aria-label="Move ${esc(p.display_name)} up in ${s.group} ranking, now ${s.rank}" ${s.rank === 1 ? 'disabled' : ''}>▲</button>
          <button type="button" data-act="down" aria-label="Move ${esc(p.display_name)} down in ${s.group} ranking, now ${s.rank}" ${s.rank >= g.ranked.length ? 'disabled' : ''}>▼</button>` : ''}</span>
      </div>`;
    }).join('')}</div>`).join('');

  const unranked = order.groups.filter(g => g.unranked.length);
  $('unranked').innerHTML = unranked.length ? unranked.map(g => `<details class="unranked"><summary>${g.unranked.length} unranked ${g.position_group}</summary>${
    g.unranked.map(p => `<div class="prow" style="grid-template-columns:22px minmax(0,1fr) auto"><span class="pos">${esc(p.position)}</span><span class="nm">${esc(p.display_name)}</span>${
      editable ? `<button type="button" class="btn btn-secondary" style="padding:4px 10px;font-size:12px" data-add="${p.player_id}" data-group="${g.position_group}" ${g.ranked.length >= g.max_depth ? 'disabled title="Ranking is full"' : ''}>Rank</button>` : '<span></span>'}</div>`).join('')}</details>`).join('') : '';

  $('lines').querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    const row = b.closest('.prow'), g = groupByCode[row.dataset.group];
    const ids = V.reorder(g, Number(row.dataset.rank), b.dataset.act === 'up' ? -1 : 1);
    if (ids) saveGroup(g.position_group, ids, `${g.position_group} ranking updated.`, row.dataset.rank, b.dataset.act);
  });
  $('unranked').querySelectorAll('button[data-add]').forEach(b => b.onclick = () => {
    const g = groupByCode[b.dataset.group];
    const ids = V.addToDepth(g, Number(b.dataset.add));
    if (ids) saveGroup(g.position_group, ids, `Added to the ${g.position_group} ranking.`);
  });
  if (editable) wireDrag(groupByCode);
}

// Drag-and-drop is a convenience on top of the buttons, never the only way to reorder.
function wireDrag(groupByCode) {
  let from = null;
  $('lines').querySelectorAll('.prow[draggable="true"]').forEach(row => {
    row.ondragstart = (e) => { from = {group: row.dataset.group, rank: Number(row.dataset.rank)}; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', ''); } catch (x) {} };
    row.ondragover = (e) => { if (from && from.group === row.dataset.group) { e.preventDefault(); row.classList.add('dragover'); } };
    row.ondragleave = () => row.classList.remove('dragover');
    row.ondrop = (e) => {
      e.preventDefault(); row.classList.remove('dragover');
      if (!from || from.group !== row.dataset.group) return;
      const to = Number(row.dataset.rank), g = groupByCode[from.group];
      if (to === from.rank) return;
      const ids = g.ranked.slice().sort((a, b) => a.priority - b.priority).map(p => p.player_id);
      const [m] = ids.splice(from.rank - 1, 1); ids.splice(to - 1, 0, m);
      saveGroup(g.position_group, ids, `${g.position_group} ranking updated.`);
      from = null;
    };
  });
}

async function saveGroup(group, ids, okMsg, focusRank, act) {
  if (busy) return;
  busy = true; showError(''); showResult('');
  try {
    order = await api(`/teams/${teamId}/pecking-order`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({assignments: {[group]: ids}}),
    });
    await loadResolve();
    showResult(okMsg);
  } catch (e) { showError(e.message); }
  busy = false;
  renderLines();
  if (focusRank) {   // keep keyboard focus on the moved player's button
    const newRank = Number(focusRank) + (act === 'up' ? -1 : 1);
    const btn = document.querySelector(`.prow[data-group="${group}"][data-rank="${newRank}"] button[data-act="${act}"]:not(:disabled)`)
      || document.querySelector(`.prow[data-group="${group}"][data-rank="${newRank}"] button:not(:disabled)`);
    if (btn) btn.focus();
  }
}

// Projected only: every ranked player is assumed to dress. There is no schedule/goalie feed to say otherwise.
async function loadResolve() {
  const ids = [];
  order.groups.forEach(g => g.ranked.forEach(p => ids.push(p.player_id)));
  resolved = await FSC.post(`/teams/${teamId}/pecking-order/resolve`, {scheduled_player_ids: ids, confirmed_goalie_ids: []});
}

// ---- series tabs ----
function renderSeries() {
  const list = schedule.series;
  if (!list.length) {
    $('series-bar').innerHTML = '';
    $('tabs').innerHTML = `<div class="panel-state" style="width:100%"><h3>No schedule yet</h3><p class="muted" style="margin:0">The commissioner hasn't generated this league's series schedule.</p></div>`;
    return;
  }
  const s = list[seriesIdx];
  $('series-bar').innerHTML = `<button type="button" class="btn btn-secondary" id="prev-series" aria-label="Previous series" ${seriesIdx === 0 ? 'disabled' : ''}>‹</button>
    <strong>Series ${seriesIdx + 1} of ${list.length}</strong>
    <span class="muted">vs ${esc(s.opponent_name)} · ${V.dayLabel(s.start_date)} – ${V.dayLabel(s.end_date)} · ${s.total_days} days · ${esc(statusLabel(s.status))}</span>
    <button type="button" class="btn btn-secondary" id="next-series" aria-label="Next series" ${seriesIdx >= list.length - 1 ? 'disabled' : ''}>›</button>`;
  $('prev-series').onclick = () => { seriesIdx--; dayIdx = 0; renderSeries(); renderPanel(); };
  $('next-series').onclick = () => { seriesIdx++; dayIdx = 0; renderSeries(); renderPanel(); };

  const tabs = V.seriesTabs(s);
  $('tabs').innerHTML = tabs.map((t, i) => `<button type="button" role="tab" id="tab-${i}" class="tab${t.off ? ' off' : ''}" aria-selected="${i === dayIdx}" tabindex="${i === dayIdx ? 0 : -1}" aria-controls="panel">
      <span class="d">${esc(t.label)}</span>
      <span class="o">${t.off ? '<span class="muted">OFF DAY</span>' : `<span class="logo" aria-hidden="true">${esc(V.initials(t.opponent))}</span><span>${t.homeAway === 'home' ? 'vs' : '@'} ${esc(t.opponent)}</span>`}</span>
      <span class="s muted">${esc(statusLabel(t.status))}</span>
      <span class="gs ${V.gameScoreClass(t.gameScore)}" title="The Game Score is not available yet">${t.gameScore == null ? 'Game Score —' : 'Game Score ' + t.gameScore}</span>
      ${bankBadge(t)}
    </button>`).join('');
  const btns = Array.from($('tabs').querySelectorAll('.tab'));
  btns.forEach((b, i) => {
    b.onclick = () => { dayIdx = i; renderSeries(); renderPanel(); $(`tab-${i}`).focus(); };
    b.onkeydown = (e) => {
      const k = {ArrowRight: 1, ArrowLeft: -1}[e.key];
      let n = i;
      if (k) n = Math.min(btns.length - 1, Math.max(0, i + k));
      else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = btns.length - 1; else return;
      e.preventDefault(); dayIdx = n; renderSeries(); renderPanel(); $(`tab-${n}`).focus();
    };
  });
}

// ---- matchup panel shell: truthful, no fabricated live data ----
function renderPanel() {
  const team = teams.find(t => t.id === teamId);
  const s = schedule.series[seriesIdx];
  if (!s) { $('panel').innerHTML = `<div class="panel-state"><h3>Nothing scheduled</h3><p class="muted" style="margin:0">There is no matchup to show for ${esc(team.name)} yet.</p></div>`; return; }
  const t = V.seriesTabs(s)[dayIdx];
  $('panel').setAttribute('role', 'tabpanel');
  $('panel').setAttribute('aria-labelledby', `tab-${dayIdx}`);
  const head = t.off
    ? `<h3 style="margin:0">${esc(t.label)} · off day</h3><p class="muted">${esc(team.name)} don't play on this day of the series.</p>`
    : `<h3 style="margin:0">${esc(t.label)} · ${esc(team.name)} ${t.homeAway === 'home' ? 'vs' : '@'} ${esc(t.opponent)}</h3>
       <p class="muted">${esc(statusLabel(t.status))} · ${t.homeAway === 'home' ? 'Home' : 'Away'}</p>`;
  const open = !t.off && t.dailyGameId
    ? `<p><a class="btn btn-primary" id="open-game" href="/static/nhl-game.html?daily_game_id=${t.dailyGameId}&league_id=${LEAGUE_ID}&team_id=${teamId}">Open game (watch or box score)</a></p>` : '';
  $('panel').innerHTML = `${head}${open}
    <div class="panel-state" id="sim-not-ready">
      <h3>No score on this panel</h3>
      <p class="muted" style="margin:0 auto;max-width:44ch">This panel never shows a score on its own. Open the game to watch it or jump to the box score; if no simulation has been published for the day, the game page says so. Nothing here is simulated or made up.</p>
    </div>`;
}

// ---- off-day banking (FS-029). Everything shown comes from the FS-028 API; nothing is calculated here. ----
const B = window.NhlBanking;
let bank = {state: 'idle', credits: [], error: ''};   // idle | loading | ready | hidden | error
let ui = {creditId: null, rec: null, view: null, recError: null, loadingRec: false, picking: false, selected: null, confirming: false, submitting: false};
const resetUi = () => { ui = {creditId: null, rec: null, view: null, recError: null, loadingRec: false, picking: false, selected: null, confirming: false, submitting: false}; };
const dayLabel = (d) => V.dayLabel(d);
let bankIndex = {};

function bankBadge(t) {
  const b = bank.state === 'ready' && t.dailyGameId != null ? B.tabBadges(bank.credits)[t.dailyGameId] : null;
  return b ? `<span class="bk${b.auto ? ' auto' : ''}" title="${esc(b.name)} banked ${B.fmtPts(b.points)} pts${b.auto ? ' automatically' : ''}">+${B.fmtPts(b.points)} banked${b.auto ? ' (auto)' : ''}</span>` : '';
}

async function loadBanking(keepSelection) {
  const team = teams.find(t => t.id === teamId);
  if (!canManage(team)) { bank = {state: 'hidden', credits: [], error: ''}; resetUi(); renderBank(); renderSeries(); return; }
  bank.state = 'loading'; renderBank();
  try {
    const d = await api(`/teams/${teamId}/banked-credits`);
    bank = {state: 'ready', credits: B.sortCredits(d.credits), error: '', cap: d.cap, fallbackHours: d.fallback_hours};
    if (!keepSelection) resetUi();
    if (ui.creditId && !bank.credits.find(c => c.id === ui.creditId && c.status === 'AVAILABLE')) resetUi();
  } catch (e) {
    bank = e.status === 400 ? {state: 'hidden', credits: [], error: ''} : {state: 'error', credits: [], error: e.message};
  }
  renderBank(); renderSeries();
}

function renderBankAlert() {
  const el = $('bank-alert');
  const a = bank.state === 'ready' ? B.alertSummary(bank.credits, Date.now(), bank.cap) : null;
  if (!a) { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.className = 'bank-alert' + (a.urgent ? ' urgent' : '');
  el.style.display = 'flex';
  el.innerHTML = `<span class="msg"><strong>Banked credit${a.count > 1 ? 's' : ''}:</strong> ${esc(a.text)}</span><button type="button" class="btn btn-primary" id="bank-review">Review ${a.count > 1 ? 'credits' : 'options'}</button>`;
  $('bank-review').onclick = () => { setZone('panel'); openCredit(a.firstId, true); };
}

function creditHtml(c) {
  const st = B.stateOf(c);
  const sel = ui.creditId === c.id;
  const cd = c.status === 'AVAILABLE' ? B.fallbackCountdown(c, Date.now()) : null;
  return `<li class="credit${sel ? ' sel' : ''}" style="list-style:none" data-credit="${c.id}">
    <div class="top"><strong>${esc(c.player_name)}</strong>
      <span><span class="chip ${st.tone}">${esc(st.label)}</span>${st.capped ? ' <span class="chip cap">Capped</span>' : ''}</span></div>
    <div class="muted" style="font-size:13px">${esc(V.dayLabel(c.source_calendar_date))} off day · ${esc(B.pointsText(c, bank.cap))}</div>
    ${cd ? `<div style="font-size:13px">${esc(cd.text)}</div>` : `<div style="font-size:13px">${esc(B.outcomeText(c, bankIndex))}</div>`}
    ${c.status === 'AVAILABLE' ? `<div><button type="button" class="btn btn-secondary" data-open="${c.id}" aria-expanded="${sel}" aria-controls="reco">${sel ? 'Hide options' : 'Choose a game'}</button></div>` : ''}
    ${sel ? '<div id="reco" aria-live="polite"></div>' : ''}
  </li>`;
}

function renderBank() {
  renderBankAlert();
  const el = $('bank-section');
  if (!B || bank.state === 'idle') { el.innerHTML = ''; return; }
  bankIndex = B.gameIndex(schedule, dayLabel);
  const head = '<h3 id="h-bank" style="margin:0 0 4px">Banked credits</h3>';
  if (bank.state === 'hidden') { el.innerHTML = `${head}<p class="muted" style="margin:0;font-size:13px">Off-day credits are only shown to the team's owner.</p>`; return; }
  if (bank.state === 'loading') { el.innerHTML = `${head}<div class="skeleton" style="width:50%"></div>`; return; }
  if (bank.state === 'error') { el.innerHTML = `${head}<p role="alert" style="margin:0 0 var(--space-2)">Couldn't load banked credits: ${esc(bank.error)}</p><button type="button" class="btn btn-secondary" id="bank-retry">Try again</button>`; $('bank-retry').onclick = () => loadBanking(); return; }
  const intro = `<p class="muted" style="margin:0 0 var(--space-2);font-size:13px">Points your players earn on an off day bank into a later game. One credit per game, up to ${B.fmtPts(bank.cap)} each. Unclaimed credits bank automatically after ${bank.fallbackHours} hours.</p>`;
  if (!bank.credits.length) { el.innerHTML = `${head}${intro}<div class="panel-state"><h3>No banked credits</h3><p class="muted" style="margin:0">Credits appear here when a rostered player scores on one of your off days.</p></div>`; return; }
  el.innerHTML = `${head}${intro}<ul style="margin:0;padding:0" aria-label="Banked credits">${bank.credits.map(creditHtml).join('')}</ul>`;
  el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openCredit(Number(b.dataset.open), ui.creditId !== Number(b.dataset.open)));
  renderReco();
}

async function openCredit(id, open) {
  if (ui.submitting) return;
  if (!open) { resetUi(); renderBank(); return; }
  resetUi(); ui.creditId = id; ui.loadingRec = true; renderBank();
  try {
    ui.rec = await api(`/banked-credits/${id}/recommendation`);
    ui.view = B.recommendationView(ui.rec, dayLabel);
  } catch (e) { ui.recError = B.bankError(e); }
  ui.loadingRec = false; renderBank();
  const r = $('reco'); if (r) { const h = r.querySelector('h4'); if (h) { h.tabIndex = -1; h.focus(); } }
}

function renderReco() {
  const el = $('reco');
  if (!el || !ui.creditId) return;
  const credit = bank.credits.find(c => c.id === ui.creditId);
  if (!credit) { el.innerHTML = ''; return; }
  if (ui.loadingRec) { el.innerHTML = '<div class="reco"><div class="skeleton" style="width:60%"></div><p class="muted" style="margin:0">Loading options…</p></div>'; return; }
  if (ui.recError && !ui.view) { el.innerHTML = `<div class="reco"><div class="err" role="alert"><strong>${esc(ui.recError.title)}</strong> ${esc(ui.recError.text)}</div><div class="row"><button type="button" class="btn btn-secondary" id="reco-refresh">Refresh</button></div></div>`; $('reco-refresh').onclick = () => openCredit(credit.id, true); return; }
  const v = ui.view;
  const dis = ui.submitting ? 'disabled aria-disabled="true"' : '';
  const err = ui.recError ? `<div class="err" role="alert"><strong>${esc(ui.recError.title)}</strong> ${esc(ui.recError.text)}</div>` : '';
  let body;
  if (!v.hasRecommendation) {
    body = `<p style="margin:0">${esc(v.confidenceNote)} This credit will expire at the end of its window.</p>`;
  } else if (ui.confirming) {
    const opt = v.options.find(o => o.id === ui.selected);
    body = `<p style="margin:0" id="confirm-text"><strong>${esc(B.confirmText(credit, opt, bank.cap))}</strong></p>
      <div class="row"><button type="button" class="btn btn-primary" id="reco-confirm" ${dis}>${ui.submitting ? 'Banking…' : 'Confirm'}</button>
      <button type="button" class="btn btn-secondary" id="reco-back" ${dis}>Back</button></div>`;
  } else if (ui.picking) {
    body = `<fieldset><legend>Choose a game</legend>${v.options.map(o => `<label class="opt"><input type="radio" name="bank-game" value="${o.id}" ${ui.selected === o.id ? 'checked' : ''}><span>${esc(o.label)}${o.recommended ? ' <span class="chip good">Recommended</span>' : ''}<span class="muted" style="display:block;font-size:12px">Rank ${o.rank}${o.strength ? ' · opponent ' + esc(o.strength) : ''}</span></span></label>`).join('')}</fieldset>
      <div class="row"><button type="button" class="btn btn-primary" id="reco-pick" ${ui.selected == null ? 'disabled aria-disabled="true"' : ''}>Review choice</button>
      <button type="button" class="btn btn-secondary" id="reco-cancel">Back to recommendation</button></div>`;
  } else {
    body = `<div><span class="chip ${v.confidenceKey === 'FULL' ? 'good' : v.confidenceKey === 'PARTIAL' ? 'info' : 'muted'}">${esc(v.confidenceLabel)}</span> <span class="muted" style="font-size:13px">${esc(v.confidenceNote)}</span></div>
      <details><summary>Why this game</summary><ul>${v.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      <ul class="inputs" aria-label="Inputs">${v.inputs.map(i => `<li class="${i.available ? 'yes' : 'no'}">${esc(i.label)}: ${esc(i.text)}</li>`).join('')}</ul></details>
      <div class="row"><button type="button" class="btn btn-primary" id="reco-accept" ${dis}>Accept recommendation</button>
      ${v.options.length > 1 ? `<button type="button" class="btn btn-secondary" id="reco-choose" ${dis}>Choose another game</button>` : ''}</div>`;
  }
  el.innerHTML = `<div class="reco" role="group" aria-labelledby="reco-h"><h4 id="reco-h" style="margin:0">${esc(credit.player_name)}: ${esc(ui.confirming ? 'confirm your choice' : ui.picking ? 'choose a game' : v.headline)}</h4>${err}${body}</div>`;
  const on = (id, fn) => { const b = $(id); if (b) b.onclick = fn; };
  on('reco-accept', () => { ui.selected = v.recommendedId; ui.confirming = true; ui.recError = null; renderReco(); const b = $('reco-confirm'); if (b) b.focus(); });
  on('reco-choose', () => { ui.picking = true; ui.selected = null; ui.recError = null; renderReco(); const r = el.querySelector('input[type=radio]'); if (r) r.focus(); });
  on('reco-cancel', () => { ui.picking = false; ui.selected = null; renderReco(); const b = $('reco-choose'); if (b) b.focus(); });
  on('reco-back', () => { ui.confirming = false; renderReco(); });
  on('reco-pick', () => { ui.picking = false; ui.confirming = true; renderReco(); const b = $('reco-confirm'); if (b) b.focus(); });
  on('reco-confirm', submitBank);
  el.querySelectorAll('input[name=bank-game]').forEach(r => r.onchange = () => { ui.selected = Number(r.value); const b = $('reco-pick'); if (b) { b.disabled = false; b.removeAttribute('aria-disabled'); } });
}

// One request at a time: a double click, a second tap or Enter held down must not assign twice.
async function submitBank() {
  if (ui.submitting) return;
  const credit = bank.credits.find(c => c.id === ui.creditId);
  if (!credit || ui.selected == null) return;
  ui.submitting = true; ui.recError = null; renderReco();
  try {
    const done = await FSC.post(`/banked-credits/${credit.id}/assign`, {daily_game_id: ui.selected});
    const label = bankIndex[done.assigned_daily_game_id] ? B.gameText(bankIndex[done.assigned_daily_game_id]) : 'the game';
    ui.submitting = false;
    await loadBanking();
    showResult(`Banked ${B.fmtPts(done.applied_points)} pts from ${done.player_name} to ${label}.`);
  } catch (e) {
    ui.submitting = false;
    ui.recError = B.bankError(e);
    ui.confirming = false; ui.picking = false;
    if (ui.recError.refresh) { const keep = ui.recError; await loadBanking(true); if (ui.creditId) { await refreshReco(); ui.recError = keep; } }
    renderReco();
  }
}

async function refreshReco() {
  try { ui.rec = await api(`/banked-credits/${ui.creditId}/recommendation`); ui.view = B.recommendationView(ui.rec, dayLabel); }
  catch (e) { ui.view = null; ui.recError = B.bankError(e); resetUi(); }
}

// ---- loading ----
async function loadTeam() {
  showError(''); showResult('');
  pageState(`<div class="skeleton" style="width:60%;margin:8px auto"></div><div class="skeleton" style="width:40%;margin:8px auto"></div><p class="muted">Loading ${esc(teams.find(t => t.id === teamId).name)}…</p>`);
  try {
    const [o, sch] = await Promise.all([api(`/teams/${teamId}/pecking-order`), api(`/teams/${teamId}/series-schedule`)]);
    order = o; schedule = sch;
    await loadResolve();
  } catch (e) {
    pageState(`<h3>Couldn't load this team</h3><p class="muted">${esc(e.message)}</p><button class="btn btn-primary" id="retry">Try again</button>`);
    $('retry').onclick = loadTeam;
    return;
  }
  seriesIdx = Math.max(0, V.pickSeries(schedule.series, today())); dayIdx = 0;
  const first = schedule.series[seriesIdx];
  if (first) { const i = first.games.findIndex(g => g.calendar_date >= today()); dayIdx = i >= 0 ? i : 0; }
  pageState('');
  bank = {state: 'idle', credits: [], error: ''}; resetUi();
  renderLines(); renderSeries(); renderPanel();
  loadBanking();
}

async function init() {
  if (!LEAGUE_ID) { pageState('<h3>No league selected</h3><p class="muted">Open this page from a league: add <code>?league_id=…</code>.</p>'); return; }
  $('nav-league').href = `/static/league.html?league_id=${LEAGUE_ID}`;
  try {
    [league, teams] = await Promise.all([api(`/leagues/${LEAGUE_ID}`), api(`/leagues/${LEAGUE_ID}/teams`)]);
  } catch (e) {
    pageState(`<h3>Couldn't load this league</h3><p class="muted">${esc(e.message)}</p><button class="btn btn-primary" id="retry">Try again</button>`);
    $('retry').onclick = init; return;
  }
  $('nav-brand').textContent = league.name;
  if (league.series_length_days == null) {
    pageState(`<h3>Not an NHL league</h3><p class="muted">Series schedules and pecking orders only exist for NHL leagues.</p><a class="btn btn-secondary" href="/static/league.html?league_id=${LEAGUE_ID}">Back to league home</a>`);
    return;
  }
  me = await FSC.current();
  if (!teams.length) { pageState('<h3>No teams yet</h3><p class="muted">This league has no teams.</p>'); return; }
  $('kicker').textContent = `NHL · ${league.series_length_days}-day series · ${teams.length} teams`;
  const sel = $('team-select');
  sel.innerHTML = teams.map(t => `<option value="${t.id}">${esc(t.name)}${me && t.owner_user_id === me.user_id ? ' (yours)' : ''}</option>`).join('');
  sel.disabled = false;
  const want = Number(params.get('team_id'));
  const mine = me && teams.find(t => t.owner_user_id === me.user_id);
  teamId = (teams.find(t => t.id === want) || mine || teams[0]).id;
  sel.value = String(teamId);
  sel.onchange = () => { teamId = Number(sel.value); loadTeam(); };
  await loadTeam();
}
init();
</script>
