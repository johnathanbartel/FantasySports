<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Leagues - FantasyMotion</title>
<link rel="stylesheet" href="/static/styles.css">
<style>body{margin:0}</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">

  <div class="nav" style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:var(--space-4)">
      <a href="/static/index.html" class="nav-brand" style="text-decoration:none;color:inherit;font-weight:700">FantasyMotion</a>
      <a href="/static/index.html">Home</a>
      <a href="/static/dashboard.html" aria-current="page">My leagues</a>
    </div>
    <div id="nav-auth" style="display:flex;align-items:center;gap:var(--space-3)"></div>
  </div>

  <div style="max-width:1240px;margin:0 auto;padding:var(--space-8) var(--space-5)">
    <div style="margin-bottom:var(--space-6)">
      <div class="card-kicker" style="margin-bottom:var(--space-1);color:var(--color-accent);font-weight:600">Your league. Your rules. Your universe.</div>
      <h1 style="margin:0 0 var(--space-2)">My leagues</h1>
      <p class="text-muted" style="max-width:640px;margin:0">Every league you commission or play in, across all sports.</p>
    </div>

    <div id="error-banner" role="alert" style="display:none;margin-bottom:var(--space-4)"></div>
    <div id="signin-box" style="display:none;flex-direction:column;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--color-divider);border-radius:var(--radius-md);margin-bottom:var(--space-4);background:var(--color-surface)">
      <div><strong>Sign in to view your leagues</strong></div>
      <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap">
        <a href="/static/login.html?redirect=%2Fstatic%2Fdashboard.html" class="btn btn-primary">Sign in / Create Account</a>
        <span class="text-muted" style="font-size:13px">or test user picker:</span>
        <select id="signin-select" style="padding:6px 10px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text)"></select>
        <button class="btn btn-secondary" id="signin-btn">Select User</button>
      </div>
    </div>

    <div id="sport-filter" style="display:flex;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-5)"></div>
    <div id="leagues" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--space-4)"></div>
  </div>
</div>

<script src="/static/session.js"></script>
<script>
const SPORT_LABELS = {ncaaf: 'College Football', nfl: 'Football', nhl: 'Hockey', nba: 'Basketball', mlb: 'Baseball'};
const sportLabel = code => SPORT_LABELS[code] || String(code).toUpperCase();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DRAFT_LABELS = {not_started: 'Draft not started', in_progress: 'Draft in progress', complete: 'Draft complete'};

let all = [];
let filter = 'ALL';

function showError(msg) {
  const el = document.getElementById('error-banner');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

function leagueHref(l) {
  const team = l.my_team_ids[0];
  return `/static/league.html?league_id=${l.league_id}${team ? '&team_id=' + team : ''}`;
}

function draftHref(l) {
  const team = l.my_team_ids[0];
  const q = `league_id=${l.league_id}${team ? '&team_id=' + team : ''}`;
  if (l.draft_type === 'snake') return `/static/draft-board.html?${q}`;
  return leagueHref(l);
}

function renderFilter() {
  const codes = [...new Set(all.flatMap(l => l.sports))].sort();
  const el = document.getElementById('sport-filter');
  el.innerHTML = '';
  if (codes.length < 2) return;
  ['ALL', ...codes].forEach(c => {
    const b = document.createElement('button');
    b.className = `btn ${filter === c ? 'btn-primary' : 'btn-secondary'}`;
    b.textContent = c === 'ALL' ? 'All sports' : sportLabel(c);
    b.onclick = () => { filter = c; render(); };
    el.appendChild(b);
  });
}

function card(l) {
  const full = l.teams_filled >= l.size;
  const role = [l.is_commissioner ? 'Commissioner' : null, l.my_team_names.length ? l.my_team_names.map(esc).join(', ') : null]
    .filter(Boolean).join(' · ');
  const draftTag = l.draft_state === 'complete' ? 'tag-neutral' : l.draft_state === 'in_progress' ? 'tag-accent' : 'tag-accent-2';
  const sched = l.draft_state === 'not_started' && l.draft_scheduled_at
    ? `<div class="text-muted" style="font-size:12px">Scheduled ${esc(new Date(l.draft_scheduled_at + 'Z').toLocaleString())}</div>` : '';
  const draftBtn = l.draft_state === 'complete' ? ''
    : `<a class="btn btn-secondary" href="${draftHref(l)}">${l.draft_state === 'in_progress' ? 'Draft room' : (l.is_commissioner ? 'Set up draft' : 'Draft')}</a>`;
  const commishActions = l.is_commissioner ? `
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-divider);align-items:center;justify-content:space-between">
      <span class="text-muted" style="font-size:12px;font-weight:600">Commissioner tools</span>
      <div style="display:flex;gap:var(--space-2)">
        <button class="btn btn-secondary" style="font-size:12px;padding:3px 8px" data-rename-league="${l.league_id}">Rename</button>
        <button class="btn btn-secondary" style="font-size:12px;padding:3px 8px;color:#b91c1c;border-color:color-mix(in srgb, #b91c1c 35%, transparent)" data-delete-league="${l.league_id}">Delete</button>
      </div>
    </div>` : '';
  return `<div class="card elev-sm" style="padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)">
    <div style="display:flex;justify-content:space-between;gap:var(--space-2);align-items:baseline">
      <h3 style="margin:0">${esc(l.name)}</h3>
      <span class="tag tag-neutral">${l.sports.map(sportLabel).map(esc).join(' + ') || '—'}</span>
    </div>
    <div class="text-muted" style="font-size:13px">${role || '—'}</div>
    <div style="font-size:14px">${l.teams_filled} of ${l.size} teams${full ? '' : ' · <strong>not full</strong>'}</div>
    <div><span class="tag ${draftTag}">${DRAFT_LABELS[l.draft_state] || esc(l.draft_state)}</span></div>
    ${sched}
    <div style="display:flex;gap:var(--space-2);margin-top:var(--space-2);flex-wrap:wrap">
      <a class="btn btn-primary" href="${leagueHref(l)}">Open league</a>${draftBtn}
    </div>
    ${commishActions}
  </div>`;
}

async function onRenameLeague(l) {
  showError('');
  const newName = window.prompt('Enter new league name:', l.name);
  if (newName === null) return;
  const trimmed = newName.trim();
  if (!trimmed) {
    showError('League name cannot be empty');
    return;
  }
  if (trimmed === l.name) return;
  try {
    const updated = await FSC.api(`/leagues/${l.league_id}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: trimmed})
    });
    l.name = (updated && updated.name) || trimmed;
    render();
  } catch (err) {
    showError(err.message || 'Failed to rename league');
  }
}

async function onDeleteLeague(l) {
  showError('');
  const confirmed = window.confirm(`Are you sure you want to delete "${l.name}"? This cannot be undone and will delete all associated teams, drafts, and records.`);
  if (!confirmed) return;
  try {
    await FSC.api(`/leagues/${l.league_id}`, {
      method: 'DELETE'
    });
    all = all.filter(x => x.league_id !== l.league_id);
    render();
  } catch (err) {
    showError(err.message || 'Failed to delete league');
  }
}

function render() {
  renderFilter();
  const shown = filter === 'ALL' ? all : all.filter(l => l.sports.includes(filter));
  const el = document.getElementById('leagues');
  el.innerHTML = shown.length ? shown.map(card).join('')
    : `<p class="text-muted">You're not in any leagues yet. <a href="/static/create-league.html">Create one</a>.</p>`;

  el.querySelectorAll('[data-rename-league]').forEach(btn => {
    btn.onclick = () => {
      const lid = Number(btn.getAttribute('data-rename-league'));
      const lg = all.find(x => x.league_id === lid);
      if (lg) onRenameLeague(lg);
    };
  });
  el.querySelectorAll('[data-delete-league]').forEach(btn => {
    btn.onclick = () => {
      const lid = Number(btn.getAttribute('data-delete-league'));
      const lg = all.find(x => x.league_id === lid);
      if (lg) onDeleteLeague(lg);
    };
  });
}

async function start() {
  const session = await FSC.current();
  FSC.renderNav('nav-auth');
  if (!session) {
    document.getElementById('signin-box').style.display = 'flex';
    const users = await fetch('/users').then(r => r.json()).catch(() => []);
    document.getElementById('signin-select').innerHTML = users.map(u => `<option value="${u.id}">${esc(u.display_name)}</option>`).join('');
    document.getElementById('signin-btn').onclick = async () => { await FSC.signIn(Number(document.getElementById('signin-select').value)); location.reload(); };
    return;
  }
  try { all = await FSC.api('/leagues/mine/dashboard'); } catch (e) { showError(e.message); return; }
  render();
}
start();
</script>
</body>
</html>
