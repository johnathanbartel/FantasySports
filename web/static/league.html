<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Home - FantasyMotion</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body{margin:0}
  .inp{padding:8px 10px;border-radius:var(--radius-md);border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);font-size:14px;font-family:var(--font-body);max-width:100%}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--color-divider);margin-bottom:var(--space-5)}
  .tab{padding:10px 16px;cursor:pointer;font-family:var(--font-heading);font-size:15px;border:0;background:none;color:color-mix(in srgb, var(--color-text) 65%, transparent);border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--color-text)}
  .tab.on{color:var(--color-text);border-bottom-color:var(--color-accent)}
  .grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:var(--space-5);align-items:start}
  .stat{padding:var(--space-3) var(--space-4);gap:2px}
  .stat .v{font-family:var(--font-heading);font-size:22px}
  .stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent)}
  .stat .s{font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent)}
  .chip{padding:5px 12px;border-radius:999px;border:1px solid var(--color-divider);background:var(--color-surface);color:var(--color-text);font-size:13px;cursor:pointer;font-family:var(--font-body)}
  .chip.on{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent)}
  .chip .n{opacity:.65;margin-left:4px}
  .row{display:flex;align-items:center;gap:var(--space-3);padding:7px 0;border-top:1px solid var(--color-divider);font-size:14px}
  .row:first-child{border-top:0}
  .pts{font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
  .muted{color:color-mix(in srgb, var(--color-text) 60%, transparent)}
  th.sort{cursor:pointer;user-select:none}
  th.sort:hover{color:var(--color-accent)}
  .note{background:color-mix(in srgb, var(--color-accent) 9%, transparent);border:1px solid color-mix(in srgb, var(--color-accent) 40%, transparent);padding:var(--space-3);border-radius:var(--radius-md);font-size:13px}
  .rk{font-size:12px;font-weight:700;color:var(--color-accent);margin-right:5px}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--color-divider)}
  .pill.ai{border-color:var(--color-accent);color:var(--color-accent)}
  .sb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--space-4);margin-bottom:var(--space-6)}
  .sb-card{padding:0;overflow:hidden;display:flex;flex-direction:column}
  .sb-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:color-mix(in srgb, var(--color-text) 5%, transparent);border-bottom:1px solid var(--color-divider)}
  .sb-status{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .sb-body{padding:6px 14px}
  .sb-team{display:flex;align-items:center;gap:12px;padding:10px 0}
  .sb-team + .sb-team{border-top:1px solid var(--color-divider)}
  .sb-logo{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;letter-spacing:.02em;color:#fff}
  .sb-name{flex:1;min-width:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}
  .sb-name span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-sog{font-size:12px;color:color-mix(in srgb, var(--color-text) 60%, transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sb-score{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:right;line-height:1}
  .sb-team.lead .sb-score,.sb-team.lead .sb-name{color:var(--color-text)}
  .sb-team.trail .sb-score,.sb-team.trail .sb-name{opacity:.6}
  .sb-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--color-divider);margin-top:auto}
  @media (max-width: 480px){ .sb-grid{grid-template-columns:minmax(0,1fr)} }
  @media (max-width: 860px){ .grid2{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">

  <div class="nav" style="display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-divider)">
    <div style="display:flex;align-items:center;gap:var(--space-4)">
      <a href="/static/index.html" class="nav-brand" style="text-decoration:none;color:inherit;font-weight:700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span id="nav-brand">League</span>
      </a>
      <a href="/static/index.html">Home</a>
      <a href="/static/dashboard.html">My leagues</a>
      <a href="/static/create-league.html">Create league</a>
      <a href="/static/commissioner.html" id="nav-cm">Commissioner mode</a>
    </div>
    <div id="nav-auth" style="display:flex;align-items:center;gap:var(--space-3)"></div>
  </div>

  <div id="page-wrap" style="max-width:1160px;margin:0 auto;padding:var(--space-6) var(--space-5) var(--space-8);transition:max-width .2s">

    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-4);flex-wrap:wrap">
      <div>
        <div class="card-kicker" id="kicker" style="margin-bottom:var(--space-1)">&nbsp;</div>
        <h1 style="margin:0" id="league-name">&nbsp;</h1>
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
        <a id="hdr-draft-btn" href="#" class="btn btn-primary" style="display:none;font-size:13px;font-weight:700;align-items:center;gap:6px;box-shadow:0 0 10px rgba(34,197,94,0.35)"><span style="width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block"></span> Open Draft Board</a>
        <button type="button" class="btn btn-secondary" id="btn-how-scoring-works" style="font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer"><span style="font-size:14px">ℹ️</span> How Scoring Works</button>
        <button type="button" class="btn btn-secondary" id="invite-btn" style="font-size:13px">Copy Invite Link</button>
        <span id="invite-copied-msg" class="text-muted" style="font-size:12px;display:none">Copied!</span>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div id="error-banner" style="display:none;background:var(--color-accent-2-100);color:var(--color-accent-2-800);padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-4)"></div>
    <div id="result-banner" style="display:none;background:var(--color-accent-100);color:var(--color-accent-800);padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-4)"></div>

    <div id="signin-box" style="display:none;gap:var(--space-3);align-items:center;margin-bottom:var(--space-4);padding:var(--space-3);border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface);flex-wrap:wrap">
      <a id="signin-page-link" href="/static/login.html" class="btn btn-primary" style="font-size:13px">Sign in / Register</a>
      <span class="text-muted" style="font-size:12px">or test user picker:</span>
      <select id="signin-select" class="inp" style="padding:4px 8px"></select>
      <button class="btn btn-secondary" id="signin-btn" style="font-size:13px">Select User</button>
    </div>

    <div id="content"></div>
  </div>
</div>

<script src="/static/session.js?v=20261013"></script>
<script src="/static/roster-lines.js?v=20261013"></script>
<script src="/static/roster-grid.js?v=20261013"></script>
<script src="/static/assign-team-modal.js?v=20261013"></script>
<script src="/static/conference-modal.js?v=20261013"></script>
<script src="/static/scoring-modal.js?v=20261013"></script>
<script>
const params = new URLSearchParams(location.search);
const LEAGUE_ID = params.get('league_id');
const api = FSC.api;
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS_LABEL = {PK: 'K'};
let LAST = 'last season';   // the year the fantasy points are from (set from /config)
const FOOTBALL_POSITIONS = ['QB', 'RB', 'WR', 'TE', 'PK', 'DL', 'LB', 'DB'];
const HOCKEY_POSITIONS = ['C', 'LW', 'RW', 'D', 'G'];
let POSITIONS = FOOTBALL_POSITIONS;   // set from the league's universe in refreshOverview()
const isHockey = () => !!(ov && (ov.universe_codes || []).includes('nhl'));
const pts = (v) => v == null ? '-' : Number(v).toFixed(1);
const ppg = (v) => v == null ? '-' : Number(v).toFixed(2);
const money = (n) => n == null ? '-' : '$' + Math.round(n).toLocaleString();
const rk = (id) => teamsById[id]?.poll_rank ? `<span class="rk">#${teamsById[id].poll_rank}</span>` : '';
const tn = (id, fallback) => `${rk(id)}${esc(teamsById[id]?.name || fallback || id)}`;
const ALL_TABS = [['home', 'Home'], ['scoreboard', 'Scoreboard'], ['roster', 'Roster'], ['transactions', 'Transactions'], ['trades', 'Trades'], ['schedule', 'Schedule'],
              ['standings', 'Standings'], ['stats', 'Stats'], ['teams', 'Teams'], ['settings', 'Team Settings'], ['rankings', 'Rankings']];
// Rankings exist only for college leagues (College Football / College Basketball) to start.
const tabList = () => ALL_TABS.filter(([id]) => (id !== 'rankings' || (ov && ov.has_rankings)) && (id !== 'settings' || (ov && (myTeam() || isCommissioner))));

let me = null, ov = null, canActForAi = false, isCommissioner = false;
let tab = 'home';
let teamsById = {};
let activeTeamId = null;              // the team the Roster / Transactions tabs are looking at
let cache = {};                       // per-tab data
const view = {                        // per-tab UI state that survives re-renders
  fa: {pos: '', q: '', sort: 'points'}, log: {kind: '', team: ''}, stats: {pos: '', q: '', who: 'all', sort: 'last_season_points', dir: -1},
};

function showError(m) { const el = document.getElementById('error-banner'); el.textContent = m; el.style.display = m ? 'block' : 'none'; }
function showResult(m) { const el = document.getElementById('result-banner'); el.textContent = m; el.style.display = m ? 'block' : 'none'; }
const $ = (id) => document.getElementById(id);

// ---- who can do what -----------------------------------------------------------------
const myTeam = () => ov.teams.find(t => !t.is_ai_owned && t.owner_user_id === me);
const canManage = (t) => t && ((!t.is_ai_owned && t.owner_user_id === me) || (t.is_ai_owned && canActForAi));
const activeTeam = () => teamsById[activeTeamId];
const posTag = (p) => `<span class="tag tag-neutral" style="min-width:34px;justify-content:center">${POS_LABEL[p] || p || '-'}</span>`;

function renderTabs() {
  $('tabs').innerHTML = tabList().map(([id, label]) => `<button class="tab${tab === id ? ' on' : ''}" data-tab="${id}">${label}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
}

async function go(id, extra = {}) {
  tab = id;
  $('page-wrap').style.maxWidth = id === 'scoreboard' ? '1680px' : '1160px';
  if (typeof scoreboardAutoRefreshTimer !== 'undefined' && scoreboardAutoRefreshTimer) {
    clearInterval(scoreboardAutoRefreshTimer);
    scoreboardAutoRefreshTimer = null;
  }
  if (extra.team_id) activeTeamId = extra.team_id;
  showError(''); showResult('');
  const u = new URL(location.href); u.searchParams.set('tab', id);
  if (activeTeamId && (id === 'roster' || id === 'transactions' || id === 'trades')) u.searchParams.set('team_id', activeTeamId); else u.searchParams.delete('team_id');
  history.replaceState(null, '', u);
  renderTabs();
  $('content').innerHTML = '<p class="muted">Loading...</p>';
  try { await ({home: renderHome, scoreboard: renderScoreboard, roster: renderRoster, transactions: renderTransactions, trades: renderTrades, schedule: renderSchedule,
                standings: renderStandings, stats: renderStats, teams: renderTeams, settings: renderTeamSettings, rankings: renderRankings})[id](); }
  catch (e) { showError(e.message); $('content').innerHTML = ''; }
}

async function refreshOverview() {
  ov = await api(`/leagues/${LEAGUE_ID}/overview`);
  teamsById = Object.fromEntries(ov.teams.map(t => [t.id, t]));
  POSITIONS = isHockey() ? HOCKEY_POSITIONS : FOOTBALL_POSITIONS;
  const hdrDraftBtn = $('hdr-draft-btn');
  if (hdrDraftBtn) {
    if (isDraftSoonOrLive()) {
      hdrDraftBtn.href = draftBoardUrl();
      hdrDraftBtn.style.display = 'inline-flex';
    } else {
      hdrDraftBtn.style.display = 'none';
    }
  }
}

function isDraftSoonOrLive() {
  if (!ov || ov.draft_state === 'complete') return false;
  if (ov.draft_state === 'in_progress') return true;
  if (ov.draft_scheduled_at) {
    const raw = String(ov.draft_scheduled_at);
    const schedDate = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
    const diff = schedDate.getTime() - Date.now();
    return diff > 0 && diff <= 3600 * 1000;
  }
  return false;
}

function draftBoardUrl() {
  const mine = myTeam();
  return ov && ov.draft_type === 'snake'
    ? `/static/draft-board.html?league_id=${LEAGUE_ID}${mine ? '&team_id=' + mine.id : ''}`
    : `/static/recruiting-board.html?league_id=${LEAGUE_ID}`;
}

function draftTimeNote() {
  if (!ov) return '';
  if (ov.draft_state === 'in_progress') return 'Draft is live right now!';
  if (ov.draft_scheduled_at) {
    const raw = String(ov.draft_scheduled_at);
    const schedDate = new Date(raw.endsWith('Z') ? raw : raw + 'Z');
    const diffMs = schedDate.getTime() - Date.now();
    if (diffMs <= 0) return 'Draft starting now';
    const mins = Math.max(1, Math.round(diffMs / 60000));
    return mins === 1 ? 'Starts in ~1 minute' : `Starts in ${mins} minutes (${schedDate.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'})})`;
  }
  return 'Draft starting soon';
}

function draftLine() {
  const d = ov.draft;
  if (d.status === 'closed') return 'Recruiting complete';
  if (d.status === 'open') return d.phase === 'buffer' ? `Recruiting - between weeks (week ${d.current_period} next)` : `Recruiting - week ${d.current_period} of ${d.total_periods}`;
  return 'Recruiting not started';
}

function statCard(label, value, sub) { return `<div class="card elev-sm stat"><div class="l">${label}</div><div class="v">${value}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`; }

// ---- HOME ----------------------------------------------------------------------------------
async function renderHome() {
  await refreshOverview();
  const [log, standings] = await Promise.all([api(`/leagues/${LEAGUE_ID}/transactions?limit=8`), api(`/leagues/${LEAGUE_ID}/standings`)]);
  const played = standings.some(s => s.wins + s.losses + s.ties > 0);
  const mine = myTeam();
  const openSpots = ov.teams.reduce((n, t) => n + t.open_spots, 0);
  const fillNeeded = ov.free_agency_open && ov.ai_teams_with_open_spots > 0;
  const draftHero = isDraftSoonOrLive() ? `
    <div class="card elev-md" style="margin-bottom:var(--space-5);padding:var(--space-4) var(--space-5);background:linear-gradient(135deg, rgba(20,83,45,0.22), rgba(15,23,42,0.7));border:1.5px solid var(--color-accent);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:var(--space-4)">
        <div style="width:48px;height:48px;border-radius:var(--radius-md);background:var(--color-accent);color:white;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;box-shadow:0 0 12px rgba(34,197,94,0.4)">
          ⚡
        </div>
        <div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--color-accent)">
            ${ov.draft_state === 'in_progress' ? '● Live Draft Room' : '● Draft Starting Soon (Under 1 Hour)'}
          </div>
          <div style="font-size:20px;font-weight:800;margin-top:2px;font-family:var(--font-heading)">
            ${draftTimeNote()}
          </div>
          <div class="text-muted" style="font-size:13px;margin-top:2px">
            ${ov.draft_type === 'snake' ? 'Live Snake Draft Board' : 'Recruiting Board'} is open. Enter the draft room to track picks and draft your roster in real time.
          </div>
        </div>
      </div>
      <div>
        <a href="${draftBoardUrl()}" class="btn btn-primary" style="font-size:15px;padding:12px 24px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 0 16px rgba(34,197,94,0.4)">
          Open Draft Board →
        </a>
      </div>
    </div>` : '';
  $('content').innerHTML = `
    ${draftHero}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--space-3);margin-bottom:var(--space-5)">
      ${statCard('Teams', ov.teams.length, `${ov.teams.filter(t => t.is_ai_owned).length} AI-owned`)}
      ${statCard('Roster size', ov.roster_size, `${openSpots} open spot${openSpots === 1 ? '' : 's'} across the league`)}
      ${ov.draft_type === 'snake'
        ? statCard('Draft', isDraftSoonOrLive() ? `<span style="color:var(--color-accent)">${ov.draft_state === 'in_progress' ? 'In progress' : 'Starting soon'}</span>` : ({complete: 'Complete', in_progress: 'In progress', not_started: 'Not started'}[ov.draft_state] || ov.draft_state), isDraftSoonOrLive() ? `<a href="${draftBoardUrl()}" style="font-weight:600">Open draft board →</a>` : (ov.draft_state === 'complete' ? 'Every roster spot was drafted' : `${ov.roster_size} rounds, one per roster spot`))
        : statCard('Recruiting', ov.draft.status === 'closed' ? 'Complete' : ov.draft.status === 'open' ? `Week ${ov.draft.current_period}/${ov.draft.total_periods}` : 'Not started', draftLine())}
      ${statCard('Free agency', ov.free_agency_open ? 'Open' : 'Closed', ov.free_agency_open ? (ov.is_college ? 'Fill open roster spots' : 'Sign or drop any time') : (ov.draft_type === 'snake' ? 'Opens when the draft ends' : 'Opens when recruiting ends'))}
      ${ov.is_college ? statCard('Season', `${ov.season_weeks} weeks`, `+ ${ov.playoff_weeks} playoff weeks (free agency locked)`) : statCard('Season', isHockey() ? 'Series' : `${ov.season_weeks} weeks`, 'Schedule is set for you')}
    </div>
    ${fillNeeded && ov.is_college && isCommissioner ? `<div class="note" style="margin-bottom:var(--space-5);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap">
      <span><strong>${ov.ai_teams_with_open_spots} AI team${ov.ai_teams_with_open_spots === 1 ? '' : 's'}</strong> still have open roster spots. AI teams are required to fill them through free agency - this normally happens automatically when recruiting ends.</span>
      <button class="btn btn-primary" id="run-fill">Run AI free agency now</button></div>` : ''}
    ${fillNeeded && !ov.is_college ? `<div class="note" style="margin-bottom:var(--space-5)"><strong>${ov.ai_teams_with_open_spots} AI team${ov.ai_teams_with_open_spots === 1 ? '' : 's'}</strong> still have open roster spots. AI teams manage their own rosters and lines: each checks the free-agent pool every few hours and signs one player at a time, so they fill out over the next few days.</div>` : ''}
    <div class="grid2">
      <div class="card elev-sm" style="padding:var(--space-4) var(--space-5)">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">Recent transactions</h3><a href="#" id="all-txns">See all</a></div>
        <div style="margin-top:var(--space-2)">${log.length ? log.map(txnRow).join('') : '<p class="muted" style="margin:var(--space-2) 0 0">No transactions yet.</p>'}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--space-4)">
        ${mine ? `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5)">
          <div class="card-kicker">Your team</div><h3 style="margin:2px 0 4px">${tn(mine.id)}</h3>
          <div class="muted" style="font-size:13px">${ov.is_college ? `${esc(mine.program_size)} · ${esc(mine.conference_name || '')} · ${esc(mine.season_goal)}` : `${esc(mine.division_name ? ((mine.conference_name || 'Conference') + ' · ' + mine.division_name) : (mine.conference_name || 'Pro League'))}`}</div>
          <div style="margin:var(--space-2) 0">${mine.roster_count} / ${ov.roster_size} players${mine.open_spots ? ` · <strong>${mine.open_spots} open</strong>` : ''}</div>
          <div style="display:flex;gap:var(--space-2);flex-wrap:wrap"><button class="btn btn-secondary" data-go="roster" data-team="${mine.id}">Roster</button>
            <a class="btn btn-secondary" href="/static/lineup.html?league_id=${LEAGUE_ID}&team_id=${mine.id}">Set lineup</a>
            ${mine.open_spots && ov.free_agency_open ? `<button class="btn btn-primary" data-go="transactions" data-team="${mine.id}">Fill through free agency</button>` : ''}</div></div>`
          : `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5)"><div class="card-kicker">Commissioner</div><h3 style="margin:2px 0 4px">${esc(ov.commissioner_name || 'Commissioner')}</h3>
             <div class="muted" style="font-size:13px">${isCommissioner ? 'You run this league' + (canActForAi ? ' and can act for its AI teams (commissioner mode).' : '.') : 'You have no team in this league.'}</div></div>`}
        <div class="card elev-sm" style="padding:var(--space-4) var(--space-5)">
          <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">Standings</h3><a href="#" id="all-standings">Full standings</a></div>

// ---- NHL roster: positions down the left, Lines 1-4 across; click two players of one position to swap them ----
// ---- Opponent favorability for hockey matchups (higher = softer defense / better matchup for scoring) ----
const OPP_FAVORABILITY = {
  SJS: 9.2, CHI: 9.0, ANA: 8.7, MTL: 8.5, CBJ: 8.2, BUF: 7.8, OTT: 7.5,
  DET: 6.8, CAL: 6.5, CGY: 6.5, SEA: 6.2, WSH: 6.0, PIT: 5.8,
  EDM: 5.5, TOR: 5.4, COL: 5.0, TBL: 4.8, NYI: 4.6, NSH: 4.5,
  MIN: 4.2, VAN: 4.0, DAL: 3.6, NYR: 3.5, VGK: 3.2, CAR: 3.0,
  BOS: 2.8, FLA: 2.5, WPG: 2.4,
};

function matchupRating(game) {
  if (!game) return 5.0;
  const base = OPP_FAVORABILITY[game.opp] || 5.0;
  return base + (game.is_home ? 1.0 : -0.5);
}

// ---- NHL roster: positions down the left, Lines 1-3 across; click two players of one position to swap them ----
let gridGroups = [], gridSel = null;
let ilPlayers = [], ilCapacity = 0;   // the team's injured list (GET /teams/{id}/pecking-order)
let activeHockeyWindow = 1;
let hockeySchedule = null;
let poRealSchedules = {};

function getSeriesWindows(startDateStr) {
  if (!startDateStr) {
    return [
      { num: 1, label: 'Sun – Tue', full: 'Sunday – Monday – Tuesday', isSkipped: false, startDate: '', endDate: '' },
      { num: 2, label: 'Wed – Thu', full: 'Wednesday – Thursday', isSkipped: false, startDate: '', endDate: '' },
      { num: 3, label: 'Fri – Sat', full: 'Friday – Saturday', isSkipped: false, startDate: '', endDate: '' },
    ];
  }
  const d = new Date(startDateStr + 'T00:00:00');
  const day = d.getDay(); // 0 is Sunday
  d.setDate(d.getDate() - day);
  const sunStr = d.toISOString().split('T')[0];

  const w1Start = sunStr;
  const w1End = addDays(sunStr, 2);
  const w2Start = addDays(sunStr, 3);
  const w2End = addDays(sunStr, 4);
  const w3Start = addDays(sunStr, 5);
  const w3End = addDays(sunStr, 6);

  return [
    { num: 1, label: 'Sun – Tue', full: 'Sunday – Monday – Tuesday', startDate: w1Start, endDate: w1End, isSkipped: startDateStr > w1End },
    { num: 2, label: 'Wed – Thu', full: 'Wednesday – Thursday', startDate: w2Start, endDate: w2End, isSkipped: startDateStr > w2End },
    { num: 3, label: 'Fri – Sat', full: 'Friday – Saturday', startDate: w3Start, endDate: w3End, isSkipped: false },
  ];
}

function addDays(dateStr, days) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}

function getPlayerWeeklyGames(p) {
  const teamCode = p.real_team_code || p.real_team;
  if (teamCode && poRealSchedules && poRealSchedules[teamCode]) {
    const s = poRealSchedules[teamCode];
    return {
      1: s[1] || s['1'] || [],
      2: s[2] || s['2'] || [],
      3: s[3] || s['3'] || [],
    };
  }
  return { 1: [], 2: [], 3: [] };
}

function getWindowAssignments(teamId) {
  try {
    return JSON.parse(localStorage.getItem(`fsc_nhl_win_assign_${LEAGUE_ID}_${teamId}`) || '{}');
  } catch (e) { return {}; }
}

function saveWindowAssignment(teamId, pKey, val) {
  const assigns = getWindowAssignments(teamId);
  if (!val || val.mode === 'best') {
    delete assigns[pKey];
  } else {
    assigns[pKey] = val;
  }
  try {
    localStorage.setItem(`fsc_nhl_win_assign_${LEAGUE_ID}_${teamId}`, JSON.stringify(assigns));
  } catch (e) {}
}

function resolvePlayerInWindow(p, w, teamId) {
  const pKey = String(p.draftable_asset_id || p.player_id);
  const rawSched = getPlayerWeeklyGames(p);
  const assign = getWindowAssignments(teamId)[pKey];

  let effectiveGames = rawSched[w] ? rawSched[w].slice() : [];
  let flexedIn = null;
  let flexedOutTo = null;
  let flexedOutGame = null;

  if (assign && assign.mode === 'flex') {
    if (assign.sourceWindow === w) {
      flexedOutTo = assign.targetWindow;
      const movedIdx = assign.movedGameIdx != null ? assign.movedGameIdx : 1;
      flexedOutGame = rawSched[w] && rawSched[w][movedIdx] ? rawSched[w][movedIdx] : null;
      if (effectiveGames.length > 1) {
        const keptIdx = movedIdx === 0 ? 1 : 0;
        effectiveGames = [effectiveGames[keptIdx] || effectiveGames[0]];
      }
    } else if (assign.targetWindow === w) {
      flexedIn = assign.sourceWindow;
      const srcGames = rawSched[assign.sourceWindow] || [];
      const movedIdx = assign.movedGameIdx != null ? assign.movedGameIdx : 1;
      const movedGame = srcGames[movedIdx] || srcGames[0] || {day: 'Flex', opp: 'NHL', is_home: true};
      effectiveGames = [movedGame];
    }
  } else if (assign && assign.mode === 'pick' && assign.window === w) {
    if (effectiveGames.length > 1) {
      effectiveGames = [effectiveGames[assign.gameIdx] || effectiveGames[0]];
    }
  }

  const canFlexToW2 = w === 1 && rawSched[1].length >= 2 && rawSched[2].length === 0;
  const canFlexToW3 = (w === 1 || w === 2) && rawSched[w].length >= 2 && rawSched[3].length === 0;

  return {
    rawGames: rawSched[w] || [],
    effectiveGames,
    rawSched,
    flexedIn,
    flexedOutTo,
    flexedOutGame,
    has2Games: rawSched[w] && rawSched[w].length >= 2,
    canFlexToW2,
    canFlexToW3,
    assign,
  };
}

                   IR: 'background:#fee2e2;color:#991b1b', LTIR: 'background:#7f1d1d;color:#fff'};

  return `<span class="pill inj-badge" style="${INJ_STYLE[st] || ''};font-size:10px;font-weight:700;margin-left:4px" title="${esc(INJ_TITLE[st] || st)}${p.injury_note ? ' - ' + esc(p.injury_note) : ''}">${esc(INJ_LABEL[st] || st)}</span>${p.injury_note ? `<span class="muted" style="font-size:11px;margin-left:4px">${esc(p.injury_note)}</span>` : ''}`;

async function moveIL(assetId, on) {
  showError('');

    const out = await api(`/teams/${activeTeam().id}/injured-list`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({draftable_asset_id: assetId, on})});
    gridGroups = out.groups; ilPlayers = out.injured_list || []; ilCapacity = out.injured_list_capacity || 0;

async function renderHockeyRoster() {
  const t = activeTeam();
  if (!t) return;
  const [po, sch] = await Promise.all([
    api(`/teams/${t.id}/pecking-order`),
    api(`/teams/${t.id}/series-schedule`).catch(() => null),
  ]);
  gridGroups = po.groups; gridSel = null;
  ilPlayers = po.injured_list || []; ilCapacity = po.injured_list_capacity || 0;
  poRealSchedules = po.real_schedules || {};
  hockeySchedule = sch;
  paintHockeyRoster();
}

function paintHockeyRoster() {
  const t = activeTeam(), can = canManage(t);
  const grid = RosterGrid.build(gridGroups);
  const total = gridGroups.reduce((n, g) => n + g.ranked.length + g.unranked.length, 0);
  const counts = Object.fromEntries(gridGroups.map(g => [g.position_group, g.ranked.length + g.unranked.length]));
  const isSel = (g, rank, pid) => gridSel && gridSel.group === g && (pid != null ? gridSel.playerId === pid : gridSel.rank === rank);
  const target = (g) => gridSel && gridSel.group === g;
  const fmtD = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';

  const cellBtn = (c) => {
    const p = c.player, sel = isSel(c.group, c.rank, null);
    const border = sel ? '2px solid var(--color-accent)' : target(c.group) ? '2px dashed var(--color-accent)' : '1px solid var(--color-divider)';
    if (!p) {
      return `<button type="button" class="gcell" data-g="${c.group}" data-rank="${c.rank}" ${can && gridSel ? '' : 'disabled'} aria-pressed="${sel}"
        style="width:100%;text-align:left;padding:8px 10px;border:${border};border-radius:var(--radius-md);background:var(--color-surface, transparent);color:inherit;cursor:${can ? 'pointer' : 'default'};min-height:56px">
        <span class="muted">Open</span>
      </button>`;
    }
    const winInfo = resolvePlayerInWindow(p, activeHockeyWindow, t.id);
    const isIdle = winInfo.effectiveGames.length === 0;
    const pKey = String(p.draftable_asset_id || p.player_id);

    let scheduleStatusHtml = '';
    if (winInfo.flexedIn != null) {
      const g = winInfo.effectiveGames[0] || {day: 'Flex', opp: 'NHL'};
      scheduleStatusHtml = `<div style="display:flex;align-items:center;gap:4px;margin-top:3px">
        <span class="pill" style="background:#dcfce7;color:#166534;font-size:10px;font-weight:600">⇄ Flexed from Game ${winInfo.flexedIn} (${esc(g.day)} vs ${esc(g.opp)}) · Active</span>
        ${can ? `<button type="button" class="btn-reset-flex" data-pkey="${pKey}" style="border:none;background:transparent;color:var(--color-danger);cursor:pointer;font-size:11px;padding:0 2px" title="Reset flex assignment">✕</button>` : ''}
      </div>`;
    } else if (winInfo.has2Games) {
      const g0 = winInfo.rawGames[0] || {day: 'Game 1', opp: 'OPP', is_home: true};
      const g1 = winInfo.rawGames[1] || {day: 'Game 2', opp: 'OPP', is_home: false};
      const r0 = matchupRating(g0);
      const r1 = matchupRating(g1);
      const betterIdx = r0 >= r1 ? 0 : 1;
      const betterG = betterIdx === 0 ? g0 : g1;

      const curMode = winInfo.assign ? winInfo.assign.mode : 'best';
      const curTarget = winInfo.assign ? winInfo.assign.targetWindow : null;
      const curMovedIdx = winInfo.assign ? winInfo.assign.movedGameIdx : null;
      const curPick = winInfo.assign ? winInfo.assign.gameIdx : null;

      scheduleStatusHtml = `
        <div style="margin-top:3px">
          <div style="display:flex;align-items:center;gap:4px">
            <span class="pill" style="background:#e0f2fe;color:#0369a1;font-size:10px;font-weight:600">✦ 2 Matchups: ${esc(betterG.day)} vs ${esc(betterG.opp)} (Better Matchup ★)</span>
          </div>
          ${can ? `
          <select class="win-assign-select" data-pkey="${pKey}" data-w="${activeHockeyWindow}" style="margin-top:3px;font-size:11px;padding:2px 4px;border-radius:var(--radius-sm);border:1px solid var(--color-divider);background:var(--color-bg);width:100%;max-width:100%;color:inherit">
            <option value="best" ${curMode === 'best' ? 'selected' : ''}>★ Best Matchup (Auto · ${esc(betterG.day)} vs ${esc(betterG.opp)})</option>
            <option value="pick_0" ${curMode === 'pick' && curPick === 0 ? 'selected' : ''}>Count ${esc(g0.day)} vs ${esc(g0.opp)} only${betterIdx === 0 ? ' (Better Matchup ★)' : ''}</option>
            <option value="pick_1" ${curMode === 'pick' && curPick === 1 ? 'selected' : ''}>Count ${esc(g1.day)} vs ${esc(g1.opp)} only${betterIdx === 1 ? ' (Better Matchup ★)' : ''}</option>
            ${winInfo.canFlexToW2 ? `
              <option value="flex_2_0" ${curMode === 'flex' && curTarget === 2 && curMovedIdx === 0 ? 'selected' : ''}>⇄ Send ${esc(g0.day)} to Game 2 (Wed–Thu) · keep ${esc(g1.day)}</option>
              <option value="flex_2_1" ${curMode === 'flex' && curTarget === 2 && curMovedIdx === 1 ? 'selected' : ''}>⇄ Send ${esc(g1.day)} to Game 2 (Wed–Thu) · keep ${esc(g0.day)}</option>
            ` : ''}
            ${winInfo.canFlexToW3 ? `
              <option value="flex_3_0" ${curMode === 'flex' && curTarget === 3 && curMovedIdx === 0 ? 'selected' : ''}>⇄ Send ${esc(g0.day)} to Game 3 (Fri–Sat) · keep ${esc(g1.day)}</option>

  };

    ? (grid.reserves[gridSel.group] || []).find(p => p.player_id === gridSel.playerId)

      ${statCard('Roster', total, '')}${['C', 'W', 'D', 'G'].map(g => statCard(g, counts[g] || 0, '')).join('')}</div>

    <div class="card elev-sm" style="padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-3)">
        <div>
          <div class="card-kicker">3-Game Weekly Series</div>
          <h3 style="margin:2px 0 0">${seriesTitle}</h3>
        </div>
        <div class="muted" style="font-size:12px">7-Day Series · 3 Game Windows</div>
      </div>
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap" role="tablist" aria-label="Game Windows">
        ${winDefs.map(w => {
          const sDate = fmtD(w.startDate);
          const eDate = fmtD(w.endDate);
          const dateRangeStr = sDate && eDate ? (sDate === eDate ? sDate : `${sDate} – ${eDate}`) : '';
          const badge = w.isSkipped ? '<span class="pill" style="font-size:10px;background:var(--color-divider);color:var(--color-text-muted);margin-left:4px">Skipped</span>' : '';
          return `
            <button type="button" class="btn ${activeHockeyWindow === w.num ? 'btn-primary' : 'btn-secondary'}" data-window="${w.num}" role="tab" aria-selected="${activeHockeyWindow === w.num}" style="flex:1;min-width:180px;text-align:center;padding:10px 14px;cursor:pointer">
              <div style="font-weight:700;font-size:14px">Game ${w.num} ${badge}</div>
              <div style="font-size:12px;opacity:0.9">${w.label}</div>
              <div class="muted" style="font-size:11px;margin-top:2px">${dateRangeStr ? dateRangeStr + ' · ' : ''}${w.full}</div>
            </button>
          `;
        }).join('')}
      </div>
      ${winDefs.find(w => w.num === activeHockeyWindow && w.isSkipped) ? `
        <p class="muted" style="font-size:12px;margin:var(--space-2) 0 0;padding:6px 10px;background:var(--color-surface, #f8fafc);border-radius:var(--radius-sm);border:1px solid var(--color-divider)">Game 1 (Sun – Tue) was skipped for this league because the draft completed during Window 1. League matchups begin in <strong>Game 2 (Wed – Thu)</strong>.</p>
      ` : `
        <p class="muted" style="font-size:12px;margin:var(--space-2) 0 0">Viewing <strong>Game ${activeHockeyWindow}</strong> lineup. Players with games in this window are Active. Idle players step aside for backups. For players with 2 matchups, Best Matchup counts automatically; use the dropdown to reassign either matchup to open windows.</p>
      `}
    </div>

    ${dropBar}
    <p class="muted" style="font-size:13px;margin:0 0 var(--space-2)">${can ? 'Click a player, then click another player of the same position (or an open spot) to swap them. Line 1 starts; Lines 2-3 are the backups, in order.' : 'Only the manager of this team can change the lines.'}</p>
    <div class="card elev-sm" style="padding:var(--space-3) var(--space-4);overflow-x:auto">
      <table class="table" style="width:100%;table-layout:fixed;min-width:640px"><thead><tr><th style="width:70px">Position</th>
        ${Array.from({length: (typeof RosterGrid !== 'undefined' && RosterGrid.LINES) ? RosterGrid.LINES : 3}, (_, i) => i + 1).map(n => `<th>Line ${n}<div class="muted" style="font-size:11px;font-weight:400">${n === 1 ? 'Starters' : 'Backup ' + (n - 1)}</div></th>`).join('')}</tr></thead><tbody>
        ${grid.rows.map(r => `<tr><th scope="row" style="vertical-align:middle">${r.label}</th>${r.cells.map(c => `<td style="padding:4px">${cellBtn(c)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
    <div class="card elev-sm" id="injured-list" style="padding:var(--space-3) var(--space-4);margin-top:var(--space-4)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)">
        <h4 style="margin:0">Injured list <span class="muted" style="font-size:13px;font-weight:normal">${ilPlayers.length} of ${ilCapacity}</span></h4>
        <span class="muted" style="font-size:12px">Injured players here come off your lines and don't count toward the roster limit.</span>
      </div>
      ${ilPlayers.length ? ilPlayers.map(p => `<div style="display:flex;align-items:center;gap:var(--space-3);padding:6px 0;border-top:1px solid var(--color-divider)">
          <span class="tag tag-neutral" style="min-width:36px;justify-content:center">${esc(p.position || '')}</span>
          <span style="flex:1"><strong>${esc(p.display_name)}</strong> <span class="muted" style="font-size:11px">${esc(p.real_team_code || p.real_team || '')}</span>${p.injury_status ? injBadge(p) : '<span class="pill" style="background:#dcfce7;color:#166534;font-size:10px;font-weight:700;margin-left:4px">Healthy</span>'}</span>
          ${can ? `<button type="button" class="btn btn-secondary btn-il-off" data-il-off="${p.draftable_asset_id}" style="font-size:12px;padding:3px 10px">Activate</button>` : ''}
        </div>`).join('') : '<p class="muted" style="margin:0;font-size:13px">No one on the injured list. Injured players (OUT, IR or LTIR) can be moved here from the lines.</p>'}
    </div>
    ${reserveGroups.length ? `<div class="card elev-sm" style="padding:var(--space-3) var(--space-4);margin-top:var(--space-4)"><h4 style="margin:0 0 var(--space-2)">Not on a line</h4>
      ${reserveGroups.map(g => `<div style="margin-bottom:var(--space-2)"><span class="tag tag-neutral" style="margin-right:var(--space-2)">${g}</span>${grid.reserves[g].map(p => reserveBtn(g, p)).join(' ')}</div>`).join('')}</div>` : ''}`;

  $('team-pick').onchange = () => { activeTeamId = Number($('team-pick').value); go('roster'); };

  document.querySelectorAll('.gcell').forEach(el => {
    el.onclick = (e) => {
      if (e.target.closest('select, .btn-reset-flex, .btn-il') || el.dataset.disabled === '1') return;
      pickGrid({group: el.dataset.g, rank: Number(el.dataset.rank)});
    };
  });
  document.querySelectorAll('.btn-il').forEach(b => b.onclick = (e) => { e.stopPropagation(); moveIL(Number(b.dataset.il), true); });
  document.querySelectorAll('.btn-il-off').forEach(b => b.onclick = () => moveIL(Number(b.dataset.ilOff), false));
  document.querySelectorAll('.gres').forEach(b => b.onclick = () => pickGrid({group: b.dataset.g, playerId: Number(b.dataset.pid)}));
  if ($('grid-drop') && selPlayer) $('grid-drop').onclick = () => dropPlayer(t, selPlayer.draftable_asset_id, selPlayer.display_name);

  document.querySelectorAll('[data-window]').forEach(btn => {
    btn.onclick = () => {
      activeHockeyWindow = Number(btn.dataset.window);
      paintHockeyRoster();
    };
  });

  document.querySelectorAll('.win-assign-select').forEach(sel => {
    sel.onchange = (e) => {
      e.stopPropagation();
      const pKey = sel.dataset.pkey;
      const w = Number(sel.dataset.w);
      const val = sel.value;
      if (val === 'best') {
        saveWindowAssignment(t.id, pKey, {mode: 'best'});
      } else if (val.startsWith('pick_')) {
        const idx = Number(val.replace('pick_', ''));
        saveWindowAssignment(t.id, pKey, {mode: 'pick', window: w, gameIdx: idx});
      } else if (val.startsWith('flex_')) {
        const parts = val.split('_'); // 'flex', targetWindow, movedIdx
        const targetWin = Number(parts[1]);
        const movedIdx = Number(parts[2]);
        saveWindowAssignment(t.id, pKey, {mode: 'flex', sourceWindow: w, targetWindow: targetWin, movedGameIdx: movedIdx});
      }
      paintHockeyRoster();
    };
  });

  document.querySelectorAll('.btn-reset-flex').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const pKey = btn.dataset.pkey;
      saveWindowAssignment(t.id, pKey, {mode: 'best'});
      paintHockeyRoster();
    };
  });

  bindNav();
}

// ---- SCOREBOARD & LIVE SCORING ----------------------------------------------------------------------
let scoreboardAutoRefreshTimer = null;
let activeScoreboardWindow = 1;

async function renderScoreboard() {
  await refreshOverview();
  if (isHockey()) return renderHockeyScoreboard();
  return renderFootballScoreboard();
}

async function renderHockeyScoreboard() {
  const [sch, scoresRes] = await Promise.all([
    api(`/leagues/${LEAGUE_ID}/series-schedule`).catch(() => null),
    api(`/leagues/${LEAGUE_ID}/game-scores`).catch(() => null),
  ]);

  const seriesList = sch && sch.series ? sch.series : [];
  const fmtD = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';
  const scoreMap = {};
  if (scoresRes && scoresRes.games) {
    scoresRes.games.forEach(g => {
      scoreMap[g.daily_game_id] = g;
    });
  }

  const windowDays = {
    1: 'Sunday – Tuesday',
    2: 'Wednesday – Thursday',
    3: 'Friday – Saturday',
  };

  if (!seriesList.length) {
    $('content').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4)">
        <div><div class="card-kicker">NHL Live Scoreboard</div><h2 style="margin:2px 0 0">Matchup Scoreboard</h2></div>
      </div>
      <div class="card elev-sm" style="padding:var(--space-5);text-align:center">
        <h3 style="margin:0 0 var(--space-2)">No Live Games Scheduled Yet</h3>
        <p class="muted" style="margin:0 0 var(--space-4)">The series schedule is generated automatically when the draft completes. Live simulations and in-game scoring will broadcast here.</p>
        <button class="btn btn-secondary" onclick="go('roster')">View Team Lines &amp; Matchups</button>
      </div>`;
    return;
  }

  const curSeriesIdx = view.scoreboardSeriesIdx || 0;
  const seriesPerRound = Math.max(1, Math.floor(ov.teams.length / 2));
  const roundIdx = Math.floor(curSeriesIdx / seriesPerRound);
  const currentRoundSeries = seriesList.slice(roundIdx * seriesPerRound, (roundIdx + 1) * seriesPerRound);
  const firstS = currentRoundSeries[0] || seriesList[0];

  const winDefs = getSeriesWindows(firstS ? firstS.start_date : null);
  if (winDefs[0].isSkipped && activeScoreboardWindow === 1) {
    activeScoreboardWindow = 2;
  }
  const curWin = winDefs.find(w => w.num === activeScoreboardWindow) || winDefs[0];
  const todayStr = new Date().toLocaleDateString('en-CA');

  const matchupCards = currentRoundSeries.map(s => {
    const tA = teamsById[s.team_a_id] || {id: s.team_a_id, name: 'Team ' + s.team_a_id};
    const tB = teamsById[s.team_b_id] || {id: s.team_b_id, name: 'Team ' + s.team_b_id};

    const gamesList = s.daily_games || s.games || [];
    const windowGames = gamesList.filter(g => g.calendar_date >= curWin.startDate && g.calendar_date <= curWin.endDate);

    if (curWin.isSkipped || !windowGames.length) {
      return `
        <div class="card elev-sm" style="padding:var(--space-5);text-align:center;border-left:4px solid var(--color-divider);display:flex;flex-direction:column;justify-content:center;min-height:160px">
          <div style="font-weight:700;font-size:14px;color:var(--color-primary);margin-bottom:var(--space-2)">
            Game ${curWin.num} (${curWin.label}) Skipped
          </div>
          <p class="muted" style="margin:0;font-size:13px">
            ${curWin.num === 1 ? `This league completed its draft after Game 1 began. Matchups begin in <strong>Game 2 (${winDefs[1].label})</strong>.` : 'No matchups scheduled for this game window.'}
          </p>
        </div>
      `;
    }

    const liveGame = windowGames.find(g => g.status === 'LIVE_SIMULATING' || g.status === 'LIVE');
    const todayGame = windowGames.find(g => g.calendar_date === todayStr);
    const finalGames = windowGames.filter(g => g.status === 'FINAL');
    const lastFinalGame = finalGames.length ? finalGames[finalGames.length - 1] : null;
    const dailyGame = liveGame || todayGame || lastFinalGame || windowGames[0] || {};
    const dgId = dailyGame.id || dailyGame.daily_game_id;

    const roadTeam = teamsById[dailyGame.away_team_id] || (dailyGame.home_team_id === s.team_a_id ? tB : tA);
    const homeTeam = teamsById[dailyGame.home_team_id] || (dailyGame.home_team_id === s.team_a_id ? tA : tB);
    const isOwner = myTeam() && (myTeam().id === roadTeam.id || myTeam().id === homeTeam.id);

    const gameRatingObj = scoreMap[dailyGame.daily_game_id || dailyGame.id];
    const gs = gameRatingObj ? gameRatingObj.score : (dailyGame.game_score_rating || 50);
    const heatColor = gs >= 75 ? '#FF1E27' : gs >= 55 ? '#ea580c' : gs >= 40 ? '#0284c7' : '#64748b';

    const isLive = dailyGame.status === 'LIVE_SIMULATING' || dailyGame.status === 'LIVE';
    const isFinal = dailyGame.status === 'FINAL';
    const curPeriod = dailyGame.current_period || (isLive ? 1 : 0);

    const secRem = dailyGame.seconds_remaining != null ? dailyGame.seconds_remaining : 1200;
    const remMin = Math.floor(secRem / 60);
    const remSec = (secRem % 60).toString().padStart(2, '0');
    const elapsedSec = Math.max(0, 1200 - secRem);
    const elMin = Math.floor(elapsedSec / 60);
    const elSec = (elapsedSec % 60).toString().padStart(2, '0');

    let periodHeader = 'Scheduled';
    let clockSubheader = '';
    if (isLive) {
      const pName = curPeriod === 1 ? '1st Period' : curPeriod === 2 ? '2nd Period' : curPeriod === 3 ? '3rd Period' : `Period ${curPeriod}`;
      periodHeader = `${pName} · ${remMin}:${remSec} left`;
      clockSubheader = `${elMin}:${elSec} elapsed in period`;
    } else if (isFinal) {
      periodHeader = 'Final';
      clockSubheader = '3 Periods Complete';
    } else {
      periodHeader = `Scheduled · ${fmtD(dailyGame.calendar_date)}`;
      clockSubheader = 'Puck Drop Pending';
    }

    let roadGoals = '-';
    let homeGoals = '-';
    let statusNote = '';
    let isVeiled = false;

    if (isLive || isFinal) {
      if (!dailyGame.owner_watched) {
        roadGoals = '?';
        homeGoals = '?';
        isVeiled = true;
        statusNote = isOwner ? (isLive ? 'Watch live highlights or skip to unlock score' : 'Watch highlights or skip to unlock final score') : "Owner hasn't watched highlights yet";
      } else {
        roadGoals = dailyGame.away_score != null ? dailyGame.away_score : 0;
        homeGoals = dailyGame.home_score != null ? dailyGame.home_score : 0;
      }
    }

    const awayShots = dailyGame.away_shots != null ? dailyGame.away_shots : 0;
    const homeShots = dailyGame.home_shots != null ? dailyGame.home_shots : 0;

    return `
      <div class="card elev-sm sb-card" style="border-left:4px solid ${heatColor}">
        <div class="sb-head">
          <div class="sb-status" style="color:var(--color-primary)">${periodHeader}</div>
          <div style="display:flex;gap:4px;align-items:center">
            ${isLive ? '<span class="pill" style="background:#ef4444;color:white;font-weight:700;font-size:10px">● LIVE</span>' : isFinal ? '<span class="pill good" style="font-size:10px">FINAL</span>' : ''}
            <span class="pill" style="background:${heatColor};color:white;font-weight:700;font-size:10px" title="The Game Score">Game Score ${gs}</span>
          </div>
        </div>
        <div class="sb-body">
          ${[[roadTeam, roadGoals, awayShots], [homeTeam, homeGoals, homeShots]].map(([tm, goals, sog], i) => {
            const other = i === 0 ? homeGoals : roadGoals;
            const cls = (isLive || isFinal) && !isVeiled && goals !== other ? (goals > other ? 'lead' : 'trail') : '';
            const abbr = String(tm.name).split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
            const mine = myTeam() && myTeam().id === tm.id;
            return `
              <div class="sb-team ${cls}">
                <div class="sb-logo" style="background:${heatColor}">${esc(abbr)}</div>
                <div class="sb-name">
                  <span class="t">${esc(tm.name)}</span>
                  ${mine ? '<span class="pill good" style="font-size:9px;padding:1px 5px">You</span>' : ''}
                  ${tm.is_ai_owned ? '<span class="pill ai" style="font-size:9px;padding:1px 5px">AI</span>' : ''}
                </div>
                ${(isLive || isFinal) ? `<div class="sb-sog" title="Shots on goal">SOG ${sog}</div>` : ''}
                <div class="sb-score">${goals}</div>
              </div>`;
          }).join('')}
          ${(isLive || isFinal) ? `<div class="muted" style="font-size:11px;text-align:center;padding:2px 0 8px">${clockSubheader}</div>` : ''}
          ${statusNote ? `<div class="muted" style="font-size:11px;text-align:center;padding:0 0 8px;${isVeiled && isOwner ? 'color:var(--color-primary);font-weight:600' : ''}">${statusNote}</div>` : ''}
        </div>

        <div class="sb-foot">
          ${dgId ? `
            <a href="/static/nhl-game.html?daily_game_id=${dgId}" class="btn btn-primary" style="font-size:11px;padding:4px 10px">Highlights</a>
            ${isVeiled ? `<button type="button" class="btn btn-secondary btn-skip-score" data-gid="${dgId}" style="font-size:11px;padding:4px 10px;cursor:pointer">Skip to Score</button>` : ''}
            <a href="/static/nhl-game.html?daily_game_id=${dgId}#boxscore" class="btn btn-secondary" style="font-size:11px;padding:4px 10px">Box score</a>
          ` : ''}
          <a href="#" data-go="roster" data-team="${roadTeam.id}" class="btn btn-ghost" style="font-size:11px;padding:4px 8px">${esc(roadTeam.name)} Lines</a>
          <a href="#" data-go="roster" data-team="${homeTeam.id}" class="btn btn-ghost" style="font-size:11px;padding:4px 8px">${esc(homeTeam.name)} Lines</a>
        </div>
      </div>
    `;
  }).join('');

  $('content').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap;margin-bottom:var(--space-4)">
      <div>
        <div class="card-kicker">NHL Live Scoreboard · Series ${roundIdx + 1}</div>
        <h2 style="margin:2px 0 0">Matchup Scoreboard</h2>
      </div>
      <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
        <button type="button" class="btn btn-secondary" id="btn-scoring-info-sb" style="cursor:pointer;display:inline-flex;align-items:center;gap:5px"><span style="font-size:14px">ℹ️</span> How Scoring Works</button>
        <button type="button" class="btn btn-secondary" id="btn-refresh-score" style="cursor:pointer">⟳ Refresh Scores</button>
        <span class="muted" style="font-size:12px">Auto-refreshes live every 10s</span>
      </div>
    </div>

    ${sch && sch.real_slate_summary ? `
      <div class="card elev-sm" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4);padding:10px 16px;background:color-mix(in srgb, var(--color-primary, #0284c7) 8%, var(--color-surface));border-left:4px solid var(--color-primary, #0284c7);flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:20px">🏒</span>
          <div>
            <div style="font-weight:700;font-size:13px">${esc(sch.real_slate_summary)}</div>
            <div class="muted" style="font-size:11px">Simulating live alongside real NHL plays with true expected goals (xG) and shot quality</div>
          </div>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-scoring-info-banner" style="font-size:12px;padding:4px 8px;cursor:pointer;color:var(--color-primary, #0284c7);font-weight:600">Scoring Guide &rarr;</button>
      </div>
    ` : ''}

    <div class="card elev-sm" style="padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-3)">
        <div>
          <span style="font-weight:700;font-size:14px">3-Game Series Windows</span>
          <span class="muted" style="font-size:12px;margin-left:8px">${firstS ? fmtD(firstS.start_date) + ' – ' + fmtD(firstS.end_date) : ''}</span>
        </div>
        <div style="display:flex;align-items:center;gap:var(--space-2)">
          <span class="muted" style="font-size:12px">7-Day Series · Strict Monotonic Scoreboards</span>
          ${isCommissioner ? `<button type="button" class="btn btn-secondary" id="btn-resched-nhl" style="font-size:11px;padding:3px 8px" title="Reschedule to next full window (Wed, Fri, or Sun)">Reschedule Season Start</button>` : ''}
        </div>
      </div>
      <div style="display:flex;gap:var(--space-2);flex-wrap:wrap" role="tablist" aria-label="Game Windows">
        ${winDefs.map(w => {
          const sDate = fmtD(w.startDate);
          const eDate = fmtD(w.endDate);
          const badge = w.isSkipped ? '<span class="pill" style="font-size:10px;background:var(--color-divider);color:var(--color-text-muted);margin-left:4px">Skipped</span>' : '';
          return `
            <button type="button" class="btn ${activeScoreboardWindow === w.num ? 'btn-primary' : 'btn-secondary'}" data-swindow="${w.num}" role="tab" aria-selected="${activeScoreboardWindow === w.num}" style="flex:1;min-width:180px;text-align:center;padding:10px 14px;cursor:pointer">
              <div style="font-weight:700;font-size:14px">Game ${w.num} ${badge}</div>
              <div style="font-size:12px;opacity:0.9">${w.label}</div>
              <div class="muted" style="font-size:11px;margin-top:2px">${sDate} – ${eDate}</div>
            </button>
          `;
        }).join('')}
      </div>
    </div>

    <div class="sb-grid">
      ${matchupCards}
    </div>
  `;

  document.querySelectorAll('[data-swindow]').forEach(b => {
    b.onclick = () => {
      activeScoreboardWindow = Number(b.dataset.swindow);
      renderHockeyScoreboard();
    };
  });
  if ($('btn-resched-nhl')) {
    $('btn-resched-nhl').onclick = async () => {
      if (!confirm('Reschedule series schedule to begin at the start of the next full window?')) return;
      try {
        await api(`/leagues/${LEAGUE_ID}/reschedule-next-window`, {method: 'POST'});
        toast('Season successfully rescheduled to next full window!');
        renderHockeyScoreboard();
      } catch (err) {
        alert('Failed to reschedule: ' + (err.message || err));
      }
    };
  }
  if ($('btn-refresh-score')) {
    $('btn-refresh-score').onclick = () => renderHockeyScoreboard();
  }
  if ($('btn-scoring-info-sb')) {
    $('btn-scoring-info-sb').onclick = () => ScoringModal.open({ sport: 'nhl' });
  }
  if ($('btn-scoring-info-banner')) {
    $('btn-scoring-info-banner').onclick = () => ScoringModal.open({ sport: 'nhl' });
  }
  document.querySelectorAll('.btn-skip-score').forEach(b => {
    b.onclick = async (e) => {
      e.stopPropagation();
      const gid = b.dataset.gid;
      try {
        await api(`/simulator/games/${gid}/skip`, {method: 'POST'});
        renderHockeyScoreboard();
      } catch (err) {
        showError(err.message || 'Could not skip score');
      }
    };
  });
  bindNav();

  if (!scoreboardAutoRefreshTimer) {
    scoreboardAutoRefreshTimer = setInterval(() => {
      if (tab === 'scoreboard') {
        renderHockeyScoreboard();
      } else {
        clearInterval(scoreboardAutoRefreshTimer);
        scoreboardAutoRefreshTimer = null;
      }
    }, 10000);
  }
}

async function pickGrid(sel) {
  showError('');
  const sameAs = gridSel && gridSel.group === sel.group && gridSel.rank === sel.rank && gridSel.playerId === sel.playerId;
  if (!gridSel || sameAs) { gridSel = sameAs ? null : sel; return paintHockeyRoster(); }
  const r = RosterGrid.swap(gridGroups, gridSel, sel);
  if (r.error) { showError(r.error); gridSel = null; return paintHockeyRoster(); }
  try {
    const payloadAssignments = r.assignments || {[r.group]: r.ids};
    const out = await api(`/teams/${activeTeam().id}/pecking-order`, {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({assignments: payloadAssignments})});
    gridGroups = out.groups;
  } catch (e) { showError(e.message); }
  gridSel = null;
  paintHockeyRoster();
}

function drawFa() {
  const {fa, sum, team} = cache.tx;
  const f = view.fa, q = f.q.trim().toLowerCase();
  const rows = fa.players.filter(p => (!f.pos || p.position === f.pos) && (!q || p.display_name.toLowerCase().includes(q) || (p.real_team || '').toLowerCase().includes(q)));
  rows.sort((a, b) => f.sort === 'price' ? a.asking_price - b.asking_price || (b.last_season_points ?? -1) - (a.last_season_points ?? -1)
    : f.sort === 'name' ? a.display_name.localeCompare(b.display_name) : (b.last_season_points ?? -1) - (a.last_season_points ?? -1) || a.display_name.localeCompare(b.display_name));
  const chips = $('fa-chips');
  chips.innerHTML = [['', 'All', fa.players.length]].concat(POSITIONS.map(p => [p, POS_LABEL[p] || p, fa.players.filter(x => x.position === p).length])).map(([v, l, n]) =>
    `<button class="chip${f.pos === v ? ' on' : ''}" data-pos="${v}">${l}<span class="n">${n}</span></button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { f.pos = b.dataset.pos; drawFa(); });
  const can = canManage(team) && sum.open_spots > 0;
  $('fa-list').innerHTML = rows.slice(0, 50).map(p => `<div class="row">${posTag(p.position)}
      <span style="flex:1;min-width:0"><strong>${esc(p.display_name)}</strong> <span class="muted">${esc(p.real_team || '')}</span></span>
      <span class="pts muted" title="${LAST} points">${pts(p.last_season_points)}</span><span class="pts muted" title="Points per game">${ppg(p.points_per_game)}</span>${ov.is_college ? `<span class="pts" title="Asking price (provisional)">${money(p.asking_price)}</span>` : ''}
      <button class="btn btn-primary" data-add="${p.draftable_asset_id}" ${can ? '' : 'disabled'} title="${can ? '' : (canManage(team) ? 'Roster is full - drop a player first' : 'You can only sign for your own team')}">Sign</button></div>`).join('')
    + (rows.length > 50 ? `<p class="muted" style="font-size:12px;margin:var(--space-2) 0">Showing 50 of ${rows.length} - search or pick a position to narrow.</p>` : '')
    || '<p class="muted" style="margin:var(--space-2) 0">No free agents match.</p>';
  $('fa-list').querySelectorAll('[data-add]').forEach(b => b.onclick = () => faAct('add', Number(b.dataset.add)));
}

function drawTxRoster() {
  const {roster, team} = cache.tx;
  const rank = Object.fromEntries(POSITIONS.map((p, i) => [p, i]));
  const sorted = roster.slice().sort((a, b) => (rank[a.position] ?? 9) - (rank[b.position] ?? 9) || (b.last_season_points ?? -1) - (a.last_season_points ?? -1));
  $('tx-roster').innerHTML = sorted.length ? sorted.map(r => `<div class="row">${posTag(r.position)}
    <span style="flex:1;min-width:0"><strong>${esc(r.display_name)}</strong> <span class="muted">${esc(r.real_team || '')}</span></span>
    <span class="pts muted" title="Points">${pts(r.last_season_points)}</span><span class="pts muted" title="Points per game">${ppg(r.points_per_game)}</span>
    <button class="btn btn-ghost" data-drop="${r.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'}>Drop</button></div>`).join('')
    : '<p class="muted" style="margin:var(--space-2) 0">No players yet.</p>';
  $('tx-roster').querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const r = roster.find(x => x.draftable_asset_id === Number(b.dataset.drop));
    if (confirm(`Drop ${r.display_name}? He goes back to the free-agent pool and you are not refunded what he cost.`)) faAct('drop', r.draftable_asset_id);
  });
}

function drawLog() {
  const {log} = cache.tx;
  const rows = log.filter(x => (!view.log.kind || x.kind === view.log.kind) && (!view.log.team || String(x.team_id) === view.log.team));
  $('log-list').innerHTML = rows.slice(0, 120).map(txnRow).join('') || '<p class="muted" style="margin:var(--space-2) 0">Nothing to show.</p>';

async function faAct(kind, assetId) {
  showError(''); showResult('');
  const t = cache.tx.team;
  try {
    const r = await FSC.post(`/teams/${t.id}/free-agency/${kind}`, {draftable_asset_id: assetId});

    showResult(kind === 'add' ? `Signed ${r.display_name}${ov.is_college ? ' for ' + money(r.price) : ''}.` : `Dropped ${r.display_name}.`);
  } catch (e) { showError(e.message); }
}
