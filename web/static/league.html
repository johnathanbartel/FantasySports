function drawFa() {
  const {fa, sum, team} = cache.tx;
  const f = view.fa, q = f.q.trim().toLowerCase();
  const rows = fa.players.filter(p => (!f.pos || p.position === f.pos) && (!q || p.display_name.toLowerCase().includes(q) || (p.real_team || '').toLowerCase().includes(q)));
  rows.sort((a, b) => f.sort === 'current' ? (b.this_season_points ?? -1) - (a.this_season_points ?? -1) || (b.last_season_points ?? -1) - (a.last_season_points ?? -1)
    : f.sort === 'price' ? a.asking_price - b.asking_price || (b.last_season_points ?? -1) - (a.last_season_points ?? -1)
    : f.sort === 'name' ? a.display_name.localeCompare(b.display_name) : (b.last_season_points ?? -1) - (a.last_season_points ?? -1) || a.display_name.localeCompare(b.display_name));
  const chips = $('fa-chips');
  chips.innerHTML = [['', 'All', fa.players.length]].concat(POSITIONS.map(p => [p, POS_LABEL[p] || p, fa.players.filter(x => x.position === p).length])).map(([v, l, n]) =>
    `<button class="chip${f.pos === v ? ' on' : ''}" data-pos="${v}">${l}<span class="n">${n}</span></button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { f.pos = b.dataset.pos; drawFa(); });
  const can = canManage(team) && sum.open_spots > 0;
  const claimed = new Set(cache.tx.wv.players.filter(x => x.claimed).map(x => x.draftable_asset_id));
  $('fa-list').innerHTML = (rows.length ? txHeader(ov.is_college) : '') + rows.slice(0, 50).map(p => `<div class="row tight">${posTag(p.position)}
      <span class="pname" title="${esc(p.display_name)}"><strong>${pl(p.draftable_asset_id, p.display_name)}</strong><span class="muted">${esc(p.real_team || '')}</span></span>
      ${ageCell(p.age)}<span class="pts" title="This season's points so far (${p.this_season_games ?? 0} games)">${pts(p.this_season_points)}</span><span class="pts muted" title="${LAST} points">${pts(p.last_season_points)}</span><span class="pts muted" title="Points per game">${ppg(p.points_per_game)}</span>${ov.is_college ? `<span class="pts" title="Asking price (provisional)">${money(p.asking_price)}</span>` : ''}
      ${p.waiver_until
        ? (claimed.has(p.draftable_asset_id)
          ? `<button class="btn btn-secondary" data-wcancel="${p.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'} title="On waivers for ${hoursLeft(p.waiver_until)} more. Click to cancel your claim">Claimed</button>`
          : `<button class="btn btn-primary" data-wclaim="${p.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'} title="On waivers for ${hoursLeft(p.waiver_until)} more: claim him, and he goes to the first team in the waiver order">Claim</button>`)
        : `<button class="btn btn-primary" data-add="${p.draftable_asset_id}" ${can ? '' : 'disabled'} title="${can ? '' : (canManage(team) ? 'Roster is full - drop a player first' : 'You can only sign for your own team')}">Sign</button>`}</div>`).join('')
    + (rows.length > 50 ? `<p class="muted" style="font-size:12px;margin:var(--space-2) 0">Showing 50 of ${rows.length} - search or pick a position to narrow.</p>` : '')
    || '<p class="muted" style="margin:var(--space-2) 0">No free agents match.</p>';
  $('fa-list').querySelectorAll('[data-add]').forEach(b => b.onclick = () => faAct('add', Number(b.dataset.add)));
  $('fa-list').querySelectorAll('[data-wclaim]').forEach(b => b.onclick = () => waiverAct('claim', Number(b.dataset.wclaim)));
  $('fa-list').querySelectorAll('[data-wcancel]').forEach(b => b.onclick = () => waiverAct('cancel', Number(b.dataset.wcancel)));
}

function drawTxRoster() {
  const {roster, team} = cache.tx;
  const rank = Object.fromEntries(POSITIONS.map((p, i) => [p, i]));
  const sorted = roster.slice().sort((a, b) => (rank[a.position] ?? 9) - (rank[b.position] ?? 9) || (b.last_season_points ?? -1) - (a.last_season_points ?? -1));
  $('tx-roster').innerHTML = sorted.length ? txHeader(false) + sorted.map(r => `<div class="row tight">${posTag(r.position)}
    <span class="pname" title="${esc(r.display_name)}"><strong>${pl(r.draftable_asset_id, r.display_name)}</strong><span class="muted">${esc(r.real_team || '')}</span></span>
    ${ageCell(r.age)}<span class="pts" title="This season's points so far (${r.this_season_games ?? 0} games)">${pts(r.this_season_points)}</span><span class="pts muted" title="${LAST} points">${pts(r.last_season_points)}</span><span class="pts muted" title="Points per game">${ppg(r.points_per_game)}</span>
    <button class="btn btn-ghost" data-drop="${r.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'}>Drop</button></div>`).join('')
    : '<p class="muted" style="margin:var(--space-2) 0">No players yet.</p>';
  $('tx-roster').querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
    const r = roster.find(x => x.draftable_asset_id === Number(b.dataset.drop));
    if (confirm(`Drop ${r.display_name}? He goes on waivers for 24 hours, then to the free-agent pool${ov.is_college ? '. You are not refunded what he cost' : ''}.`)) faAct('drop', r.draftable_asset_id);
  });
}

function drawLog() {
  const {log} = cache.tx;
  const rows = log.filter(x => (!view.log.kind || x.kind === view.log.kind) && (!view.log.team || String(x.team_id) === view.log.team));
  $('log-list').innerHTML = rows.slice(0, 120).map(txnRow).join('') || '<p class="muted" style="margin:var(--space-2) 0">Nothing to show.</p>';
  if (rows.length > 120) $('log-list').insertAdjacentHTML('beforeend', `<p class="muted" style="font-size:12px;margin:var(--space-2) 0">Showing the 120 most recent of ${rows.length}.</p>`);
}

function waiversBox(wv, team) {
  const mineIdx = wv.order.findIndex(o => o.team_id === team.id);
  const order = wv.order.map(o => `<div class="row tight" style="${o.team_id === team.id ? 'font-weight:700' : ''}">
      <span class="pts" style="min-width:28px;text-align:left">${o.position}</span><span class="pname"><strong>${tn(o.team_id, o.team_name)}</strong></span>
      ${o.moved_back ? '<span class="pill" title="Won a claim since the reset">Moved back</span>' : ''}

  const players = wv.players.length ? wv.players.map(p => `<div class="row tight">${posTag(p.position)}
      <span class="pname" title="${esc(p.display_name)}"><strong>${pl(p.draftable_asset_id, p.display_name)}</strong><span class="muted">${esc(p.real_team || '')}</span></span>
      <span class="muted" style="font-size:12px;white-space:nowrap" title="Clears ${utcLocal(p.until)}">${hoursLeft(p.until)} left</span>
      ${p.claimed ? `<button class="btn btn-secondary" data-wcancel="${p.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'}>Claimed</button>`
        : `<button class="btn btn-primary" data-wclaim="${p.draftable_asset_id}" ${canManage(team) ? '' : 'disabled'}>Claim</button>`}</div>`).join('')
    : '<p class="muted" style="margin:var(--space-2) 0">Nobody is on waivers. A dropped player is held for 24 hours.</p>';
  return `<details id="waiver-box" class="card elev-sm" style="padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4)" ${view.waiversOpen ? 'open' : ''}>
    <summary style="cursor:pointer;font-weight:700">Waivers <span class="muted" style="font-weight:400">${mineIdx >= 0 ? `· your team is #${mineIdx + 1} of ${wv.order.length}` : ''}${wv.players.length ? ` · ${wv.players.length} on waivers` : ''}</span></summary>
    <p class="muted" style="font-size:13px;margin:var(--space-2) 0">${esc(wv.basis_note)} Next reset: <strong>${utcLocal(wv.next_reset_at)}</strong> (your time).</p>
    <div class="grid2" style="gap:var(--space-4)"><div><h4 style="margin:0 0 var(--space-1)">Waiver order</h4>${order}</div>
      <div><h4 style="margin:0 0 var(--space-1)">On waivers</h4>${players}</div></div></details>`;
}

async function waiverAct(kind, assetId) {
  showError(''); showResult('');
  try {
    await FSC.post(`/teams/${cache.tx.team.id}/waivers/${kind}`, {draftable_asset_id: assetId});
    view.waiversOpen = true;
    await go('transactions');
    showResult(kind === 'claim' ? 'Claim placed. It is filled when his 24 hours end, if no team ahead of you in the waiver order claims him.' : 'Claim cancelled.');
  } catch (e) { showError(e.message); }
}

async function faAct(kind, assetId) {
  showError(''); showResult('');
  const t = cache.tx.team;
  try {
    const r = await FSC.post(`/teams/${t.id}/free-agency/${kind}`, {draftable_asset_id: assetId});
    await go('transactions');
    showResult(kind === 'add' ? `Signed ${r.display_name}${ov.is_college ? ' for ' + money(r.price) : ''}.` : `Dropped ${r.display_name}. He is on waivers for 24 hours.`);
  } catch (e) { showError(e.message); }
}

// ---- TRADES: Direct human trades and AI trades with league majority approval ------------------------
let tradeSelectedOppId = null;
let tradeWantAsset = null;     // a player to tick on the "You receive" list when the Trades tab opens (set from his player card)

async function renderTrades() {
  await refreshOverview(); ensureActiveTeam();
  const t = activeTeam();
  const can = canManage(t);
  const otherTeams = ov.teams.filter(x => x.id !== t.id);
  if (!tradeSelectedOppId || tradeSelectedOppId === t.id || !otherTeams.some(x => x.id === tradeSelectedOppId)) {
    tradeSelectedOppId = otherTeams[0]?.id || null;
  }

  const picksTrade = !!ov.pick_trading_on;
  const [tradeList, hub, blockList, myRoster, oppRoster, myPicks, oppPicks] = await Promise.all([
    api(`/leagues/${LEAGUE_ID}/trades`),
    api(`/leagues/${LEAGUE_ID}/trade-hub`),
    api(`/leagues/${LEAGUE_ID}/trade-block`),
    api(`/teams/${t.id}/roster`),
    tradeSelectedOppId ? api(`/teams/${tradeSelectedOppId}/roster`).catch(() => []) : Promise.resolve([]),
    picksTrade ? api(`/leagues/${LEAGUE_ID}/teams/${t.id}/tradeable-picks`).catch(() => []) : Promise.resolve([]),
    picksTrade && tradeSelectedOppId ? api(`/leagues/${LEAGUE_ID}/teams/${tradeSelectedOppId}/tradeable-picks`).catch(() => []) : Promise.resolve([]),
  ]);

  const votingTrades = tradeList.filter(x => x.status === 'voting');
  const incomingDirect = tradeList.filter(x => x.status === 'proposed' && x.counterparty_team_id === t.id);
  const outgoingDirect = tradeList.filter(x => x.status === 'proposed' && x.proposer_team_id === t.id);
  const pastTrades = tradeList.filter(x => ['accepted', 'declined', 'rejected', 'cancelled'].includes(x.status));

  const rank = Object.fromEntries(POSITIONS.map((p, i) => [p, i]));
  const sortRoster = (r) => r.slice().sort((a, b) => (rank[a.position] ?? 9) - (rank[b.position] ?? 9) || (b.last_season_points ?? -1) - (a.last_season_points ?? -1));

  const oppTeam = teamsById[tradeSelectedOppId];
  const isOppAi = oppTeam?.is_ai_owned;

  // A draft pick: "Round 3, season 2 draft (from Team X)", with where it would land today and what that is worth.
  const pickPill = (k) => `
    <span class="tag tag-neutral" style="display:inline-flex;align-items:center;gap:4px;padding:3px 8px;font-size:12px;margin:2px">
      <span class="pill" style="font-size:10px">PICK</span> <strong>Round ${k.round}</strong>
      <span class="muted" style="font-size:11px">season ${k.season}${k.original_team_name ? ' - from ' + esc(k.original_team_name) : ''}${k.projected_overall ? ' - #' + k.projected_overall + ' overall now' : ''}</span>
    </span>`;
  const assetsAndPicks = (assets, picks) => assets.map(assetPill).join('') + (picks || []).map(pickPill).join('');

      <p class="muted" style="font-size:12px;margin:var(--space-2) 0">

          const planTag = `<span class="tag ${rebuilding ? 'tag-neutral' : 'tag-accent'}" style="font-size:12px">${rebuilding ? 'Rebuilding' : 'Win Now'}</span>`;
          const picker = (mine && can && !h.is_ai_owned) ? `
            <span style="display:inline-flex;gap:4px">

            </span>` : planTag;
          return `<div style="display:flex;align-items:center;gap:var(--space-3);padding:6px 8px;border-radius:var(--radius-sm);${mine ? 'background:var(--panel-2)' : ''}">

            ${h.on_block ? `<span class="muted" style="font-size:11px">${h.on_block} on the block</span>` : ''}
            ${picker}
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- Trade Block: players their managers have put up for offers -->
    <div class="card elev-sm" style="padding:var(--space-4);margin-bottom:var(--space-4)">

      ${blockList.length ? blockList.map(b => `
        <div style="margin-bottom:var(--space-3)">
          <h4 style="margin:0 0 4px;font-size:14px">${esc(b.team_name)} <span class="muted" style="font-size:11px;font-weight:400">${b.plan === 'rebuilding' ? 'Rebuilding' : 'Win Now'}</span></h4>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:4px">
            ${b.players.map(p => `${assetPill(p)}${(b.team_id === t.id && can) ? `<button type="button" class="btn btn-ghost btn-sm" data-block-remove="${p.draftable_asset_id}" style="font-size:11px">Remove</button>` : ''}`).join('')}
            ${b.team_id !== t.id ? `<button type="button" class="btn btn-secondary btn-sm" data-block-offer="${b.team_id}" style="margin-left:auto">Make an offer</button>` : ''}

      ${can ? `
        <div style="display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap;border-top:1px solid var(--color-divider);padding-top:var(--space-3)">

            ${sortRoster(myRoster).filter(p => !(blockList.find(b => b.team_id === t.id)?.players || []).some(x => x.draftable_asset_id === p.draftable_asset_id))

        </div>` : ''}

    <div style="margin-bottom:var(--space-6)">

                </span>
                ${(can && tr.proposer_team_id === t.id) ? `<button type="button" class="btn btn-ghost btn-sm" data-trade-cancel="${tr.id}" style="font-size:11px;color:var(--color-danger)">Cancel Trade</button>` : ''}
              </div>
            </div>

            <div class="grid2" style="margin-bottom:var(--space-3);gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px;text-transform:uppercase;font-weight:700">${esc(tr.proposer_team_name)} receives:</div>
                <div>${assetsAndPicks(tr.receive_assets, tr.receive_picks)}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px;text-transform:uppercase;font-weight:700">${esc(tr.counterparty_team_name)} receives:</div>
                <div>${assetsAndPicks(tr.send_assets, tr.send_picks)}</div>
              </div>
            </div>

            ${eligibilityNote(tr)}
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-divider)">
              <div style="font-size:12px">
                ${hasVoted ? `<span style="color:var(--color-accent);font-weight:600">Your team voted: ${tr.user_vote === 'approve' ? 'Approved ✓' : 'Rejected ✗'}</span>` : '<span class="muted">Your vote is needed for this trade.</span>'}
              </div>
              ${can ? `
                <div style="display:flex;gap:var(--space-2)">
                  <button type="button" class="btn ${tr.user_vote === 'approve' ? 'btn-primary' : 'btn-secondary'}" data-trade-vote="${tr.id}" data-vote="approve" style="font-size:12px;padding:4px 12px">Approve (${tr.approvals})</button>
                  <button type="button" class="btn ${tr.user_vote === 'reject' ? 'btn-primary' : 'btn-secondary'}" data-trade-vote="${tr.id}" data-vote="reject" style="font-size:12px;padding:4px 12px;color:var(--color-danger)">Reject (${tr.rejections})</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('') : '<div class="card elev-sm" style="padding:var(--space-4)"><p class="muted" style="margin:0">No active AI trades requiring vote.</p></div>'}
    </div>

    ${(incomingDirect.length || outgoingDirect.length) ? `
      <div style="margin-bottom:var(--space-6)">
        <h3 style="margin:0 0 var(--space-2)">Direct Trade Proposals</h3>
        ${incomingDirect.map(tr => `
          <div class="card elev-sm" style="padding:var(--space-4);margin-bottom:var(--space-3);border-left:4px solid var(--color-primary)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
              <div><strong>Offer from ${esc(tr.proposer_team_name)}</strong></div>
              ${can ? `
                <div style="display:flex;gap:var(--space-2)">
                  <button type="button" class="btn btn-primary btn-sm" data-trade-respond="${tr.id}" data-accept="true">Accept Trade</button>
                  <button type="button" class="btn btn-secondary btn-sm" data-trade-respond="${tr.id}" data-accept="false">Decline</button>
                </div>
              ` : ''}
            </div>
            <div class="grid2" style="gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You receive:</div>
                <div>${assetsAndPicks(tr.send_assets, tr.send_picks)}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You give up:</div>
                <div>${assetsAndPicks(tr.receive_assets, tr.receive_picks)}</div>
              </div>
            </div>
          </div>
        `).join('')}

        ${outgoingDirect.map(tr => `
          <div class="card elev-sm" style="padding:var(--space-4);margin-bottom:var(--space-3)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
              <div><strong>Offer sent to ${esc(tr.counterparty_team_name)}</strong> <span class="muted" style="font-size:12px">(Pending response)</span></div>
              ${can ? `<button type="button" class="btn btn-ghost btn-sm" data-trade-cancel="${tr.id}" style="color:var(--color-danger)">Cancel</button>` : ''}
            </div>
            <div class="grid2" style="gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You receive:</div>
                <div>${assetsAndPicks(tr.receive_assets, tr.receive_picks)}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You send:</div>
                <div>${assetsAndPicks(tr.send_assets, tr.send_picks)}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <!-- Propose Trade Form -->
    <div class="card elev-sm" style="padding:var(--space-5);margin-bottom:var(--space-6)">
      <h3 style="margin:0 0 var(--space-2)">Propose a Trade</h3>
      <p class="muted" style="margin:0 0 var(--space-4);font-size:13px">
        Trade players${picksTrade ? ' and draft picks' : ''} with any team in the league. Select the opponent team, choose what to send from your side and what to receive from theirs.${picksTrade ? ' AI teams value a pick by where it would land if the season ended today, and need to get back at least that much.' : ''}
      </p>

      <div style="margin-bottom:var(--space-4);max-width:360px">
        <label for="trade-opp" style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Select trading partner:</label>
        <select id="trade-opp" class="inp" style="width:100%">
          ${otherTeams.map(o => `<option value="${o.id}" ${o.id === tradeSelectedOppId ? 'selected' : ''}>${esc(o.name)}${o.is_ai_owned ? ' (AI Team)' : ''}</option>`).join('')}
        </select>
      </div>

      <div class="note" style="margin-bottom:var(--space-4)">
        ${isOppAi
          ? '<strong>Trading with an AI team:</strong> This proposal will be submitted to the league for majority approval (&gt;50% of teams must approve). Proposer automatically votes approve.'
          : '<strong>Trading with a human manager:</strong> This proposal will be delivered directly to ' + esc(oppTeam?.name || 'them') + ' to review and accept or decline.'}
      </div>

      <div class="grid2" style="margin-bottom:var(--space-4)">
        <div style="border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)">
          <h4 style="margin:0 0 var(--space-2)">You send (${esc(t.name)})</h4>
          <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px" id="trade-send-list">
            ${sortRoster(myRoster).map(p => `
              <label style="display:flex;align-items:center;gap:var(--space-2);padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
                <input type="checkbox" name="trade-send-chk" value="${p.draftable_asset_id}">
                ${posTag(p.position)}
                <span style="flex:1"><strong>${pl(p.draftable_asset_id, p.display_name)}</strong> <span class="muted">${esc(p.real_team || '')}</span></span>
                <span class="pts muted">${pts(p.last_season_points)} pts</span>
              </label>
            `).join('') || '<p class="muted">No players rostered.</p>'}
          </div>
          ${picksBlock('trade-send-pick', myPicks, 'You have')}
        </div>

        <div style="border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)">
          <h4 style="margin:0 0 var(--space-2)">You receive (${esc(oppTeam?.name || 'Opponent')})</h4>
          <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px" id="trade-recv-list">
            ${sortRoster(oppRoster).map(p => `
              <label style="display:flex;align-items:center;gap:var(--space-2);padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
                <input type="checkbox" name="trade-recv-chk" value="${p.draftable_asset_id}">
                ${posTag(p.position)}
                <span style="flex:1"><strong>${pl(p.draftable_asset_id, p.display_name)}</strong> <span class="muted">${esc(p.real_team || '')}</span></span>
                <span class="pts muted">${pts(p.last_season_points)} pts</span>
              </label>
            `).join('') || '<p class="muted">No players rostered on opponent team.</p>'}
          </div>
          ${picksBlock('trade-recv-pick', oppPicks, esc(oppTeam?.name || 'They') + ' has')}
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:var(--space-2)">

        <button type="button" class="btn btn-primary" id="btn-submit-trade" ${can ? '' : 'disabled'}>Submit Trade Proposal</button>
      </div>
      <div id="trade-eligibility" class="note" style="display:none;font-size:13px;margin-top:var(--space-2)"></div>
    </div>

    <!-- Completed / Past Trades -->
    <div>
      <h3 style="margin:0 0 var(--space-2)">Trade History</h3>
      <div class="card elev-sm" style="padding:var(--space-3) var(--space-4)">
        ${pastTrades.length ? pastTrades.map(tr => `
          <div class="row" style="flex-wrap:wrap;gap:var(--space-2);padding:8px 0">
            <span class="tag" style="min-width:70px;justify-content:center;${tr.status === 'accepted' ? 'background:var(--good);color:#fff' : 'background:var(--hi);color:var(--ink)'}">${tr.status.toUpperCase()}</span>
            <div style="flex:1;min-width:240px">
              <strong>${esc(tr.proposer_team_name)}</strong> gave ${tradeText(tr.send_assets, tr.send_picks)}

              <strong>${esc(tr.counterparty_team_name)}</strong> for ${tradeText(tr.receive_assets, tr.receive_picks)}
            </div>
            ${tr.failure_reason ? `<div class="muted" style="flex-basis:100%;font-size:12px">${esc(tr.failure_reason)}</div>` : ''}
            <span class="muted" style="font-size:12px">${tr.resolved_at ? new Date(tr.resolved_at).toLocaleDateString() : ''}</span>
          </div>
        `).join('') : '<p class="muted" style="margin:var(--space-2) 0">No completed trades yet.</p>'}
      </div>
    </div>
  `;

  if ($('team-pick')) $('team-pick').onchange = () => { activeTeamId = Number($('team-pick').value); go('trades'); };

  document.querySelectorAll('[data-trade-plan]').forEach(btn => {

      showError('');
      try {
        await api(`/teams/${t.id}/trade-plan`, jsonOpts('PUT', {plan: btn.dataset.tradePlan}));
        showResult(btn.dataset.tradePlan === 'rebuilding' ? 'Your team is now Rebuilding.' : 'Your team is now Win Now.');
