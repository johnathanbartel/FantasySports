// ---- NHL league leaders: what players did in this league's simulated games (never real-life stats) ----------------
const LEADER_COLS = [['display_name', 'Player'], ['position', 'Pos'], ['real_team', 'NHL Team'], ['team', 'Team'], ['games_played', 'GP'], ['goals', 'G'], ['assists', 'A'],
  ['points', 'PTS'], ['saves', 'SV'], ['shutouts', 'SO']];
async function renderLeaders() {
  cache.leaders = await api(`/leagues/${LEAGUE_ID}/leaders`);
  const L = cache.leaders;
  view.leaders = view.leaders || {q: '', pos: '', sort: 'points', dir: -1};
  $('content').innerHTML = `
    <p class="muted" style="margin:0 0 var(--space-3);font-size:13px">What players have done in this league's <strong>simulated</strong> games, not real life. GP = games started; saves are the shots a goalie's side faced minus the goals it allowed; SO = a game where the goalie's side allowed none. A game counts once it is final and you have watched it (or skipped to its score); games between two AI teams always count.
      ${L.games_hidden ? ` <strong>${L.games_hidden} finished game${L.games_hidden === 1 ? ' is' : 's are'} not counted yet</strong> because you haven't opened ${L.games_hidden === 1 ? 'it' : 'them'}.` : ''} ${L.games_counted} game${L.games_counted === 1 ? '' : 's'} counted. Click a column to sort.</p>
    <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)"><input id="ll-q" class="inp" placeholder="Search players, NHL teams or fantasy teams..." style="flex:1;min-width:200px" value="${esc(view.leaders.q)}"></div>
    <div id="ll-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-3)"></div>
    <div class="card elev-sm" style="padding:var(--space-2) var(--space-4);overflow-x:auto"><table class="table" style="min-width:640px"><thead id="ll-head"></thead><tbody id="ll-body"></tbody></table></div>
    <p class="muted" id="ll-count" style="font-size:12px;margin-top:var(--space-2)"></p>`;
  $('ll-q').oninput = () => { view.leaders.q = $('ll-q').value; drawLeaders(); };
  drawLeaders();
}

function drawLeaders() {
  const v = view.leaders, q = v.q.trim().toLowerCase(), rows = cache.leaders.leaders;
  const teamName = (r) => r.fantasy_team_id ? (teamsById[r.fantasy_team_id]?.name || '') : 'Free agent';
  $('ll-chips').innerHTML = [['', 'All', rows.length]].concat(POSITIONS.map(p => [p, POS_LABEL[p] || p, rows.filter(x => x.position === p).length])).map(([val, l, n]) =>
    `<button class="chip${v.pos === val ? ' on' : ''}" data-pos="${val}">${l}<span class="n">${n}</span></button>`).join('');
  $('ll-chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { v.pos = b.dataset.pos; drawLeaders(); });
  const val = (r, k) => k === 'display_name' ? r.display_name.toLowerCase() : k === 'position' ? r.position || '' : k === 'real_team' ? r.real_team || '' : k === 'team' ? teamName(r).toLowerCase() : r[k];
  const list = rows.filter(r => (!v.pos || r.position === v.pos) && (!q || r.display_name.toLowerCase().includes(q) || (r.real_team || '').toLowerCase().includes(q) || teamName(r).toLowerCase().includes(q)));
  list.sort((a, b) => { const x = val(a, v.sort), y = val(b, v.sort); return (x < y ? -1 : x > y ? 1 : 0) * v.dir || b.points - a.points || a.display_name.localeCompare(b.display_name); });
  $('ll-head').innerHTML = '<tr>' + LEADER_COLS.map(([k, l]) => `<th class="sort" data-k="${k}">${l}${v.sort === k ? (v.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('') + '</tr>';
  $('ll-head').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (v.sort === k) v.dir *= -1; else { v.sort = k; v.dir = ['display_name', 'position', 'real_team', 'team'].includes(k) ? 1 : -1; } drawLeaders(); });
  $('ll-body').innerHTML = list.slice(0, 100).map(r => `<tr><td><strong>${pl(r.draftable_asset_id, r.display_name)}</strong></td><td>${POS_LABEL[r.position] || r.position || '-'}</td><td>${esc(r.real_team || '')}</td>
    <td>${r.fantasy_team_id ? esc(teamName(r)) : '<span class="muted">Free agent</span>'}</td><td>${r.games_played}</td><td>${r.goals}</td><td>${r.assists}</td><td><strong>${r.points}</strong></td><td>${r.saves}</td><td>${r.shutouts}</td></tr>`).join('')
    || `<tr><td colspan="10" class="muted">No simulated games to count yet.</td></tr>`;
  $('ll-count').textContent = `Showing ${Math.min(100, list.length)} of ${list.length} players.`;
}

function drawStats() {
  const v = view.stats, q = v.q.trim().toLowerCase(), rows = cache.stats;
  const chips = $('st-chips');
  chips.innerHTML = [['', 'All', rows.length]].concat(POSITIONS.map(p => [p, POS_LABEL[p] || p, rows.filter(x => x.position === p).length])).map(([val, l, n]) =>
    `<button class="chip${v.pos === val ? ' on' : ''}" data-pos="${val}">${l}<span class="n">${n}</span></button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { v.pos = b.dataset.pos; drawStats(); });
  const teamName = (r) => r.fantasy_team_id ? (teamsById[r.fantasy_team_id]?.name || '') : 'Free agent';
  const val = (r, k) => k === 'display_name' ? r.display_name.toLowerCase() : k === 'position' ? r.position || '' : k === 'real_team' ? r.real_team || '' : k === 'team' ? teamName(r).toLowerCase()
    : k.startsWith('w') ? (r.weekly[k.slice(1)] ?? null) : (r[k] ?? null);
  let list = rows.filter(r => (!v.pos || r.position === v.pos) && (v.who === 'all' || (v.who === 'fa') === (r.fantasy_team_id == null))
    && (!q || r.display_name.toLowerCase().includes(q) || (r.real_team || '').toLowerCase().includes(q) || teamName(r).toLowerCase().includes(q)));
  list.sort((a, b) => {
    const x = val(a, v.sort), y = val(b, v.sort);
    if (x == null && y == null) return a.display_name.localeCompare(b.display_name);
    if (x == null) return 1; if (y == null) return -1;     // blanks always last
    return (x < y ? -1 : x > y ? 1 : 0) * v.dir || a.display_name.localeCompare(b.display_name);
  });
  const cols = [['display_name', 'Player'], ['position', 'Pos'], ['real_team', isHockey() ? 'NHL Team' : 'School'], ['team', 'Team'], ['last_season_points', LAST + ' pts']].concat(cache.weeks.map(w => ['w' + w, 'W' + w]));
  $('st-head').innerHTML = '<tr>' + cols.map(([k, l]) => `<th class="sort" data-k="${k}">${l}${v.sort === k ? (v.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('') + '</tr>';
  $('st-head').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (v.sort === k) v.dir *= -1; else { v.sort = k; v.dir = ['display_name', 'position', 'real_team', 'team'].includes(k) ? 1 : -1; } drawStats(); });
  $('st-body').innerHTML = list.slice(0, 100).map(r => `<tr><td><strong>${pl(r.draftable_asset_id, r.display_name)}</strong></td><td>${POS_LABEL[r.position] || r.position || '-'}</td><td>${esc(r.real_team || '')}</td>
    <td>${r.fantasy_team_id ? esc(teamName(r)) : '<span class="muted">Free agent</span>'}</td><td>${pts(r.last_season_points)}</td>${cache.weeks.map(w => `<td>${r.weekly[w] != null ? pts(r.weekly[w]) : '-'}</td>`).join('')}</tr>`).join('');
  $('st-count').textContent = `Showing ${Math.min(100, list.length)} of ${list.length} players.`;
}

// ---- TEAMS ---------------------------------------------------------------------------------------------------
async function renderTeams() {
  await refreshOverview();
  const byConf = {};
  ov.teams.forEach(t => {
    const groupName = t.division_name ? `${t.conference_name || 'Conference'} · ${t.division_name}` : (t.conference_name || 'Other');
    (byConf[groupName] = byConf[groupName] || []).push(t);
  });

  const manageConfsBar = isCommissioner ? `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-4);padding:var(--space-3) var(--space-4);background:var(--color-surface, rgba(255,255,255,0.03));border:1px solid var(--color-divider);border-radius:var(--radius-md)">
      <div>
        <strong style="font-size:14px">Conferences &amp; Divisions</strong>
        <div class="muted" style="font-size:12px">${!ov.is_college ? 'Pro format: Custom conferences, divisions, and team alignment.' : 'College format: Program tiers and conferences.'}</div>
      </div>
      <button class="btn btn-secondary" id="manage-confs-btn" style="font-size:13px">Manage Conferences &amp; Divisions</button>
    </div>
  ` : '';

  $('content').innerHTML = `
    ${manageConfsBar}
    ${Object.entries(byConf).map(([name, list]) => `
      <h3 style="margin:0 0 var(--space-2)">${esc(name)}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-3);margin-bottom:var(--space-5)">
        ${list.map(t => {
          const commishAction = isCommissioner ? (
            t.is_ai_owned
              ? `<button class="btn btn-secondary" style="font-size:12px;padding:3px 8px" data-assign-team="${t.id}" data-team-name="${esc(t.name)}" data-is-ai="1">Assign to user</button>`
              : (t.owner_user_id !== me ? `<button class="btn btn-ghost" style="font-size:11px;padding:2px 6px" data-assign-team="${t.id}" data-team-name="${esc(t.name)}" data-is-ai="0" data-email="${esc(t.owner_email || '')}" title="Reassign team or convert to AI">Reassign</button>` : '')
          ) : '';

          let claimStatusBadge = '';
          if (t.is_ai_owned) {
            claimStatusBadge = '<span class="pill ai">AI Team</span>';
          } else if (t.invite_status === 'pending_claim') {
            claimStatusBadge = `<span class="pill" style="background:var(--hi);color:var(--ink);border:3px solid var(--ink)" title="Invited: ${esc(t.owner_email || '')}">Pending: ${esc(t.owner_email || t.owner_name)}</span>`;
            if (isCommissioner && t.invite_url) {
              claimStatusBadge += ` <button class="btn btn-ghost" style="font-size:11px;padding:2px 6px" data-copy-invite-url="${esc(t.invite_url)}" title="Copy invite link">Copy Link</button>`;
            }
          } else if (t.owner_user_id === me) {
            claimStatusBadge = '<span class="pill">Commissioner (You)</span>';
          } else {
            claimStatusBadge = `<span class="pill" style="border:1px solid var(--border)">Claimed: ${esc(t.owner_name || t.owner_email || 'Manager')}</span>`;
          }

          const tierGoalLine = ov.is_college ? `<div class="muted" style="font-size:12px">${esc(t.program_size)} program · ${esc(t.season_goal)}</div>` : '';
          const rosterBudgetLine = ov.is_college
            ? `<div style="font-size:13px">${t.roster_count} / ${ov.roster_size} players${t.open_spots ? ` · <strong>${t.open_spots} open</strong>` : ''} · ${money(t.weekly_budget)}/wk</div>`
            : `<div style="font-size:13px">${t.roster_count} / ${ov.roster_size} players${t.open_spots ? ` · <strong>${t.open_spots} open</strong>` : ''}</div>`;

          return `<div class="card elev-sm" style="padding:var(--space-3) var(--space-4);gap:6px">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap">
              <strong style="font-family:var(--font-heading);font-size:16px">${tn(t.id)}</strong>
              <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap">
                ${claimStatusBadge}
                ${commishAction}
              </div>
            </div>
            ${tierGoalLine}
            ${rosterBudgetLine}
            <div style="display:flex;gap:var(--space-2);margin-top:4px">
              <button class="btn btn-secondary" data-go="roster" data-team="${t.id}">Roster</button>
              ${canSetLines(t) ? `<a class="btn btn-secondary" href="/static/lineup.html?league_id=${LEAGUE_ID}&team_id=${t.id}">Lineup</a>` : ''}
            </div>
          </div>`;
        }).join('')}
      </div>`).join('')}
  `;
  bindNav();

  if ($('manage-confs-btn')) {
    $('manage-confs-btn').onclick = () => {
      ConferenceModal.open({
        leagueId: LEAGUE_ID,
        isCollege: ov.is_college,
        onUpdated: async () => {
          await renderTeams();
        }
      });
    };
  }

  $('content').querySelectorAll('[data-copy-invite-url]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const url = btn.getAttribute('data-copy-invite-url');
      const fullUrl = url.startsWith('http') ? url : (location.origin + url);
      navigator.clipboard.writeText(fullUrl).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
      }).catch(() => prompt('Copy invite link:', fullUrl));
    };
  });

  $('content').querySelectorAll('[data-assign-team]').forEach(btn => {
    btn.onclick = () => {
      const tid = Number(btn.getAttribute('data-assign-team'));
      const tname = btn.getAttribute('data-team-name');
      const isAi = btn.getAttribute('data-is-ai') === '1';
      const curEmail = btn.getAttribute('data-email') || '';
      AssignTeamModal.open({
        leagueId: LEAGUE_ID,
        teamId: tid,
        teamName: tname,
        isAi,
        currentEmail: curEmail,
        onAssigned: async () => {
          await renderTeams();
        }
      });
    };
  });
}

// ---- TEAM SETTINGS --------------------------------------------------------------------------------------------
async function renderTeamSettings() {
  await refreshOverview();
  const mine = myTeam();
  const teams = ov.teams || [];

  let targetTeam = mine || (isCommissioner && teams.length ? teams[0] : null);

  if (!targetTeam) {
    $('content').innerHTML = `
      <div class="card elev-sm" style="padding:var(--space-5);max-width:600px;margin:0 auto">
        <h3 style="margin:0 0 var(--space-2)">Team Settings</h3>
        <p class="muted">You do not own a team in this league yet.</p>
        <a href="/static/join-league.html?league_id=${LEAGUE_ID}" class="btn btn-primary">Claim a Team</a>
      </div>
    `;
    return;
  }

  $('content').innerHTML = `
    <div style="max-width:640px;margin:0 auto">
      <div class="card elev-sm" style="padding:var(--space-5)">
        <div class="card-kicker">Team Configuration</div>
        <h2 style="margin:var(--space-1) 0 var(--space-4)">Team Settings</h2>

        ${(isCommissioner && teams.length > 1) ? `
          <div style="margin-bottom:var(--space-4)">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Select Team to Edit</label>
            <select id="settings-team-select" style="width:100%;padding:8px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface);color:inherit">
              ${teams.map(t => `<option value="${t.id}" ${t.id === targetTeam.id ? 'selected' : ''}>${esc(t.name)}${mine && t.id === mine.id ? ' (Your Team)' : ''}${t.is_ai_owned ? ' [AI]' : ''}</option>`).join('')}
            </select>
          </div>
        ` : ''}

        <form id="team-settings-form" style="display:flex;flex-direction:column;gap:var(--space-4)">
          <div>
            <label for="settings-team-name" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Team Name</label>
            <input type="text" id="settings-team-name" value="${esc(targetTeam.name)}" required maxlength="60"
                   style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);font-size:15px;background:var(--color-bg);color:inherit">
            <p class="muted" style="font-size:12px;margin:6px 0 0">Choose a distinct name for your team across the league and scoreboard.</p>
          </div>

          <div style="display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-2)">
            <button type="submit" class="btn btn-primary" id="btn-save-team-name">Save Team Name</button>
            <span id="settings-status" class="muted" style="font-size:13px"></span>
          </div>
        </form>
      </div>
    </div>
  `;

  const sel = $('settings-team-select');
  if (sel) {
    sel.onchange = () => {
      const selectedId = Number(sel.value);
      targetTeam = teams.find(t => t.id === selectedId) || targetTeam;
      const nameInput = $('settings-team-name');
      if (nameInput) nameInput.value = targetTeam.name;
    };
  }

  const form = $('team-settings-form');
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const statusEl = $('settings-status');
      const submitBtn = $('btn-save-team-name');
      const newName = ($('settings-team-name').value || '').trim();
      if (!newName) return showError('Team name cannot be empty');
      submitBtn.disabled = true;
      if (statusEl) statusEl.textContent = 'Saving...';
      try {
        const updated = await FSC.patch(`/teams/${targetTeam.id}`, { name: newName });
        targetTeam.name = updated.name;
        if (teamsById[targetTeam.id]) teamsById[targetTeam.id].name = updated.name;
        const ovTeam = ov.teams.find(t => t.id === targetTeam.id);
        if (ovTeam) ovTeam.name = updated.name;
        showResult(`Team name successfully updated to "${esc(updated.name)}"`);
        if (statusEl) statusEl.textContent = 'Saved!';
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
      } catch (err) {
        showError(err.message || 'Failed to update team name');
        if (statusEl) statusEl.textContent = '';
      } finally {
        submitBtn.disabled = false;
      }
    };
  }
}

// ---- start ------------------------------------------------------------------------------------------------------
async function start() {
  if (!LEAGUE_ID) { showError('Missing league_id.'); return; }
  const session = await FSC.current();
  FSC.renderNav('nav-auth');


  if (!session) {
    $('signin-box').style.display = 'flex';
    if ($('signin-page-link')) $('signin-page-link').href = `/static/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
    const users = await fetch('/users').then(r => r.json()).catch(() => []);
    $('signin-select').innerHTML = users.map(u => `<option value="${u.id}">${esc(u.display_name)}</option>`).join('');
    $('signin-btn').onclick = async () => { await FSC.signIn(Number($('signin-select').value)); location.reload(); };
    showError('Sign in to view the league.');
    return;
  }
  me = session.user_id;
  try { const cfg = await fetch('/config').then(r => r.json()); if (cfg.last_season) LAST = String(cfg.last_season); } catch (e) {}
  await refreshOverview();
  const ent = await api('/entitlements/me');
  isCommissioner = ov.commissioner_user_id === me || (ov.co_commissioner_user_ids || []).includes(me);
  canActForAi = isCommissioner && ent.commissioner_mode;
  $('nav-brand').textContent = ov.name;
  $('league-name').innerHTML = (ov.logo_url ? Retro.leagueMark(ov, 5) : Retro.sportSprite(ov.universe_codes, 5)) + ' ' + esc(ov.name);
  $('kicker').textContent = `${isHockey() ? 'NHL' : ov.universe_codes.length && !ov.universe_codes.includes('ncaaf') ? 'NFL' : 'College football'} · ${ov.teams.length} teams · commissioner ${ov.commissioner_name || ''}`;
  $('nav-cm').style.display = isCommissioner ? '' : 'none';
  document.title = ov.name;
  PlayerCard.configure({
    leagueId: LEAGUE_ID,
    onChange: () => go(tab),
    onTrade: ({teamId, assetId}) => { tradeSelectedOppId = teamId; tradeWantAsset = assetId; return go('trades'); },
  });
  if (params.get('trade_team')) { tradeSelectedOppId = Number(params.get('trade_team')); tradeWantAsset = Number(params.get('trade_asset')) || null; }
  const want = params.get('tab');
  await go(tabList().some(([id]) => id === want) ? want : 'home');
}
start().catch(e => showError(`Failed to load: ${e.message}`));
</script>
