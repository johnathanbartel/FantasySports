      } catch (e) { showError(e.message); }
    };
  });
  if ($('block-add-btn')) $('block-add-btn').onclick = async () => {
    const id = Number($('block-add-pick').value);
    if (!id) return;
    showError('');
    try {
      await api(`/teams/${t.id}/trade-block`, jsonOpts('POST', {draftable_asset_id: id}));
      await renderTrades();
    } catch (e) { showError(e.message); }
  };
  document.querySelectorAll('[data-block-remove]').forEach(btn => {
    btn.onclick = async () => {
      showError('');
      try {
        await api(`/teams/${t.id}/trade-block/${Number(btn.dataset.blockRemove)}`, {method: 'DELETE'});
        await renderTrades();
      } catch (e) { showError(e.message); }
    };
  });
  document.querySelectorAll('[data-block-offer]').forEach(btn => {
    btn.onclick = async () => {
      tradeSelectedOppId = Number(btn.dataset.blockOffer);
      await renderTrades();
      $('trade-opp')?.scrollIntoView({behavior: 'smooth', block: 'center'});
    };
  });

  $('trade-opp').onchange = () => {
    tradeSelectedOppId = Number($('trade-opp').value);
    renderTrades();
  };
  if (tradeWantAsset != null) {
    const box = document.querySelector(`input[name="trade-recv-chk"][value="${tradeWantAsset}"]`);
    tradeWantAsset = null;
    if (box) { box.checked = true; box.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  }

  const readTradeForm = () => {
    const ids = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(c => Number(c.value));
    const picks = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(c => {
      const [season, round, original_team_id] = c.value.split('|').map(Number);
      return {season, round, original_team_id};
    });
    return {proposer_team_id: t.id, counterparty_team_id: tradeSelectedOppId, send_asset_ids: ids('trade-send-chk'),
            receive_asset_ids: ids('trade-recv-chk'), send_picks: picks('trade-send-pick'), receive_picks: picks('trade-recv-pick')};
  };
  $('btn-check-trade').onclick = async () => {
    showError(''); showResult('');
    const box = $('trade-eligibility');
    try {
      const el = await FSC.post(`/leagues/${LEAGUE_ID}/trades/preview`, readTradeForm());
      const blocked = el.status === 'BLOCKED' || el.status === 'AWAITING_PAYMENT';
      box.style.display = '';
      box.innerHTML = `<b>${blocked ? 'This trade cannot be submitted yet.' : 'This trade can be submitted.'}</b>`
        + (el.explanations || []).map(x => `<div>${esc(x)}</div>`).join('');
    } catch (e) { showError(e.message); }
  };

  document.querySelectorAll('[data-commish-decide]').forEach(btn => {
    btn.onclick = async () => {
      showError(''); showResult('');
      try {
        const res = await FSC.post(`/trades/${Number(btn.dataset.commishDecide)}/commissioner-decision`, {decision: btn.dataset.decision});
        showResult(res.status === 'accepted' ? 'Signed off - the league had already approved, so the trade executed.'
          : res.status === 'rejected' ? 'Trade rejected.' : 'Signed off. The trade still needs league majority approval.');
        await renderTrades();
      } catch (e) { showError(e.message); }
    };
  });

  $('btn-submit-trade').onclick = async () => {
    showError(''); showResult('');
    const sendChecks = document.querySelectorAll('input[name="trade-send-chk"]:checked');
    const recvChecks = document.querySelectorAll('input[name="trade-recv-chk"]:checked');
    const sendIds = Array.from(sendChecks).map(c => Number(c.value));
    const recvIds = Array.from(recvChecks).map(c => Number(c.value));

    const readPicks = (name) => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(c => {
      const [season, round, original_team_id] = c.value.split('|').map(Number);
      return {season, round, original_team_id};
    });
    const sendPicks = readPicks('trade-send-pick'), recvPicks = readPicks('trade-recv-pick');

    if (!(sendIds.length || sendPicks.length) || !(recvIds.length || recvPicks.length)) {
      showError(`Please select at least one player${picksTrade ? ' or draft pick' : ''} to send and one to receive.`);
      return;
    }

    try {
      const res = await FSC.post(`/leagues/${LEAGUE_ID}/trades`, {
        proposer_team_id: t.id,
        counterparty_team_id: tradeSelectedOppId,
        send_asset_ids: sendIds,
        receive_asset_ids: recvIds,
        send_picks: sendPicks,
        receive_picks: recvPicks,
      });
      if (res.status === 'accepted') {
        showResult('Trade approved and executed!');
      } else if (res.status === 'voting') {
        showResult((res.eligibility?.approval_requirements || []).includes('ELIMINATED_FREE_LEAGUE_TRADE')
          ? 'Trade proposed. It stays pending until a league majority approves it and the commissioner signs off.'
          : `Trade proposed to ${esc(res.counterparty_team_name)}! Requires league majority approval before executing.`);
      } else {
        showResult(`Trade proposal sent to ${esc(res.counterparty_team_name)}.`);
      }
      await renderTrades();
    } catch (e) {
      showError(e.message);
    }
  };

  document.querySelectorAll('[data-trade-vote]').forEach(btn => {
    btn.onclick = async () => {
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeVote);
      const vote = btn.dataset.vote;
      try {
        const res = await FSC.post(`/trades/${tradeId}/vote`, {team_id: t.id, vote});
        if (res.status === 'accepted') {
          showResult('League majority approval reached! Trade executed successfully.');
        } else if (res.status === 'rejected') {
          showResult('Trade rejected by league majority.');
        } else {
          showResult(`Vote recorded: ${vote === 'approve' ? 'Approved' : 'Rejected'}. (${res.approvals} of ${res.majority_needed} approvals)`);
        }
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });

  document.querySelectorAll('[data-trade-respond]').forEach(btn => {
    btn.onclick = async () => {
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeRespond);
      const accept = btn.dataset.accept === 'true';
      try {
        const res = await FSC.post(`/trades/${tradeId}/respond`, {team_id: t.id, accept});
        showResult(accept ? 'Trade accepted and executed!' : 'Trade offer declined.');
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });

  document.querySelectorAll('[data-trade-cancel]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Are you sure you want to cancel this trade proposal?')) return;
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeCancel);
      try {
        await FSC.post(`/trades/${tradeId}/cancel`, {});
        showResult('Trade cancelled.');
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });
}

// ---- SCHEDULE: preseason stage + scoreboard ------------------------------------------------------------
// Team scores are fantasy points (platform/scoring_scale.py); per-player numbers are raw EPA credit.
const fmt = (x) => (x === null || x === undefined) ? '-' : (x > 0 ? '+' : '') + x.toFixed(2);

async function renderSchedule() {
  await refreshOverview();
  const [state, matchups, champ] = await Promise.all([
    api(`/leagues/${LEAGUE_ID}/schedule/state`), api(`/leagues/${LEAGUE_ID}/matchups`), api(`/leagues/${LEAGUE_ID}/championships`)]);
  const managed = ov.teams.filter(canManage);
  if (view.schedTeam === undefined || !managed.some(t => t.id === view.schedTeam)) view.schedTeam = (managed.find(t => !t.is_ai_owned) || managed[0])?.id ?? null;
  const mySchedule = view.schedTeam && ov.teams_set_schedule ? await api(`/teams/${view.schedTeam}/schedule`) : null;

  const selfSchedule = ov.teams_set_schedule;
  const banner = !selfSchedule ? await proScheduleHtml(state) :
  `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4)">
    <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:center">
      <div><div class="card-kicker">Preseason schedule stage</div>
        <strong>${!state.has_schedule ? 'No schedule yet' : state.status === 'open' ? 'Open - teams can still arrange different opponents' : 'Closed - the schedule is set'}</strong>
        <div class="muted" style="font-size:13px;margin-top:2px">Every team starts with a premade schedule for weeks 1-${state.regular_weeks}. A team can ask another team to play it instead (attaching in-game cash if it wants);
          cash only moves if the request is accepted. AI teams answer when the commissioner closes the stage. Week ${state.championship_week} is conference championship week.</div></div>
      <div style="display:flex;gap:var(--space-2)">
        ${isCommissioner && !state.has_schedule ? '<button class="btn btn-primary" id="mk-sched">Create premade schedule</button>' : ''}
        ${isCommissioner && state.has_schedule && state.status === 'open' ? '<button class="btn btn-secondary" id="close-stage">Close schedule stage</button>' : ''}</div></div></div>`;

  const nameCell = (id) => tn(id);
  let mine = '';
  if (selfSchedule && mySchedule && state.has_schedule) {
    const t = teamsById[view.schedTeam];
    mine = `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);overflow-x:auto">
      <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:baseline">
        <h3 style="margin:0">${managed.length > 1 ? `<select id="sched-team" class="inp">${managed.map(x => `<option value="${x.id}"${x.id === view.schedTeam ? ' selected' : ''}>${esc(x.name)}${x.is_ai_owned ? ' (AI)' : ''}</option>`).join('')}</select>` : esc(t.name)} - schedule</h3>
        <span class="muted" style="font-size:13px">Cash you can still offer: <strong>${money(mySchedule.cash_available)}</strong> (free-agency money less your open offers)</span></div>
      <table class="table" style="margin-top:var(--space-2)"><thead><tr><th>Week</th><th>Starts</th><th>Opponent</th><th>Change opponent</th><th>Cash offer</th><th></th></tr></thead><tbody>
      ${mySchedule.weeks.map(w => {
        const out = w.outgoing, inc = w.incoming || [];
        const status = w.agreement ? '<span class="pill ai">Agreed</span>' : '<span class="pill">Premade</span>';
        const change = w.editable
          ? `<select class="inp" data-pick="${w.week_id}"><option value="">- keep ${esc(w.opponent_name || 'bye')} -</option>${w.available.filter(a => a.id !== w.opponent_id).map(a => `<option value="${a.id}"${out && out.to_team_id === a.id ? ' selected' : ''}>${teamsById[a.id]?.poll_rank ? '#' + teamsById[a.id].poll_rank + ' ' : ''}${esc(a.name)}</option>`).join('')}</select>`
          : (w.agreement ? '<span class="muted">Agreement in place</span>' : '<span class="muted">Locked</span>');
        const cash = w.editable ? `<input class="inp" type="number" min="0" step="1" style="width:90px" data-offer="${w.week_id}" value="${out ? out.offer_amount : 0}">` : '';
        const action = w.editable ? `<button class="btn btn-secondary" data-send="${w.week_id}">Send request</button>` : '';
        const pending = out ? `<div class="muted" style="font-size:12px">Asked ${esc(out.to_team_name)}${out.offer_amount ? ' with ' + money(out.offer_amount) : ''} - waiting <a href="#" data-withdraw="${out.id}">Withdraw</a></div>` : '';
        const incoming = inc.map(r => `<div style="font-size:13px;margin-top:4px"><strong>${esc(r.from_team_name)}</strong> asks you to play${r.offer_amount ? ' and offers <strong>' + money(r.offer_amount) + '</strong>' : ''}
            <button class="btn btn-primary" data-accept="${r.id}">Accept</button> <button class="btn btn-ghost" data-decline="${r.id}">Decline</button></div>`).join('');
        return `<tr><td>${w.week_number}</td><td class="muted">${esc(w.start_date || '')}</td><td>${w.opponent_id ? nameCell(w.opponent_id) : '<span class="muted">Bye</span>'} ${status}${pending}${incoming}</td><td>${change}</td><td>${cash}</td><td>${action}</td></tr>`;
      }).join('')}
      </tbody></table></div>`;
  }

  // ---- scoreboard
  const weeks = await api(`/leagues/${LEAGUE_ID}/weeks`);
  const withGames = weeks.filter(w => matchups.some(m => m.week_id === w.id));
  let board = '';
  if (withGames.length) {
    if (view.schedWeek === undefined || !withGames.some(w => w.id === view.schedWeek))
      view.schedWeek = (withGames.filter(w => w.scored).pop() || withGames[0]).id;
    const wk = withGames.find(w => w.id === view.schedWeek);
    const list = matchups.filter(m => m.week_id === wk.id);
    const card = (m, i) => {
      const win = (id) => m.winner_team_id === id ? 'font-weight:700' : '';
      return `<div class="card elev-sm" data-m="${i}" style="padding:var(--space-3) var(--space-4);cursor:pointer">
        ${m.championship ? '<div class="card-kicker">Conference championship</div>' : ''}
        <div class="row"><span style="flex:1;${win(m.team_a_id)}">${tn(m.team_a_id, m.team_a_name)}</span><span class="pts" style="${win(m.team_a_id)}">${m.scored ? m.team_a_score.toFixed(1) : ''}</span></div>
        <div class="row"><span style="flex:1;${win(m.team_b_id)}">${tn(m.team_b_id, m.team_b_name)}</span><span class="pts" style="${win(m.team_b_id)}">${m.scored ? m.team_b_score.toFixed(1) : ''}</span></div>
        ${m.scored && m.winner_team_id === null ? '<div class="muted" style="font-size:12px">Tie</div>' : ''}</div>`;
    };
    board = `
      <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3)">
        <select id="sched-week" class="inp">${withGames.map(w => `<option value="${w.id}"${w.id === wk.id ? ' selected' : ''}>Week ${w.week_number}${w.week_number === state.championship_week ? ' - conference championships' : ''} - ${w.start_date || ''}${w.scored ? '' : ' (not played)'}</option>`).join('')}</select>
        <span class="muted" style="font-size:13px">Team scores are fantasy points (starters only), scaled so a league's season average matches the NCAA's. Player numbers are raw EPA credit. ${wk.locked ? 'This week is over: lineups are locked' + (canActForAi ? ' - as a commissioner-mode commissioner you can still change them.' : '.') : 'Each player locks the moment his own game starts: after that he cannot be moved, signed, dropped or traded.'}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-3)">${list.map(card).join('')}</div>
      <div id="m-detail" style="margin-top:var(--space-5)"></div>`;
    view._list = list; view._wk = wk;
  } else if (state.has_schedule) {
    board = '<p class="muted">No games to show yet.</p>';
  }

  const champBox = !selfSchedule ? '' : `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin:var(--space-4) 0">
    <h3 style="margin:0 0 var(--space-2)">Week ${state.championship_week}: conference championships</h3>
    ${champ.ready ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-2)">${champ.games.map(g => `<div><span class="muted" style="font-size:12px">${esc(ov.teams.find(t => t.conference_id === g.conference_id)?.conference_name || '')}</span><br>${tn(g.team_a_id, g.team_a_name)} vs ${tn(g.team_b_id, g.team_b_name)}</div>`).join('')}</div>
        ${champ.byes.length ? `<p class="muted" style="margin:var(--space-2) 0 0;font-size:13px">Bye - season over: ${champ.byes.map(b => tn(b.team_id, b.team_name)).join(', ')}</p>` : ''}`
      : '<p class="muted" style="margin:0;font-size:14px">Set once weeks 1-9 are scored: within each conference the #1 team plays #2, #3 plays #4, and so on. In a conference with an odd number of teams the worst team gets a bye and its season is over.</p>'}</div>`;

  $('content').innerHTML = banner + mine + board + champBox;
  wireSchedule(state);
}

// The auto-generated schedule of a league whose teams don't set their own (NHL series, NFL weeks): read-only.
async function proScheduleHtml(state) {
  const teams = ov.teams;
  if (view.proTeam === undefined || !teamsById[view.proTeam]) view.proTeam = (myTeam() || teams[0])?.id;
  const t = teamsById[view.proTeam];
  const head = (body) => `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);overflow-x:auto">
    <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:baseline">
      <div><div class="card-kicker">Schedule</div><h3 style="margin:0">${isHockey() ? 'Series schedule' : 'Season schedule'}</h3></div>
      ${t ? `<select id="pro-team" class="inp">${teams.map(x => `<option value="${x.id}"${x.id === view.proTeam ? ' selected' : ''}>${esc(x.name)}${x.id === myTeam()?.id ? ' (you)' : ''}</option>`).join('')}</select>` : ''}</div>
    <p class="muted" style="font-size:13px;margin:var(--space-2) 0">The schedule is generated for you when the draft ends - only college leagues arrange their own opponents.</p>${body}</div>`;
  if (!state.has_schedule) {
    const ready = ov.draft_state === 'complete';
    return head(`<p style="margin:var(--space-2) 0">${ready ? 'No schedule has been created yet.' : 'The schedule is created automatically as soon as the draft finishes.'}</p>
      ${ready && isCommissioner ? '<button class="btn btn-primary" id="mk-sched">Generate schedule now</button>' : ''}`);
  }
  if (isHockey()) {
    const s = await api(`/teams/${t.id}/series-schedule`);
    const fmtD = (d) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
    const rows = s.series.flatMap((x, si) => x.games.map(g => ({x, g, si})))
      .sort((a, b) => a.g.calendar_date.localeCompare(b.g.calendar_date) || a.g.daily_game_id - b.g.daily_game_id);
    let gameNo = 0;
    rows.forEach(r => { r.no = r.g.is_matchup_day ? ++gameNo : null; });   // the team's game number of the season
    const result = (g) => {
      const link = (txt) => `<a href="/static/nhl-game.html?daily_game_id=${g.daily_game_id}">${txt}</a>`;
      if (!g.is_matchup_day) return '<span class="muted">No matchup</span>';
      if (g.status === 'LIVE_SIMULATING' || g.status === 'LIVE') return link('<span class="pill" style="background:#ef4444;color:white">LIVE</span>');
      if (g.status === 'FINAL') {
        if (g.team_score == null) return link('Final') + ' <span class="muted" style="font-size:11px">(watch highlights to reveal the score)</span>';
        const w = g.team_score > g.opponent_score;
        return `${link(`${g.team_score} - ${g.opponent_score}`)} <span class="pill ${w ? 'good' : ''}">${w ? 'W' : g.team_score === g.opponent_score ? 'T' : 'L'}</span>`;
      }
      return '<span class="muted">Not played</span>';
    };
    return head(`<table class="table"><thead><tr><th>Game</th><th>Series</th><th>Dates</th><th>Opponent</th><th>Home / Away</th><th>Result</th></tr></thead><tbody>
      ${rows.map(({x, g, si, no}) => `<tr><td>${no ?? '-'}</td><td>${si + 1}</td>
        <td>${fmtD(g.calendar_date)}${g.calendar_date_end && g.calendar_date_end !== g.calendar_date ? ' - ' + fmtD(g.calendar_date_end) : ''}</td>
        <td>${tn(x.opponent_id, x.opponent_name)}</td><td>${g.is_matchup_day ? (g.home_away === 'home' ? 'Home' : 'Away') : ''}</td><td>${result(g)}</td></tr>`).join('')}
      </tbody></table>
      <div style="margin-top:var(--space-3);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">
        <a href="#" data-go="roster" class="btn btn-secondary">View 3-Game Windows &amp; Lines on Roster</a>
        ${isCommissioner ? `<button type="button" class="btn btn-secondary" id="btn-resched-nhl-tab" style="font-size:12px">Reschedule Season to Next Full Window</button>` : ''}
      </div>`);
  }
  const sch = await api(`/teams/${t.id}/schedule`);
  return head(`<table class="table"><thead><tr><th>Week</th><th>Starts</th><th>Opponent</th></tr></thead><tbody>
    ${sch.weeks.map(w => `<tr><td>${w.week_number}</td><td class="muted">${esc(w.start_date || '')}</td><td>${w.opponent_id ? tn(w.opponent_id, w.opponent_name) : '<span class="muted">Bye</span>'}</td></tr>`).join('')}</tbody></table>`);
}

function wireSchedule(state) {
  const act = async (fn) => { try { await fn(); await renderSchedule(); } catch (e) { showError(e.message); } };
  if ($('btn-resched-nhl-tab')) {
    $('btn-resched-nhl-tab').onclick = async () => {
      if (!confirm('Reschedule series schedule to begin at the start of the next full window?')) return;
      try {
        await api(`/leagues/${LEAGUE_ID}/reschedule-next-window`, {method: 'POST'});
        toast('Season successfully rescheduled to next full window!');
        renderSchedule();
      } catch (err) {
        alert('Failed to reschedule: ' + (err.message || err));
      }
    };
  }
  if ($('mk-sched')) $('mk-sched').onclick = () => act(async () => {
    if (state.is_college) return FSC.post(`/leagues/${LEAGUE_ID}/schedule/auto`, {weeks: state.regular_weeks});
    const r = await FSC.post(`/leagues/${LEAGUE_ID}/schedule/generate`);
    if (!r.created) throw new Error(r.reason || 'The schedule could not be created yet.');
  });
  if ($('pro-team')) $('pro-team').onchange = (e) => { view.proTeam = Number(e.target.value); renderSchedule(); };
  if ($('close-stage')) $('close-stage').onclick = () => { if (confirm('Close the schedule stage? AI teams answer the requests made to them, all other open requests are declined, and nothing can change afterwards.')) act(async () => {
    const r = await FSC.post(`/leagues/${LEAGUE_ID}/schedule/close`); showResult(`Stage closed: ${r.accepted} request${r.accepted === 1 ? '' : 's'} accepted by AI teams, ${r.declined} declined.`); }); };
  if ($('sched-team')) $('sched-team').onchange = (e) => { view.schedTeam = Number(e.target.value); renderSchedule(); };
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => {
    const wid = b.dataset.send, pick = document.querySelector(`[data-pick="${wid}"]`).value;
    if (!pick) { showError('Choose a different team to ask first.'); return; }
    act(() => FSC.post(`/teams/${view.schedTeam}/schedule/requests`, {week_id: Number(wid), to_team_id: Number(pick), offer_amount: Number(document.querySelector(`[data-offer="${wid}"]`).value || 0)}));
  });
  document.querySelectorAll('[data-withdraw]').forEach(a => a.onclick = (e) => { e.preventDefault(); act(() => FSC.api(`/schedule/requests/${a.dataset.withdraw}`, {method: 'DELETE'})); });
  document.querySelectorAll('[data-accept]').forEach(b => b.onclick = () => act(() => FSC.post(`/schedule/requests/${b.dataset.accept}/respond`, {accept: true})));
  document.querySelectorAll('[data-decline]').forEach(b => b.onclick = () => act(() => FSC.post(`/schedule/requests/${b.dataset.decline}/respond`, {accept: false})));
  if ($('sched-week')) {
    $('sched-week').onchange = (e) => { view.schedWeek = Number(e.target.value); view.schedMatchup = null; renderSchedule(); };
    document.querySelectorAll('[data-m]').forEach(c => c.onclick = () => showMatchup(view._list[Number(c.dataset.m)], Number(c.dataset.m), view._wk));
    if (view.schedMatchup !== undefined && view.schedMatchup !== null && view._list[view.schedMatchup]) showMatchup(view._list[view.schedMatchup], view.schedMatchup, view._wk);
  }
}

async function showMatchup(m, index, wk) {
  view.schedMatchup = index;
  const [a, b] = await Promise.all([m.team_a_id, m.team_b_id].map(id => api(`/teams/${id}/week-breakdown?week_id=${m.week_id}`)));
  const canEdit = (id) => canSetLines(teamsById[id]);
  const side = (t) => `<div class="card elev-sm" style="padding:var(--space-4);overflow-x:auto">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">${tn(t.team_id, t.team_name)}</h3><strong>${m.scored ? t.total_points.toFixed(1) + ' pts' : ''}</strong></div>
      ${m.scored ? `<div class="muted" style="font-size:12px">starters' summed credit ${fmt(t.raw_credit)}</div>` : ''}
      <table class="table"><thead><tr><th>Slot</th><th>Player</th><th>Team</th><th style="text-align:right">Credit</th></tr></thead><tbody>
      ${t.starters.map(s => `<tr><td>${esc(s.slot_code)}</td><td><a href="#" data-play="${s.draftable_asset_id}" data-wk="${m.week_id}">${esc(s.display_name)}</a> <span class="muted">${esc(s.position || '')}</span></td>
        <td class="muted">${esc(s.real_team || '')}${s.played ? '' : ' (no game)'}</td><td class="pts">${m.scored ? fmt(s.points) : ''}</td></tr>`).join('')}
      </tbody></table>
      ${canEdit(t.team_id) && (!wk.locked || canActForAi) ? `<a class="btn btn-secondary" href="/static/lineup.html?league_id=${LEAGUE_ID}&team_id=${t.team_id}&week_id=${m.week_id}">${wk.locked ? 'Change lineup retroactively' : 'Edit lineup'}</a>` : ''}
    </div>`;
  $('m-detail').innerHTML = `<div class="grid2">${side(a)}${side(b)}</div><div id="play-detail" style="margin-top:var(--space-4)"></div>`;
  document.querySelectorAll('[data-play]').forEach(l => l.onclick = async (e) => {
    e.preventDefault();
    const d = await api(`/players/${l.dataset.play}/weekly-score?week_id=${l.dataset.wk}`);
    $('play-detail').innerHTML = `<div class="card elev-sm" style="padding:var(--space-4)"><h3 style="margin:0 0 var(--space-2)">${esc(d.display_name)} - ${fmt(d.total_points)}</h3>
      ${d.play_credits.length ? d.play_credits.map(c => `<div class="row" style="font-size:13px"><span class="pts" style="text-align:left;min-width:60px">${fmt(c.credit_points)}</span><span class="muted" style="min-width:90px">${esc(c.role)}</span><span style="flex:1">${esc(c.play_text || '')}</span></div>`).join('') : '<p class="muted" style="margin:0">No credited plays this week.</p>'}</div>`;
  });
}

// ---- RANKINGS ---------------------------------------------------------------------------------------------
const LEAGUE_FORMATS = [['traditional_redraft', 'Traditional Redraft'], ['future_pick_redraft', 'Future Draft Pick Redraft'], ['keeper', 'Keeper'], ['dynasty', 'Dynasty']];

const LEAGUE_FORMAT_NOTES = {
  traditional_redraft: "Rosters reset each season. The next season's draft order is randomly selected on draft day.",
  future_pick_redraft: "The next season's draft is a snake draft in reverse order of the standings.",
  keeper: "Owners keep part of their roster (or all of it). The next season's draft is in reverse order of the standings. It does not snake.",
  dynasty: "Teams keep their whole roster and hold a rookie draft. The draft is in reverse order of the standings. It does not snake.",
};
const KEEPER_STYLES = [
  ['rookie_resign', 'Rookie draft only', 'One rookie draft; owners re-sign keepers as the roster allows.'],
  ['combined', 'Rookies and refills combined', 'One draft with rookies and refill players together.'],
  ['separate', 'Separate rookie and refill drafts', 'A rookie draft first, then a refill draft.'],
];
// Datetimes from the API are naive UTC; the browser's datetime-local input is local time.
const utcToLocalInput = (s) => { if (!s) return ''; const d = new Date(s + 'Z'); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const localInputToUtc = (v) => v ? new Date(v).toISOString() : null;
const fmtUtc = (s) => s ? new Date(s + 'Z').toLocaleString() : '-';
const jsonOpts = (method, body) => ({method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});

// Everyone can read the league's settings; only the commissioner gets the controls (the API enforces it too).
async function renderLeagueSettings() {
  const lg = await api(`/leagues/${LEAGUE_ID}`);
  const seasons = await api(`/leagues/${LEAGUE_ID}/seasons`);
  const seasonStatus = await api(`/leagues/${LEAGUE_ID}/season-status`);
  const fmtName = (f) => Object.fromEntries(LEAGUE_FORMATS)[f] || f;
  const isKeeper = lg.league_format === 'keeper', isDynasty = lg.league_format === 'dynasty';
  const keepsRosters = isKeeper || isDynasty;
  const style = KEEPER_STYLES.find(s => s[0] === lg.keeper_draft_style) || KEEPER_STYLES[0];
  const needsRefill = isKeeper && lg.keeper_draft_style !== 'rookie_resign';
  const keeperPhase = lg.offseason && isKeeper && !lg.keepers_finalized;
  let html = (isCommissioner ? `<div class="note" style="margin-bottom:var(--space-4)">Everyone in the league is emailed when a league setting changes.</div>` : '')
    + `<div class="card"><h3>League Format</h3>` + (isCommissioner
    ? `<select id="league-format">${LEAGUE_FORMATS.map(([v, l]) => `<option value="${v}"${v === lg.league_format ? ' selected' : ''}>${l}</option>`).join('')}</select>`
    : `<p>${esc(fmtName(lg.league_format))}</p><p class="muted">Only the commissioner can change league settings.</p>`)
    + `<p class="muted">${esc(LEAGUE_FORMAT_NOTES[lg.league_format] || '')}</p></div>`;

  const siteUrl = location.origin + '/l/' + (lg.slug || 'your-league-name');
  html += `<div class="card"><h3>Logo and Custom URL</h3>`
    + `<div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)">${Retro.leagueMark(lg, 6)}`
    + (isCommissioner
      ? `<span><input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif"> <button type="button" class="btn btn-secondary" id="logo-remove"${lg.logo_url ? '' : ' disabled'}>Remove logo</button><br><span class="muted" style="font-size:13px">PNG, JPEG, WebP or GIF, up to 512 KB. Square images look best.</span></span>`
      : `<span class="muted">${lg.logo_url ? '' : 'No logo yet.'}</span>`)
    + `</div>`
    + (isCommissioner
      ? `<p><label>Custom URL <span class="muted">${esc(location.origin)}/l/</span><input id="slug-input" value="${esc(lg.slug || '')}" maxlength="40" placeholder="your-league-name" style="width:16em"></label> <button type="button" class="btn btn-primary" id="slug-save">Save</button></p><p class="muted" style="font-size:13px">3 to 40 letters, numbers and hyphens. Leave it empty to remove the custom URL.</p>`
      : (lg.slug ? `<p>Custom URL: <a href="${esc(siteUrl)}">${esc(siteUrl)}</a></p>` : `<p class="muted">No custom URL set.</p>`))
    + (lg.slug && isCommissioner ? `<p>Share: <a href="${esc(siteUrl)}">${esc(siteUrl)}</a></p>` : '') + `</div>`;

  if (isKeeper) {
    html += `<div class="card"><h3>Keeper Settings</h3>`
      + `<p>Teams that keep their whole roster only get the rookie draft. Teams that keep less get the draft style below.</p>`
      + (isCommissioner
        ? `<p><label>Draft style <select id="keeper-style">${KEEPER_STYLES.map(([v, l]) => `<option value="${v}"${v === lg.keeper_draft_style ? ' selected' : ''}>${l}</option>`).join('')}</select></label></p>
           <p><label>Most players a team can keep <input id="keeper-limit" type="number" min="0" max="100" value="${lg.keeper_limit ?? ''}" placeholder="whole roster" style="width:8em"></label></p>
           <p><label>Keeper deadline <input id="keeper-deadline" type="datetime-local" value="${utcToLocalInput(lg.keeper_deadline)}"></label>
              <button type="button" class="btn btn-primary" id="keeper-settings-save">Save</button></p>`
        : `<p>Draft style: ${esc(style[1])}. ${esc(style[2])}</p><p>Most players a team can keep: ${lg.keeper_limit ?? 'its whole roster'}</p>`)
      + `<p><b>Keeper deadline:</b> ${lg.keeper_deadline ? esc(fmtUtc(lg.keeper_deadline)) : '<span class="muted">not set yet</span>'}</p>`
      + `<p class="muted">Teams that haven't picked by the deadline are trimmed automatically. AI teams keep the players with the best combined score of youth, points per game and games played.</p></div>`;
  }

  if (isHockey()) {
    const nTeams = ov.teams.length, defPlayoff = Math.max(1, Math.floor(nTeams * 0.33 + 0.5));
    const inUse = lg.playoff_teams || defPlayoff;
    html += `<div class="card"><h3>Standings &amp; Playoffs</h3>` + (isCommissioner
      ? `<p><label>Standings are sorted by <select id="standings-mode">
            <option value="points"${lg.standings_mode === 'points' ? ' selected' : ''}>Points</option>
            <option value="win_pct"${lg.standings_mode === 'win_pct' ? ' selected' : ''}>Win Percentage</option></select></label></p>
         <p><label>Points for a win <input id="points-win" type="number" min="0" max="20" value="${lg.points_per_win}" style="width:4em"></label>
            <label> Points for a tie <input id="points-tie" type="number" min="0" max="20" value="${lg.points_per_tie}" style="width:4em"></label>
            <span class="muted">(used when sorting by points)</span></p>
         <p><label>Playoff teams <input id="playoff-teams" type="number" min="1" max="${nTeams}" value="${inUse}" style="width:4em"></label>
            <label> First-round byes <input id="playoff-byes" type="number" min="0" max="${nTeams}" value="${lg.playoff_byes || 0}" style="width:4em"></label></p>
         <p><label><input id="division-winners-qualify" type="checkbox"${lg.division_winners_qualify ? ' checked' : ''}> Division winners are guaranteed a playoff spot</label><br>
            <label><input id="division-winners-first" type="checkbox"${lg.division_winners_seeded_first ? ' checked' : ''}> Division winners take the top seeds (wild cards follow, by rank)</label></p>
         <p><b>When a team is eliminated from the playoffs:</b><br>
            <label><input type="radio" name="playoff-consolation" value="no"${lg.playoff_consolation ? '' : ' checked'}> Its season ends</label><br>
            <label><input type="radio" name="playoff-consolation" value="yes"${lg.playoff_consolation ? ' checked' : ''}> It plays consolation matchups (these never change who is eliminated)</label></p>
         <p><b>Ties in the standings are broken by</b> (in this order):</p><div id="tiebreaker-editor"></div>
         <p><button type="button" class="btn btn-primary" id="standings-save">Save</button></p>
         ${lg.playoff_teams ? '' : `<p class="note">How many teams should make the playoffs? Until you choose, the default is ${defPlayoff} (33% of ${nTeams} teams, rounded). Pick a number and save.</p>`}`
      : `<p>Standings are sorted by <b>${lg.standings_mode === 'points' ? 'points (' + lg.points_per_win + ' for a win, ' + lg.points_per_tie + ' for a tie)' : 'win percentage'}</b>.</p>
         <p>Playoff teams: <b>${inUse}</b>${lg.playoff_teams ? '' : ' (the default, 33% of the teams)'}${lg.playoff_byes ? `, ${lg.playoff_byes} with a first-round bye` : ''}.</p>
         <p>An eliminated team: <b>${lg.playoff_consolation ? 'plays consolation matchups' : 'has its season end'}</b>.</p>
         <p>Ties are broken by: <b>${(lg.tiebreakers || DEFAULT_TIEBREAKERS).map(tbLabel).join(', then ')}</b>.</p>`)
      + `<p class="muted">Win percentage is (wins + 0.5 x ties) / games played. Teams still level are separated by the tiebreakers, in order. ${lg.division_winners_qualify ? 'Every division winner is in the field, and the other spots are wild cards by rank.' : 'The best teams by rank make the field.'} ${lg.division_winners_qualify && lg.division_winners_seeded_first ? 'Division winners take the top seeds.' : 'Seeds follow rank.'} A team is marked out once no result of the games left can get it into the field.</p></div>`;
  }
  if (lg.league_format !== 'traditional_redraft') {
    const picksOn = lg.pick_trading_enabled;
    html += `<div class="card"><h3>Draft Pick Trading</h3>` + (isCommissioner
      ? `<p><label><input id="pick-trading-enabled" type="checkbox"${picksOn ? ' checked' : ''}> Allow teams to trade draft picks</label></p>`
        + ((isKeeper || isDynasty) && picksOn ? `<p><label>Seasons of draft picks that can be traded <input id="pick-trade-seasons" type="number" min="1" max="10" value="${lg.pick_trade_seasons}" style="width:4em"></label></p>` : '')
        + `<p><button type="button" class="btn btn-primary" id="pick-trade-save">Save</button></p>`
      : (picksOn ? `<p>Draft picks can be traded${(isKeeper || isDynasty) ? ' for the next ' + lg.pick_trade_seasons + ' draft' + (lg.pick_trade_seasons === 1 ? '' : 's') : ' for the next draft'}.</p>` : `<p>Draft pick trading is turned off in this league.</p>`))
      + `<p class="muted">${isKeeper || isDynasty ? 'Pick rounds follow the rookie rounds you set when starting a new season (3 until then). ' : ''}Turning it off stops new pick trades; picks already traded stay with their new owners.</p></div>`;
  }
  const paid = lg.league_type === 'PAID';
  html += `<div class="card"><h3>League Type &amp; Trade Rules</h3>` + (isCommissioner
    ? `<p><label>League type <select id="league-type"><option value="FREE"${paid ? '' : ' selected'}>Free</option><option value="PAID"${paid ? ' selected' : ''}>Paid</option></select></label>
         <label> Annual dues $ <input id="league-dues" type="number" min="1" step="1" value="${lg.annual_dues_cents ? lg.annual_dues_cents / 100 : ''}" style="width:6em"></label></p>
       <p><label>Trade deadline <input id="trade-deadline" type="datetime-local" value="${utcToLocalInput(lg.trade_deadline)}"></label></p>
       <p><button type="button" class="btn btn-primary" id="league-type-save">Save</button></p>`
    : `<p>${paid ? 'Paid league - $' + (lg.annual_dues_cents / 100).toFixed(2) + ' annual dues.' : 'Free league - no dues.'}</p>
       <p>Trade deadline: <b>${lg.trade_deadline ? esc(fmtUtc(lg.trade_deadline)) : 'none'}</b></p>`)
    + `<p class="muted">${paid ? 'Eliminated teams, and teams trading away future picks, must have the relevant seasons dues paid first.' : 'Eliminated teams can trade only for future draft picks, with majority league approval and the commissioner sign-off.'} Once rosters exist, changing the type midseason needs every manager's approval.</p></div>`;
  const half = Math.floor(ov.teams.length / 2);
  html += `<div class="card"><h3>Trade Voting</h3>` + (isCommissioner
    ? `<p><label>Votes needed beyond half the league <input id="vote-extra" type="number" min="1" max="20" value="${lg.trade_vote_extra_votes}" style="width:4em"></label>
         <span class="muted">(${Math.min(ov.teams.length, half + lg.trade_vote_extra_votes)} of ${ov.teams.length} teams now)</span></p>
       <p><label>Votes needed when the commissioner's team is in the trade <input id="commish-vote-extra" type="number" min="1" max="20" value="${lg.commissioner_trade_vote_extra_votes}" style="width:4em"></label>
         <span class="muted">(${Math.min(ov.teams.length, half + lg.commissioner_trade_vote_extra_votes)} of ${ov.teams.length} teams now)</span></p>
       <p><button type="button" class="btn btn-primary" id="vote-rules-save">Save</button></p>`
    : `<p>A trade that goes to a league vote needs <b>${Math.min(ov.teams.length, half + lg.trade_vote_extra_votes)}</b> of ${ov.teams.length} votes, or <b>${Math.min(ov.teams.length, half + lg.commissioner_trade_vote_extra_votes)}</b> when the commissioner's team is in it.</p>`)
    + `<p class="muted">Exactly half never passes. The commissioner has no sign-off on a trade their own team is in; the league decides it.</p></div>`;
  // Draft order: random, or fixed by the commissioner until the draft starts.
  const orderTeams = (await api(`/leagues/${LEAGUE_ID}/teams`)).slice()
    .sort((a, b) => (a.draft_position ?? 1e9) - (b.draft_position ?? 1e9) || a.id - b.id);
  const draftStarted = ['in_progress', 'complete'].includes(ov.draft_state);
  const manualOrder = lg.draft_order_mode === 'manual';
  html += `<div class="card"><h3>Draft Order</h3>`
    + (isCommissioner && !draftStarted
      ? `<p><label>Order <select id="do-mode"><option value="random"${manualOrder ? '' : ' selected'}>Random - shuffled when the draft starts</option><option value="manual"${manualOrder ? ' selected' : ''}>Set by the commissioner</option></select></label></p>
         <div id="do-list"${manualOrder ? '' : ' hidden'}></div>
         <p><button type="button" class="btn btn-primary" id="do-save">Save</button></p>`
      : `<p>${manualOrder ? 'Set by the commissioner:' : 'Random - shuffled when the draft starts.'}</p>`
        + (manualOrder ? `<ol>${orderTeams.map(t => `<li>${esc(t.name)}</li>`).join('')}</ol>` : ''))
    + `<p class="muted">${draftStarted ? 'The draft has started, so the order can no longer change. ' : ''}Round 1 follows this order; in a snake draft the next round reverses it. Drafts in later seasons follow the league format.</p></div>`;

  const dr = await api(`/leagues/${LEAGUE_ID}/draft-resets`);
  const DR_KIND = {snake: ['Snake draft', 'pick'], auction: ['Auction draft', 'round'], recruiting: ['Recruiting draft', 'period']};
  const DR_MODE = {now: 'The commissioner can reset this now.', vote: 'Needs every manager to approve.', off: 'Resetting is turned off for a completed draft.'};
  const drState = (d) => {
    const [name, unit] = DR_KIND[d.kind];
    return `<div style="margin:var(--space-3) 0;padding-bottom:var(--space-3);border-bottom:1px solid var(--color-divider)"><b>${name}</b> <span class="pill">${esc(d.status.replace('_', ' '))}</span>
      <div class="muted">${d.done} of ${d.total || d.done} ${unit}s done. ${d.can_reset ? DR_MODE[d.mode] : esc(d.reason || '')}</div>`
      + (isCommissioner && d.can_reset
        ? `<p><label>Keep the first <input type="number" class="dr-keep" min="0" max="${d.done - 1}" value="0" style="width:5em"> ${unit}s <span class="muted">(0 starts over)</span></label>
             <button type="button" class="btn btn-secondary dr-reset" data-kind="${d.kind}" data-id="${d.draft_id}" data-unit="${unit}">Reset draft</button></p>` : '') + `</div>`;
  };
  const drReq = dr.open_request;
  const drOpen = drReq ? `<div class="card" style="border-color:var(--color-accent,#c90)"><b>Vote: reset the ${DR_KIND[drReq.draft_kind][0].toLowerCase()}${drReq.keep ? ' back to ' + drReq.keep + ' ' + DR_KIND[drReq.draft_kind][1] + 's done' : ' to the start'}</b>
      <p class="muted">It happens only if every manager approves; one rejection ends it.</p>`
    + drReq.votes.map(v => `<div>${esc(v.team_name)}: <b>${v.vote ? (v.vote === 'approve' ? 'Approved' : 'Rejected') : 'Waiting'}</b></div>`).join('')
    + (drReq.can_vote ? `<p><button type="button" class="btn btn-primary dr-vote" data-id="${drReq.id}" data-vote="approve">Approve</button>
        <button type="button" class="btn btn-secondary dr-vote" data-id="${drReq.id}" data-vote="reject">Reject</button></p>` : '')
    + (isCommissioner ? `<p><button type="button" class="btn btn-ghost dr-cancel" data-id="${drReq.id}">Withdraw request</button></p>` : '') + `</div>` : '';
  const drHist = dr.history.slice(0, 5).map(r => `<div class="muted">${esc(DR_KIND[r.draft_kind][0])}, ${r.keep ? 'back to ' + r.keep : 'to the start'}: ${esc(r.status)}${r.failure_reason ? ' (' + esc(r.failure_reason) + ')' : ''}</div>`).join('');
  html += `<div class="card"><h3>Draft Reset</h3>` + (isCommissioner
    ? `<p><label>After a draft is complete <select id="dr-policy"><option value="unanimous"${dr.policy === 'unanimous' ? ' selected' : ''}>every manager must approve</option><option value="commissioner"${dr.policy === 'commissioner' ? ' selected' : ''}>the commissioner decides alone</option><option value="off"${dr.policy === 'off' ? ' selected' : ''}>resetting is not allowed</option></select></label>
         <button type="button" class="btn btn-primary" id="dr-policy-save">Save</button></p>`
    : `<p>After a draft is complete, a reset needs: <b>${({unanimous: 'every manager to approve', commissioner: 'the commissioner', off: 'nothing - it is not allowed'})[dr.policy]}</b>.</p>`)
    + drOpen + (dr.drafts.length ? dr.drafts.map(drState).join('') : `<p class="muted">No draft has been started in this league.</p>`) + drHist
    + `<p class="muted">While a draft is running the commissioner can reset it alone, to the start or to a chosen point. A completed draft can only be reset until games are scored or players are traded or signed. Pick order and who owns each pick never change.</p></div>`;
  const pending = (await api(`/leagues/${LEAGUE_ID}/setting-changes`)).filter(c => c.status === 'voting');
  const SETTING_NAMES = {league_type: 'League type', league_format: 'League format'};
  const valueName = (f, v) => f === 'league_format' ? fmtName(v) : (v === 'PAID' ? 'Paid' : 'Free');
  if (pending.length || isCommissioner) {
    html += `<div class="card"><h3>Votes on League Changes</h3>` + (pending.length ? pending.map(c => `<div style="margin-bottom:var(--space-3)">
        <p><b>${SETTING_NAMES[c.field]}: ${esc(valueName(c.field, c.old_value))} &rarr; ${esc(valueName(c.field, c.new_value))}</b><br>
        <span class="muted">Every manager has to approve. One rejection ends it.</span></p>
        <p>${c.votes.map(v => `${esc(v.team_name)}: <b>${v.vote ? (v.vote === 'approve' ? 'approved' : 'rejected') : 'waiting'}</b>`).join(' &middot; ')}</p>
        ${c.can_vote ? `<p>${c.my_vote ? 'You ' + (c.my_vote === 'approve' ? 'approved' : 'rejected') + '. ' : ''}<button type="button" class="btn btn-primary setting-vote" data-id="${c.id}" data-vote="approve">Approve</button>
          <button type="button" class="btn btn-secondary setting-vote" data-id="${c.id}" data-vote="reject">Reject</button></p>` : ''}
        ${isCommissioner ? `<p><button type="button" class="btn btn-secondary setting-cancel" data-id="${c.id}">Withdraw</button></p>` : ''}</div>`).join('')
      : `<p class="muted">None open.</p>`)
      + `<p class="muted">Once rosters exist, changing the league type or format midseason needs every manager's approval, because teams draft to the rules they joined. In the offseason it applies at once.</p></div>`;
  }
  html += `<div class="card"><h3>Season ${lg.season_number}${lg.offseason ? ' - offseason' : ''}</h3>`;
  if (lg.offseason) {
    html += keeperPhase
      ? `<p>Keeper selection is open until <b>${esc(fmtUtc(lg.keeper_deadline))}</b>. Teams that haven't picked by then are trimmed automatically: the players with the fewest games played last season are released.</p>`
      : `<p class="muted">Keepers are set. Each draft starts once every team that takes part has roster room for it - teams that kept their whole roster drop players first.</p>`;
    if (isCommissioner && keeperPhase) html += `<p><button type="button" class="btn btn-secondary" id="keeper-finalize">Close keepers now</button></p>`;
  } else if (isCommissioner) {
    html += `<p>When the championship is complete, start the new season. That archives this season and opens the offseason.</p>`
      + (keepsRosters ? `<p><label>Rookie draft rounds <input id="rollover-rounds" type="number" min="1" max="60" value="${lg.offseason_draft_rounds || 3}" style="width:4em"></label>
           ${needsRefill ? `<label> Refill rounds <input id="rollover-refill" type="number" min="1" max="60" value="${lg.offseason_refill_rounds || 3}" style="width:4em"></label>` : ''}
         </p>${isKeeper && !lg.keeper_deadline ? '<p class="muted">Set the keeper deadline in Keeper Settings above before rolling over.</p>' : ''}` : '')
      + `<p><button type="button" class="btn btn-primary" id="rollover-btn"${seasonStatus.championship_complete ? '' : ' disabled'}>Start New Season</button></p>`
      + (seasonStatus.championship_complete ? '' : `<p class="muted" style="margin-top:var(--space-2)">${esc(seasonStatus.reason || '')}</p>`);
  }
  html += `</div><div id="keeper-pick-card"></div>`;

  html += `<div class="card"><h3>League History</h3>` + (seasons.length ? seasons.map(s => `<details><summary>${s.label ? esc(s.label) : 'Season ' + s.season_number} - ${esc(fmtName(s.league_format))}${s.champion_team_id && teamsById[s.champion_team_id] ? ' - champion: ' + esc(teamsById[s.champion_team_id].name) : (s.standings[0] ? ' - top seed: ' + esc(s.standings[0].team_name) : '')}</summary>
      ${s.note ? `<p class="muted" style="margin:var(--space-2) 0">${esc(s.note)}</p>` : ''}${s.edited_at ? '<p class="muted" style="margin:0 0 var(--space-2);font-size:12px">Corrected by a commissioner.</p>' : ''}
      <table><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>T</th></tr>${s.standings.map(r => `<tr><td>${r.rank}</td><td>${esc(r.team_name)}</td><td>${r.wins ?? ''}</td><td>${r.losses ?? ''}</td><td>${r.ties ?? ''}</td></tr>`).join('')}</table></details>`).join('')
    : `<p class="muted">No archived seasons yet.</p>`) + `</div>`;
  $('content').innerHTML = html;

  const tbHost = $('tiebreaker-editor');
  if (tbHost) tbEditor(tbHost, lg.tiebreakers || DEFAULT_TIEBREAKERS, false);
  const call = async (fn, done) => {
    showError(''); showResult('');
    try { await fn(); await refreshOverview(); await go('league-settings'); if (done) showResult(done); } catch (e) { showError(e.message); }
  };
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const logoFile = $('logo-file');
  if (logoFile) logoFile.onchange = () => {
    const f = logoFile.files[0];
    if (!f) return;
    if (f.size > 512 * 1024) { showError('The logo must be 512 KB or smaller.'); logoFile.value = ''; return; }
    call(() => api(`/leagues/${LEAGUE_ID}/logo`, {method: 'PUT', headers: {'Content-Type': f.type || 'application/octet-stream'}, body: f}), 'Logo saved.');
  };
  on('logo-remove', () => call(() => api(`/leagues/${LEAGUE_ID}/logo`, {method: 'DELETE'}), 'Logo removed.'));
  on('slug-save', () => call(() => api(`/leagues/${LEAGUE_ID}/slug`, jsonOpts('PUT', {slug: $('slug-input').value.trim() || null})), 'Custom URL saved.'));
  const sel = $('league-format');
  if (sel) sel.onchange = () => call(async () => { await api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {league_format: sel.value})); },
    'League format saved. If rosters exist, it stays as it was until every manager approves (see Votes on League Changes).');
  on('keeper-settings-save', () => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {
    keeper_draft_style: $('keeper-style').value, keeper_limit: $('keeper-limit').value === '' ? null : parseInt($('keeper-limit').value, 10),
    keeper_deadline: localInputToUtc($('keeper-deadline').value)})), 'Keeper settings saved.'));
  on('standings-save', () => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {
    standings_mode: $('standings-mode').value, points_per_win: parseInt($('points-win').value, 10),
    points_per_tie: parseInt($('points-tie').value, 10), playoff_teams: parseInt($('playoff-teams').value, 10),
    playoff_byes: parseInt($('playoff-byes').value, 10) || 0, division_winners_qualify: $('division-winners-qualify').checked,
    division_winners_seeded_first: $('division-winners-first').checked,
    playoff_consolation: document.querySelector('input[name=playoff-consolation]:checked').value === 'yes', tiebreakers: tbPayload($('tiebreaker-editor'))})), 'Standings and playoff settings saved. Elimination was re-checked under the new rules.'));
  on('pick-trade-save', () => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', Object.assign(
    {pick_trading_enabled: $('pick-trading-enabled').checked}, $('pick-trade-seasons') ? {pick_trade_seasons: parseInt($('pick-trade-seasons').value, 10)} : {}))), 'Pick trading saved.'));
  on('league-type-save', () => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {
    league_type: $('league-type').value,
    annual_dues_cents: $('league-dues').value === '' ? null : Math.round(parseFloat($('league-dues').value) * 100),
    trade_deadline: localInputToUtc($('trade-deadline').value)})), 'League type and trade rules saved. A type change midseason waits for every manager to approve (see Votes on League Changes).'));
  on('vote-rules-save', () => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {
    trade_vote_extra_votes: parseInt($('vote-extra').value, 10), commissioner_trade_vote_extra_votes: parseInt($('commish-vote-extra').value, 10)})),
    'Trade voting rules saved.'));
  const doList = $('do-list');
  if (doList) {
    let doOrder = orderTeams.map(t => t.id);
    const drawOrder = () => {
      doList.innerHTML = doOrder.map((id, i) => {
        const t = orderTeams.find(x => x.id === id);
        return `<div style="display:flex;align-items:center;gap:8px;margin:2px 0"><span style="min-width:2.2em;font-weight:700">${i + 1}.</span><span>${esc(t.name)}</span>
          <button type="button" class="btn btn-secondary" data-do-up="${i}"${i === 0 ? ' disabled' : ''} aria-label="Move up">&uarr;</button>
          <button type="button" class="btn btn-secondary" data-do-down="${i}"${i === doOrder.length - 1 ? ' disabled' : ''} aria-label="Move down">&darr;</button></div>`;
      }).join('');
      const swap = (i, j) => { [doOrder[i], doOrder[j]] = [doOrder[j], doOrder[i]]; drawOrder(); };
      doList.querySelectorAll('[data-do-up]').forEach(b => b.onclick = () => swap(+b.dataset.doUp, +b.dataset.doUp - 1));
      doList.querySelectorAll('[data-do-down]').forEach(b => b.onclick = () => swap(+b.dataset.doDown, +b.dataset.doDown + 1));
    };
    drawOrder();
    $('do-mode').onchange = () => { doList.hidden = $('do-mode').value !== 'manual'; };
    on('do-save', () => call(() => api(`/leagues/${LEAGUE_ID}/draft-order`, jsonOpts('PUT', {
      mode: $('do-mode').value, team_order: $('do-mode').value === 'manual' ? doOrder : null})), 'Draft order saved.'));
  }
  on('dr-policy-save',() => call(() => api(`/leagues/${LEAGUE_ID}/settings`, jsonOpts('PATCH', {draft_reset_policy: $('dr-policy').value})), 'Draft reset rule saved.'));
  document.querySelectorAll('.dr-reset').forEach(b => b.onclick = () => {
    const keep = parseInt(b.parentElement.querySelector('.dr-keep').value, 10) || 0;
    const where = keep === 0 ? 'back to the start' : `back to after ${b.dataset.unit} ${keep}`;
    if (!confirm(`Reset this draft ${where}? Everything drafted after that point is undone.`)) return;
    call(() => api(`/leagues/${LEAGUE_ID}/draft-resets`, jsonOpts('POST', {kind: b.dataset.kind, draft_id: parseInt(b.dataset.id, 10), keep})),
      'Done. If the draft was complete the managers were asked to approve; otherwise it was reset.');
  });
  document.querySelectorAll('.dr-vote').forEach(b => b.onclick = () => call(() => api(`/draft-resets/${b.dataset.id}/vote`, jsonOpts('POST', {vote: b.dataset.vote})), 'Vote recorded.'));
  document.querySelectorAll('.dr-cancel').forEach(b => b.onclick = () => call(() => api(`/draft-resets/${b.dataset.id}/cancel`, {method: 'POST'}), 'Request withdrawn.'));
  document.querySelectorAll('.setting-vote').forEach(b => b.onclick = () => call(() => api(`/leagues/${LEAGUE_ID}/setting-changes/${b.dataset.id}/vote`, jsonOpts('POST', {vote: b.dataset.vote})), 'Vote recorded.'));
  document.querySelectorAll('.setting-cancel').forEach(b => b.onclick = () => call(() => api(`/leagues/${LEAGUE_ID}/setting-changes/${b.dataset.id}/cancel`, {method: 'POST'}), 'Vote withdrawn.'));
  on('keeper-finalize', () => { if (confirm('Close keeper selection now? Teams that have not picked are trimmed automatically and everyone not kept is released.')) call(() => api(`/leagues/${LEAGUE_ID}/keepers/finalize`, {method: 'POST'}), 'Keepers closed.'); });
  on('rollover-btn', () => {
    if (!confirm(`Start season ${lg.season_number + 1}? This archives season ${lg.season_number} and opens the offseason. It clears the season's matchups, lineups and scores${keepsRosters ? '' : ' and every roster'}.`)) return;
    const num = (id) => $(id) ? parseInt($(id).value, 10) : null;
    call(() => api(`/leagues/${LEAGUE_ID}/rollover`, jsonOpts('POST', {offseason_draft_rounds: num('rollover-rounds'), refill_rounds: num('rollover-refill')})),
      `Season ${lg.season_number} archived. The league is in the offseason.`);
  });

  if (keeperPhase) await renderKeeperPicks(lg);
}

// Keeper selection: each owner picks the players their team keeps; everyone else on the roster is released when keepers close.
async function renderKeeperPicks(lg) {
  const teams = ov.teams.filter(t => !t.is_ai_owned && t.owner_user_id === me);
  let html = '';
  const data = {};
  for (const t of teams) {
    const k = await api(`/leagues/${LEAGUE_ID}/teams/${t.id}/keepers`);
    data[t.id] = k;
    html += `<div class="card"><h3>Keepers - ${esc(t.name)}</h3>
      <p>Pick up to ${k.cap} players to keep. <b class="keeper-count" data-team="${t.id}"></b> ${k.submitted ? '<span class="muted">Your picks are saved. You can change them until the deadline.</span>' : '<span class="muted">Not saved yet.</span>'}</p>
      <table><tr><th>Keep</th><th>Player</th><th>Pos</th><th>GP last season</th></tr>${k.players.map(p => `<tr>
        <td><input type="checkbox" class="keeper-box" data-team="${t.id}" value="${p.draftable_asset_id}"${p.kept ? ' checked' : ''}></td>
        <td>${pl(p.draftable_asset_id, p.display_name)}</td><td>${esc(p.position || '')}</td><td>${p.games_played}</td></tr>`).join('')}</table>
      <button type="button" class="btn btn-primary keeper-save" data-team="${t.id}">Save keepers</button></div>`;
  }
  if (!teams.length && isCommissioner) html = `<div class="card"><p class="muted">Owners pick their own keepers. AI teams are trimmed automatically when keepers close.</p></div>`;
  $('keeper-pick-card').innerHTML = html;
  const count = (tid) => {
    const n = document.querySelectorAll(`.keeper-box[data-team="${tid}"]:checked`).length;
    document.querySelector(`.keeper-count[data-team="${tid}"]`).textContent = `${n} of ${data[tid].cap} selected.`;
  };
  teams.forEach(t => { count(t.id); });
  document.querySelectorAll('.keeper-box').forEach(b => b.onchange = () => count(b.dataset.team));
  document.querySelectorAll('.keeper-save').forEach(b => b.onclick = async () => {
    const tid = b.dataset.team;
    const ids = [...document.querySelectorAll(`.keeper-box[data-team="${tid}"]:checked`)].map(x => parseInt(x.value, 10));
    showError(''); showResult('');
    try { await api(`/leagues/${LEAGUE_ID}/teams/${tid}/keepers`, jsonOpts('PUT', {draftable_asset_ids: ids})); await go('league-settings'); showResult('Keepers saved.'); }
    catch (e) { showError(e.message); }
  });
}

// What a team has done: its signings and completed trades, plus any commissioner adjustment (GET /leagues/{id}/transaction-counts).
const txnCounts = async () => Object.fromEntries((await api(`/leagues/${LEAGUE_ID}/transaction-counts`).catch(() => [])).map(c => [c.team_id, c]));
const txnCell = (counts, id) => { const c = counts[id]; return c ? `<td title="${c.signings} signings + ${c.trades} trades${c.adjustment ? ', adjusted by the commissioner' : ''}">${c.total}</td>` : '<td class="muted">-</td>'; };

// ---- STANDINGS -------------------------------------------------------------------------------------------
async function renderStandings() {
  await refreshOverview();
  if (isHockey()) return renderHockeyStandings();
  const [rows, counts] = await Promise.all([api(`/leagues/${LEAGUE_ID}/standings`), txnCounts()]);
  const played = rows.some(r => r.wins + r.losses + r.ties > 0);
  const byConf = {};
  rows.forEach(r => {
    const t = teamsById[r.team_id];
    const groupName = t?.division_name ? `${t.conference_name || 'Conference'} · ${t.division_name}` : (t?.conference_name || 'Other');
    (byConf[groupName] = byConf[groupName] || []).push({...r, t});
  });
  $('content').innerHTML = (played ? '' : '<div class="note" style="margin-bottom:var(--space-4)">No games have been played yet. Standings fill in once weekly matchups are scored - every team is 0-0 until then.</div>')
    + `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-5)">` + Object.entries(byConf).map(([name, list]) => {
      list.sort((a, b) => b.wins - a.wins || b.points_for - a.points_for || a.team_name.localeCompare(b.team_name));
      return `<div><h3 style="margin:0 0 var(--space-2)">${esc(name)}</h3><table class="table"><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th title="Free-agent and waiver signings plus completed trades">Txns</th></tr></thead><tbody>
        ${list.map((r, i) => `<tr><td>${i + 1}</td><td>${tn(r.team_id, r.team_name)} ${r.t?.is_ai_owned ? '<span class="pill ai">AI</span>' : ''}${r.eliminated ? ' <span class="pill" title="Mathematically eliminated from the playoffs">out</span>' : ''}</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.ties}</td><td>${r.points_for.toFixed(1)}</td><td>${r.points_against.toFixed(1)}</td>${txnCell(counts, r.team_id)}</tr>`).join('')}
        </tbody></table></div>`; }).join('') + '</div>';
}

// NHL standings: built from the simulated games the viewer may see (the same ones the scoreboard shows).
async function renderHockeyStandings() {
  const [sres, odds, counts] = await Promise.all([api(`/leagues/${LEAGUE_ID}/series-standings`),
    api(`/leagues/${LEAGUE_ID}/playoff-odds`).catch(() => null), txnCounts()]);    // the estimate is a bonus; the table works without it
  const oddsOf = Object.fromEntries((odds?.teams || []).map(o => [o.team_id, o]));
  const oddsPct = (o) => !o ? '<span class="muted">-</span>' : o.eliminated ? '<span class="pill">out</span>'
    : (o.playoff_probability >= 0.995 ? '>99' : o.playoff_probability < 0.005 ? '<1' : Math.round(o.playoff_probability * 100)) + '%';
  const standings = sres.standings;
  const played = standings.some(r => r.wins + r.losses + r.ties > 0);
  const pct = (v) => v.toFixed(3).replace(/^0/, '');
  const sortedBy = sres.standings_mode === 'points' ? `points (${sres.points_per_win} for a win, ${sres.points_per_tie} for a tie)` : 'win percentage';
  const byConf = {};
  standings.forEach(r => {
    const t = teamsById[r.team_id];
    const groupName = t?.division_name ? `${t.conference_name || 'Conference'} · ${t.division_name}` : (t?.conference_name || 'Other');
    (byConf[groupName] = byConf[groupName] || []).push({...r, t});
  });
  const rec = (w, l, t) => `${w}-${l}${t ? '-' + t : ''}`;
  $('content').innerHTML = (played ? '' : '<div class="note" style="margin-bottom:var(--space-4)">No games have been played yet. Standings fill in as simulated games finish and you watch them (or skip to the score).</div>')
    + `<p class="muted" style="margin:0 0 var(--space-3);font-size:13px">Sorted by <strong>${sortedBy}</strong>, then ${(sres.tiebreakers || []).map(tbLabel).join(', then ').toLowerCase() || 'team order'}. <strong>Seed</strong>: the ${sres.playoff_teams} playoff teams${sres.division_winners_qualify ? ' - division winners (*) are in' + (sres.division_winners_seeded_first ? ' and take the top seeds' : '') + ', the rest are wild cards by rank' : ', by rank'}${sres.playoff_byes ? `; the top ${sres.playoff_byes} get a bye (B)` : ''}. <strong>Out</strong>: no result of the games left can get the team in. <strong>Txns</strong>: the team's free-agent and waiver signings plus completed trades. <strong>Playoff %</strong> is an estimate, not a guarantee: the rest of the season is simulated ${odds ? odds.simulations.toLocaleString() : ''} times from each team's goals scored and against (its Pythagorean record), and only a proven "out" removes a team.</p>`
    + `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,760px),1fr));gap:var(--space-5)">` + Object.entries(byConf).map(([name, list]) => {
      list.sort((a, b) => a.rank - b.rank || a.team_name.localeCompare(b.team_name));
      return `<div style="min-width:0"><h3 style="margin:0 0 var(--space-2)">${esc(name)}</h3><div style="overflow-x:auto"><table class="table" style="white-space:nowrap"><thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>PTS</th><th>PCT</th><th>GF</th><th>GA</th><th>Home</th><th>Away</th><th>Seed</th><th title="Estimated chance of making the playoffs">Playoff %</th><th title="Free-agent and waiver signings plus completed trades">Txns</th></tr></thead><tbody>
        ${list.map((r, i) => `<tr><td>${i + 1}</td><td>${tn(r.team_id, r.team_name)} ${r.t?.is_ai_owned ? '<span class="pill ai">AI</span>' : ''}</td><td>${r.games_played}</td><td>${r.wins}</td><td>${r.losses}</td><td>${r.ties}</td><td><strong>${r.points}</strong></td><td>${pct(r.win_pct)}</td><td>${r.goals_for}</td><td>${r.goals_against}</td><td>${rec(r.home_wins, r.home_losses, r.home_ties)}</td><td>${rec(r.away_wins, r.away_losses, r.away_ties)}</td><td>${r.seed ? '<span class="pill good">' + r.seed + (r.division_winner ? '*' : '') + (r.bye ? ' B' : '') + '</span>' : '<span class="muted">-</span>'}</td><td>${oddsPct(oddsOf[r.team_id])}</td>${txnCell(counts, r.team_id)}</tr>`).join('')}
        </tbody></table></div></div>`; }).join('') + '</div>';
}
