                ${(can && tr.proposer_team_id === t.id) ? `<button type="button" class="btn btn-ghost btn-sm" data-trade-cancel="${tr.id}" style="font-size:11px;color:var(--color-danger)">Cancel Trade</button>` : ''}
              </div>
            </div>

            <div class="grid2" style="margin-bottom:var(--space-3);gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px;text-transform:uppercase;font-weight:700">${esc(tr.proposer_team_name)} receives:</div>
                <div>${tr.receive_assets.map(assetPill).join('')}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px;text-transform:uppercase;font-weight:700">${esc(tr.counterparty_team_name)} receives:</div>
                <div>${tr.send_assets.map(assetPill).join('')}</div>
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--color-divider)">
              <div style="font-size:12px">
                ${hasVoted ? `<span style="color:var(--color-accent);font-weight:600">Your team voted: ${tr.user_vote === 'approve' ? 'Approved ✓' : 'Rejected ✗'}</span>` : '<span class="muted">Your vote is needed for this trade.</span>'}
              </div>
              ${can ? `
                <div style="display:flex;gap:var(--space-2)">
                  <button type="button" class="btn ${tr.user_vote === 'approve' ? 'btn-primary' : 'btn-secondary'}" data-trade-vote="${tr.id}" data-vote="approve" style="font-size:12px;padding:4px 12px">Approve (${tr.approvals})</button>
                  <button type="button" class="btn ${tr.user_vote === 'reject' ? 'btn-primary' : 'btn-secondary'}" data-trade-vote="${tr.id}" data-vote="reject" style="font-size:12px;padding:4px 12px;color:var(--color-danger)">Reject (${tr.rejections})</button>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('') : '<div class="card elev-sm" style="padding:var(--space-4)"><p class="muted" style="margin:0">No active AI trades requiring vote.</p></div>'}
    </div>

    <!-- Direct Incoming & Outgoing Human Trades -->
    ${(incomingDirect.length || outgoingDirect.length) ? `
      <div style="margin-bottom:var(--space-6)">
        <h3 style="margin:0 0 var(--space-2)">Direct Trade Proposals</h3>
        ${incomingDirect.map(tr => `
          <div class="card elev-sm" style="padding:var(--space-4);margin-bottom:var(--space-3);border-left:4px solid var(--color-primary)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
              <div><strong>Offer from ${esc(tr.proposer_team_name)}</strong></div>
              ${can ? `
                <div style="display:flex;gap:var(--space-2)">
                  <button type="button" class="btn btn-primary btn-sm" data-trade-respond="${tr.id}" data-accept="true">Accept Trade</button>
                  <button type="button" class="btn btn-secondary btn-sm" data-trade-respond="${tr.id}" data-accept="false">Decline</button>
                </div>
              ` : ''}
            </div>
            <div class="grid2" style="gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You receive:</div>
                <div>${tr.send_assets.map(assetPill).join('')}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You give up:</div>
                <div>${tr.receive_assets.map(assetPill).join('')}</div>
              </div>
            </div>
          </div>
        `).join('')}

        ${outgoingDirect.map(tr => `
          <div class="card elev-sm" style="padding:var(--space-4);margin-bottom:var(--space-3)">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-3)">
              <div><strong>Offer sent to ${esc(tr.counterparty_team_name)}</strong> <span class="muted" style="font-size:12px">(Pending response)</span></div>
              ${can ? `<button type="button" class="btn btn-ghost btn-sm" data-trade-cancel="${tr.id}" style="color:var(--color-danger)">Cancel</button>` : ''}
            </div>
            <div class="grid2" style="gap:var(--space-3)">
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You receive:</div>
                <div>${tr.receive_assets.map(assetPill).join('')}</div>
              </div>
              <div style="padding:var(--space-2) var(--space-3);background:var(--color-surface);border-radius:var(--radius-md);border:1px solid var(--color-divider)">
                <div class="muted" style="font-size:11px;margin-bottom:4px">You send:</div>
                <div>${tr.send_assets.map(assetPill).join('')}</div>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <!-- Propose Trade Form -->
    <div class="card elev-sm" style="padding:var(--space-5);margin-bottom:var(--space-6)">
      <h3 style="margin:0 0 var(--space-2)">Propose a Trade</h3>
      <p class="muted" style="margin:0 0 var(--space-4);font-size:13px">
        Trade players with any team in the league. Select the opponent team, choose players to send from your roster, and players to receive from theirs.
      </p>

      <div style="margin-bottom:var(--space-4);max-width:360px">
        <label for="trade-opp" style="font-size:13px;font-weight:600;display:block;margin-bottom:4px">Select trading partner:</label>
        <select id="trade-opp" class="inp" style="width:100%">
          ${otherTeams.map(o => `<option value="${o.id}" ${o.id === tradeSelectedOppId ? 'selected' : ''}>${esc(o.name)}${o.is_ai_owned ? ' (AI Team)' : ''}</option>`).join('')}
        </select>
      </div>

      <div class="note" style="margin-bottom:var(--space-4)">
        ${isOppAi
          ? '<strong>Trading with an AI team:</strong> This proposal will be submitted to the league for majority approval (&gt;50% of teams must approve). Proposer automatically votes approve.'
          : '<strong>Trading with a human manager:</strong> This proposal will be delivered directly to ' + esc(oppTeam?.name || 'them') + ' to review and accept or decline.'}
      </div>

      <div class="grid2" style="margin-bottom:var(--space-4)">
        <div style="border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)">
          <h4 style="margin:0 0 var(--space-2)">You send (${esc(t.name)})</h4>
          <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px" id="trade-send-list">
            ${sortRoster(myRoster).map(p => `
              <label style="display:flex;align-items:center;gap:var(--space-2);padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
                <input type="checkbox" name="trade-send-chk" value="${p.draftable_asset_id}">
                ${posTag(p.position)}
                <span style="flex:1"><strong>${esc(p.display_name)}</strong> <span class="muted">${esc(p.real_team || '')}</span></span>
                <span class="pts muted">${pts(p.last_season_points)} pts</span>
              </label>
            `).join('') || '<p class="muted">No players rostered.</p>'}
          </div>
        </div>

        <div style="border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-3)">
          <h4 style="margin:0 0 var(--space-2)">You receive (${esc(oppTeam?.name || 'Opponent')})</h4>
          <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px" id="trade-recv-list">
            ${sortRoster(oppRoster).map(p => `
              <label style="display:flex;align-items:center;gap:var(--space-2);padding:4px 6px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px">
                <input type="checkbox" name="trade-recv-chk" value="${p.draftable_asset_id}">
                ${posTag(p.position)}
                <span style="flex:1"><strong>${esc(p.display_name)}</strong> <span class="muted">${esc(p.real_team || '')}</span></span>
                <span class="pts muted">${pts(p.last_season_points)} pts</span>
              </label>
            `).join('') || '<p class="muted">No players rostered on opponent team.</p>'}
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:var(--space-2)">
        <button type="button" class="btn btn-primary" id="btn-submit-trade" ${can ? '' : 'disabled'}>Submit Trade Proposal</button>
      </div>
    </div>

    <!-- Completed / Past Trades -->
    <div>
      <h3 style="margin:0 0 var(--space-2)">Trade History</h3>
      <div class="card elev-sm" style="padding:var(--space-3) var(--space-4)">
        ${pastTrades.length ? pastTrades.map(tr => `
          <div class="row" style="flex-wrap:wrap;gap:var(--space-2);padding:8px 0">
            <span class="tag" style="min-width:70px;justify-content:center;${tr.status === 'accepted' ? 'background:#052e16;color:#4ade80' : 'background:#451a03;color:#fbbf24'}">${tr.status.toUpperCase()}</span>
            <div style="flex:1;min-width:240px">
              <strong>${esc(tr.proposer_team_name)}</strong> gave ${tr.send_assets.map(a => esc(a.display_name)).join(', ') || 'nothing'}
              <span class="muted">to</span>
              <strong>${esc(tr.counterparty_team_name)}</strong> for ${tr.receive_assets.map(a => esc(a.display_name)).join(', ') || 'nothing'}
            </div>
            <span class="muted" style="font-size:12px">${tr.resolved_at ? new Date(tr.resolved_at).toLocaleDateString() : ''}</span>
          </div>
        `).join('') : '<p class="muted" style="margin:var(--space-2) 0">No completed trades yet.</p>'}
      </div>
    </div>
  `;

  $('team-pick').onchange = () => { activeTeamId = Number($('team-pick').value); go('trades'); };

  $('trade-opp').onchange = () => {
    tradeSelectedOppId = Number($('trade-opp').value);
    renderTrades();
  };

  $('btn-submit-trade').onclick = async () => {
    showError(''); showResult('');
    const sendChecks = document.querySelectorAll('input[name="trade-send-chk"]:checked');
    const recvChecks = document.querySelectorAll('input[name="trade-recv-chk"]:checked');
    const sendIds = Array.from(sendChecks).map(c => Number(c.value));
    const recvIds = Array.from(recvChecks).map(c => Number(c.value));

    if (!sendIds.length || !recvIds.length) {
      showError('Please select at least one player to send and one player to receive.');
      return;
    }

    try {
      const res = await FSC.post(`/leagues/${LEAGUE_ID}/trades`, {
        proposer_team_id: t.id,
        counterparty_team_id: tradeSelectedOppId,
        send_asset_ids: sendIds,
        receive_asset_ids: recvIds,
      });
      if (res.status === 'accepted') {
        showResult('Trade approved and executed!');
      } else if (res.status === 'voting') {
        showResult(`Trade proposed to ${esc(res.counterparty_team_name)}! Requires league majority approval before executing.`);
      } else {
        showResult(`Trade proposal sent to ${esc(res.counterparty_team_name)}.`);
      }
      await renderTrades();
    } catch (e) {
      showError(e.message);
    }
  };

  document.querySelectorAll('[data-trade-vote]').forEach(btn => {
    btn.onclick = async () => {
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeVote);
      const vote = btn.dataset.vote;
      try {
        const res = await FSC.post(`/trades/${tradeId}/vote`, {team_id: t.id, vote});
        if (res.status === 'accepted') {
          showResult('League majority approval reached! Trade executed successfully.');
        } else if (res.status === 'rejected') {
          showResult('Trade rejected by league majority.');
        } else {
          showResult(`Vote recorded: ${vote === 'approve' ? 'Approved' : 'Rejected'}. (${res.approvals} of ${res.majority_needed} approvals)`);
        }
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });

  document.querySelectorAll('[data-trade-respond]').forEach(btn => {
    btn.onclick = async () => {
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeRespond);
      const accept = btn.dataset.accept === 'true';
      try {
        const res = await FSC.post(`/trades/${tradeId}/respond`, {team_id: t.id, accept});
        showResult(accept ? 'Trade accepted and executed!' : 'Trade offer declined.');
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });

  document.querySelectorAll('[data-trade-cancel]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Are you sure you want to cancel this trade proposal?')) return;
      showError(''); showResult('');
      const tradeId = Number(btn.dataset.tradeCancel);
      try {
        await FSC.post(`/trades/${tradeId}/cancel`, {});
        showResult('Trade cancelled.');
        await renderTrades();
      } catch (e) {
        showError(e.message);
      }
    };
  });
}

// ---- SCHEDULE: preseason stage + scoreboard ------------------------------------------------------------
// Team scores are fantasy points (platform/scoring_scale.py); per-player numbers are raw EPA credit.
const fmt = (x) => (x === null || x === undefined) ? '-' : (x > 0 ? '+' : '') + x.toFixed(2);

async function renderSchedule() {
  await refreshOverview();
  const [state, matchups, champ] = await Promise.all([
    api(`/leagues/${LEAGUE_ID}/schedule/state`), api(`/leagues/${LEAGUE_ID}/matchups`), api(`/leagues/${LEAGUE_ID}/championships`)]);
  const managed = ov.teams.filter(canManage);
  if (view.schedTeam === undefined || !managed.some(t => t.id === view.schedTeam)) view.schedTeam = (managed.find(t => !t.is_ai_owned) || managed[0])?.id ?? null;
  const mySchedule = view.schedTeam && ov.teams_set_schedule ? await api(`/teams/${view.schedTeam}/schedule`) : null;

  const selfSchedule = ov.teams_set_schedule;
  const banner = !selfSchedule ? await proScheduleHtml(state) :
  `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4)">
    <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:center">
      <div><div class="card-kicker">Preseason schedule stage</div>
        <strong>${!state.has_schedule ? 'No schedule yet' : state.status === 'open' ? 'Open - teams can still arrange different opponents' : 'Closed - the schedule is set'}</strong>
        <div class="muted" style="font-size:13px;margin-top:2px">Every team starts with a premade schedule for weeks 1-${state.regular_weeks}. A team can ask another team to play it instead (attaching in-game cash if it wants);
          cash only moves if the request is accepted. AI teams answer when the commissioner closes the stage. Week ${state.championship_week} is conference championship week.</div></div>
      <div style="display:flex;gap:var(--space-2)">
        ${isCommissioner && !state.has_schedule ? '<button class="btn btn-primary" id="mk-sched">Create premade schedule</button>' : ''}
        ${isCommissioner && state.has_schedule && state.status === 'open' ? '<button class="btn btn-secondary" id="close-stage">Close schedule stage</button>' : ''}</div></div></div>`;

  const nameCell = (id) => tn(id);
  let mine = '';
  if (selfSchedule && mySchedule && state.has_schedule) {
    const t = teamsById[view.schedTeam];
    mine = `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);overflow-x:auto">
      <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:baseline">
        <h3 style="margin:0">${managed.length > 1 ? `<select id="sched-team" class="inp">${managed.map(x => `<option value="${x.id}"${x.id === view.schedTeam ? ' selected' : ''}>${esc(x.name)}${x.is_ai_owned ? ' (AI)' : ''}</option>`).join('')}</select>` : esc(t.name)} - schedule</h3>
        <span class="muted" style="font-size:13px">Cash you can still offer: <strong>${money(mySchedule.cash_available)}</strong> (free-agency money less your open offers)</span></div>
      <table class="table" style="margin-top:var(--space-2)"><thead><tr><th>Week</th><th>Starts</th><th>Opponent</th><th>Change opponent</th><th>Cash offer</th><th></th></tr></thead><tbody>
      ${mySchedule.weeks.map(w => {
        const out = w.outgoing, inc = w.incoming || [];
        const status = w.agreement ? '<span class="pill ai">Agreed</span>' : '<span class="pill">Premade</span>';
        const change = w.editable
          ? `<select class="inp" data-pick="${w.week_id}"><option value="">- keep ${esc(w.opponent_name || 'bye')} -</option>${w.available.filter(a => a.id !== w.opponent_id).map(a => `<option value="${a.id}"${out && out.to_team_id === a.id ? ' selected' : ''}>${teamsById[a.id]?.poll_rank ? '#' + teamsById[a.id].poll_rank + ' ' : ''}${esc(a.name)}</option>`).join('')}</select>`
          : (w.agreement ? '<span class="muted">Agreement in place</span>' : '<span class="muted">Locked</span>');
        const cash = w.editable ? `<input class="inp" type="number" min="0" step="1" style="width:90px" data-offer="${w.week_id}" value="${out ? out.offer_amount : 0}">` : '';
        const action = w.editable ? `<button class="btn btn-secondary" data-send="${w.week_id}">Send request</button>` : '';
        const pending = out ? `<div class="muted" style="font-size:12px">Asked ${esc(out.to_team_name)}${out.offer_amount ? ' with ' + money(out.offer_amount) : ''} - waiting <a href="#" data-withdraw="${out.id}">Withdraw</a></div>` : '';
        const incoming = inc.map(r => `<div style="font-size:13px;margin-top:4px"><strong>${esc(r.from_team_name)}</strong> asks you to play${r.offer_amount ? ' and offers <strong>' + money(r.offer_amount) + '</strong>' : ''}
            <button class="btn btn-primary" data-accept="${r.id}">Accept</button> <button class="btn btn-ghost" data-decline="${r.id}">Decline</button></div>`).join('');
        return `<tr><td>${w.week_number}</td><td class="muted">${esc(w.start_date || '')}</td><td>${w.opponent_id ? nameCell(w.opponent_id) : '<span class="muted">Bye</span>'} ${status}${pending}${incoming}</td><td>${change}</td><td>${cash}</td><td>${action}</td></tr>`;
      }).join('')}
      </tbody></table></div>`;
  }

  // ---- scoreboard
  const weeks = await api(`/leagues/${LEAGUE_ID}/weeks`);
  const withGames = weeks.filter(w => matchups.some(m => m.week_id === w.id));
  let board = '';
  if (withGames.length) {
    if (view.schedWeek === undefined || !withGames.some(w => w.id === view.schedWeek))
      view.schedWeek = (withGames.filter(w => w.scored).pop() || withGames[0]).id;
    const wk = withGames.find(w => w.id === view.schedWeek);
    const list = matchups.filter(m => m.week_id === wk.id);
    const card = (m, i) => {
      const win = (id) => m.winner_team_id === id ? 'font-weight:700' : '';
      return `<div class="card elev-sm" data-m="${i}" style="padding:var(--space-3) var(--space-4);cursor:pointer">
        ${m.championship ? '<div class="card-kicker">Conference championship</div>' : ''}
        <div class="row"><span style="flex:1;${win(m.team_a_id)}">${tn(m.team_a_id, m.team_a_name)}</span><span class="pts" style="${win(m.team_a_id)}">${m.scored ? m.team_a_score.toFixed(1) : ''}</span></div>
        <div class="row"><span style="flex:1;${win(m.team_b_id)}">${tn(m.team_b_id, m.team_b_name)}</span><span class="pts" style="${win(m.team_b_id)}">${m.scored ? m.team_b_score.toFixed(1) : ''}</span></div>
        ${m.scored && m.winner_team_id === null ? '<div class="muted" style="font-size:12px">Tie</div>' : ''}</div>`;
    };
    board = `
      <div style="display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-3)">
        <select id="sched-week" class="inp">${withGames.map(w => `<option value="${w.id}"${w.id === wk.id ? ' selected' : ''}>Week ${w.week_number}${w.week_number === state.championship_week ? ' - conference championships' : ''} - ${w.start_date || ''}${w.scored ? '' : ' (not played)'}</option>`).join('')}</select>
        <span class="muted" style="font-size:13px">Team scores are fantasy points (starters only), scaled so a league's season average matches the NCAA's. Player numbers are raw EPA credit. ${wk.locked ? 'This week has started: lineups are locked' + (canActForAi ? ' - as a commissioner-mode commissioner you can still change them.' : '.') : 'Lineups are open until this week starts.'}</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-3)">${list.map(card).join('')}</div>
      <div id="m-detail" style="margin-top:var(--space-5)"></div>`;
    view._list = list; view._wk = wk;
  } else if (state.has_schedule) {
    board = '<p class="muted">No games to show yet.</p>';
  }

  const champBox = !selfSchedule ? '' : `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin:var(--space-4) 0">
    <h3 style="margin:0 0 var(--space-2)">Week ${state.championship_week}: conference championships</h3>
    ${champ.ready ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-2)">${champ.games.map(g => `<div><span class="muted" style="font-size:12px">${esc(ov.teams.find(t => t.conference_id === g.conference_id)?.conference_name || '')}</span><br>${tn(g.team_a_id, g.team_a_name)} vs ${tn(g.team_b_id, g.team_b_name)}</div>`).join('')}</div>
        ${champ.byes.length ? `<p class="muted" style="margin:var(--space-2) 0 0;font-size:13px">Bye - season over: ${champ.byes.map(b => tn(b.team_id, b.team_name)).join(', ')}</p>` : ''}`
      : '<p class="muted" style="margin:0;font-size:14px">Set once weeks 1-9 are scored: within each conference the #1 team plays #2, #3 plays #4, and so on. In a conference with an odd number of teams the worst team gets a bye and its season is over.</p>'}</div>`;

  $('content').innerHTML = banner + mine + board + champBox;
  wireSchedule(state);
}

// The auto-generated schedule of a league whose teams don't set their own (NHL series, NFL weeks): read-only.
async function proScheduleHtml(state) {
  const teams = ov.teams;
  if (view.proTeam === undefined || !teamsById[view.proTeam]) view.proTeam = (myTeam() || teams[0])?.id;
  const t = teamsById[view.proTeam];
  const head = (body) => `<div class="card elev-sm" style="padding:var(--space-4) var(--space-5);margin-bottom:var(--space-4);overflow-x:auto">
    <div style="display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;align-items:baseline">
      <div><div class="card-kicker">Schedule</div><h3 style="margin:0">${isHockey() ? 'Series schedule' : 'Season schedule'}</h3></div>
      ${t ? `<select id="pro-team" class="inp">${teams.map(x => `<option value="${x.id}"${x.id === view.proTeam ? ' selected' : ''}>${esc(x.name)}${x.id === myTeam()?.id ? ' (you)' : ''}</option>`).join('')}</select>` : ''}</div>
    <p class="muted" style="font-size:13px;margin:var(--space-2) 0">The schedule is generated for you when the draft ends - only college leagues arrange their own opponents.</p>${body}</div>`;
  if (!state.has_schedule) {
    const ready = ov.draft_state === 'complete';
    return head(`<p style="margin:var(--space-2) 0">${ready ? 'No schedule has been created yet.' : 'The schedule is created automatically as soon as the draft finishes.'}</p>
      ${ready && isCommissioner ? '<button class="btn btn-primary" id="mk-sched">Generate schedule now</button>' : ''}`);
  }
  if (isHockey()) {
    const s = await api(`/teams/${t.id}/series-schedule`);
    const fmtD = (d) => new Date(d + 'T00:00:00').toLocaleDateString(undefined, {month: 'short', day: 'numeric'});
    return head(`<table class="table"><thead><tr><th>#</th><th>Dates</th><th>Opponent</th><th>Games</th><th>Status</th></tr></thead><tbody>
      ${s.series.map((x, i) => `<tr><td>${i + 1}</td><td>${fmtD(x.start_date)} - ${fmtD(x.end_date)}</td><td>${tn(x.opponent_id, x.opponent_name)}</td>
        <td>${x.total_days} (${x.games.filter(g => g.home_away === 'home').length} home)
          <div style="font-size:11px;margin-top:2px">${x.games.map(g => `<a href="/static/nhl-game.html?daily_game_id=${g.daily_game_id}" style="margin-right:6px">${fmtD(g.calendar_date)}</a>`).join('')}</div>
        </td><td class="muted">${esc(x.status.toLowerCase().replace('_', ' '))}</td></tr>`).join('')}

      <div style="margin-top:var(--space-3);display:flex;gap:var(--space-2);align-items:center;flex-wrap:wrap">

        ${isCommissioner ? `<button type="button" class="btn btn-secondary" id="btn-resched-nhl-tab" style="font-size:12px">Reschedule Season to Next Full Window</button>` : ''}
      </div>`);
  }
  const sch = await api(`/teams/${t.id}/schedule`);
  return head(`<table class="table"><thead><tr><th>Week</th><th>Starts</th><th>Opponent</th></tr></thead><tbody>
    ${sch.weeks.map(w => `<tr><td>${w.week_number}</td><td class="muted">${esc(w.start_date || '')}</td><td>${w.opponent_id ? tn(w.opponent_id, w.opponent_name) : '<span class="muted">Bye</span>'}</td></tr>`).join('')}</tbody></table>`);
}

function wireSchedule(state) {
  const act = async (fn) => { try { await fn(); await renderSchedule(); } catch (e) { showError(e.message); } };
  if ($('btn-resched-nhl-tab')) {
    $('btn-resched-nhl-tab').onclick = async () => {
      if (!confirm('Reschedule series schedule to begin at the start of the next full window?')) return;
      try {
        await api(`/leagues/${LEAGUE_ID}/reschedule-next-window`, {method: 'POST'});
        toast('Season successfully rescheduled to next full window!');
        renderSchedule();
      } catch (err) {
        alert('Failed to reschedule: ' + (err.message || err));
      }
    };
  }
  if ($('mk-sched')) $('mk-sched').onclick = () => act(async () => {
    if (state.is_college) return FSC.post(`/leagues/${LEAGUE_ID}/schedule/auto`, {weeks: state.regular_weeks});
    const r = await FSC.post(`/leagues/${LEAGUE_ID}/schedule/generate`);
    if (!r.created) throw new Error(r.reason || 'The schedule could not be created yet.');
  });
  if ($('pro-team')) $('pro-team').onchange = (e) => { view.proTeam = Number(e.target.value); renderSchedule(); };
  if ($('close-stage')) $('close-stage').onclick = () => { if (confirm('Close the schedule stage? AI teams answer the requests made to them, all other open requests are declined, and nothing can change afterwards.')) act(async () => {
    const r = await FSC.post(`/leagues/${LEAGUE_ID}/schedule/close`); showResult(`Stage closed: ${r.accepted} request${r.accepted === 1 ? '' : 's'} accepted by AI teams, ${r.declined} declined.`); }); };
  if ($('sched-team')) $('sched-team').onchange = (e) => { view.schedTeam = Number(e.target.value); renderSchedule(); };
  document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => {
    const wid = b.dataset.send, pick = document.querySelector(`[data-pick="${wid}"]`).value;
    if (!pick) { showError('Choose a different team to ask first.'); return; }
    act(() => FSC.post(`/teams/${view.schedTeam}/schedule/requests`, {week_id: Number(wid), to_team_id: Number(pick), offer_amount: Number(document.querySelector(`[data-offer="${wid}"]`).value || 0)}));
  });
  document.querySelectorAll('[data-withdraw]').forEach(a => a.onclick = (e) => { e.preventDefault(); act(() => FSC.api(`/schedule/requests/${a.dataset.withdraw}`, {method: 'DELETE'})); });
  document.querySelectorAll('[data-accept]').forEach(b => b.onclick = () => act(() => FSC.post(`/schedule/requests/${b.dataset.accept}/respond`, {accept: true})));
  document.querySelectorAll('[data-decline]').forEach(b => b.onclick = () => act(() => FSC.post(`/schedule/requests/${b.dataset.decline}/respond`, {accept: false})));
  if ($('sched-week')) {
    $('sched-week').onchange = (e) => { view.schedWeek = Number(e.target.value); view.schedMatchup = null; renderSchedule(); };
    document.querySelectorAll('[data-m]').forEach(c => c.onclick = () => showMatchup(view._list[Number(c.dataset.m)], Number(c.dataset.m), view._wk));
    if (view.schedMatchup !== undefined && view.schedMatchup !== null && view._list[view.schedMatchup]) showMatchup(view._list[view.schedMatchup], view.schedMatchup, view._wk);
  }
}

async function showMatchup(m, index, wk) {
  view.schedMatchup = index;
  const [a, b] = await Promise.all([m.team_a_id, m.team_b_id].map(id => api(`/teams/${id}/week-breakdown?week_id=${m.week_id}`)));
  const canEdit = (id) => teamsById[id] && ((!teamsById[id].is_ai_owned && teamsById[id].owner_user_id === me) || (teamsById[id].is_ai_owned && canActForAi));
  const side = (t) => `<div class="card elev-sm" style="padding:var(--space-4);overflow-x:auto">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><h3 style="margin:0">${tn(t.team_id, t.team_name)}</h3><strong>${m.scored ? t.total_points.toFixed(1) + ' pts' : ''}</strong></div>
      ${m.scored ? `<div class="muted" style="font-size:12px">starters' summed credit ${fmt(t.raw_credit)}</div>` : ''}
      <table class="table"><thead><tr><th>Slot</th><th>Player</th><th>Team</th><th style="text-align:right">Credit</th></tr></thead><tbody>
      ${t.starters.map(s => `<tr><td>${esc(s.slot_code)}</td><td><a href="#" data-play="${s.draftable_asset_id}" data-wk="${m.week_id}">${esc(s.display_name)}</a> <span class="muted">${esc(s.position || '')}</span></td>
        <td class="muted">${esc(s.real_team || '')}${s.played ? '' : ' (no game)'}</td><td class="pts">${m.scored ? fmt(s.points) : ''}</td></tr>`).join('')}
      </tbody></table>
      ${canEdit(t.team_id) && (!wk.locked || canActForAi) ? `<a class="btn btn-secondary" href="/static/lineup.html?league_id=${LEAGUE_ID}&team_id=${t.team_id}&week_id=${m.week_id}">${wk.locked ? 'Change lineup retroactively' : 'Edit lineup'}</a>` : ''}
    </div>`;
  $('m-detail').innerHTML = `<div class="grid2">${side(a)}${side(b)}</div><div id="play-detail" style="margin-top:var(--space-4)"></div>`;
  document.querySelectorAll('[data-play]').forEach(l => l.onclick = async (e) => {
    e.preventDefault();
    const d = await api(`/players/${l.dataset.play}/weekly-score?week_id=${l.dataset.wk}`);
    $('play-detail').innerHTML = `<div class="card elev-sm" style="padding:var(--space-4)"><h3 style="margin:0 0 var(--space-2)">${esc(d.display_name)} - ${fmt(d.total_points)}</h3>
      ${d.play_credits.length ? d.play_credits.map(c => `<div class="row" style="font-size:13px"><span class="pts" style="text-align:left;min-width:60px">${fmt(c.credit_points)}</span><span class="muted" style="min-width:90px">${esc(c.role)}</span><span style="flex:1">${esc(c.play_text || '')}</span></div>`).join('') : '<p class="muted" style="margin:0">No credited plays this week.</p>'}</div>`;
  });
}

async function renderStats() {

  cache.stats = await api(`/leagues/${LEAGUE_ID}/stats`);
  cache.weeks = [...new Set(cache.stats.flatMap(r => Object.keys(r.weekly).map(Number)))].sort((a, b) => a - b);
  $('content').innerHTML = `
    <p class="muted" style="margin:0 0 var(--space-3);font-size:13px">Every player in the league's pool. <strong>${LAST} pts</strong> is last season under ESPN standard scoring; <strong>W1, W2, ...</strong> are this platform's own weekly fantasy points for the weeks it has scored. Click a column to sort.${cache.weeks.length ? '' : ' No weekly scores exist for the current season yet, so there are no W columns.'}</p>
    <div style="display:flex;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)"><input id="st-q" class="inp" placeholder="${isHockey() ? 'Search players, NHL teams or fantasy teams...' : 'Search players, schools or teams...'}" style="flex:1;min-width:200px" value="${esc(view.stats.q)}">

    <div id="st-chips" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-3)"></div>

    <p class="muted" id="st-count" style="font-size:12px;margin-top:var(--space-2)"></p>`;
  $('st-who').value = view.stats.who;
  $('st-q').oninput = () => { view.stats.q = $('st-q').value; drawStats(); };
  $('st-who').onchange = () => { view.stats.who = $('st-who').value; drawStats(); };
  drawStats();

function drawStats() {
  const v = view.stats, q = v.q.trim().toLowerCase(), rows = cache.stats;
  const chips = $('st-chips');
  chips.innerHTML = [['', 'All', rows.length]].concat(POSITIONS.map(p => [p, POS_LABEL[p] || p, rows.filter(x => x.position === p).length])).map(([val, l, n]) =>
    `<button class="chip${v.pos === val ? ' on' : ''}" data-pos="${val}">${l}<span class="n">${n}</span></button>`).join('');
  chips.querySelectorAll('.chip').forEach(b => b.onclick = () => { v.pos = b.dataset.pos; drawStats(); });
  const teamName = (r) => r.fantasy_team_id ? (teamsById[r.fantasy_team_id]?.name || '') : 'Free agent';
  const val = (r, k) => k === 'display_name' ? r.display_name.toLowerCase() : k === 'position' ? r.position || '' : k === 'real_team' ? r.real_team || '' : k === 'team' ? teamName(r).toLowerCase()
    : k.startsWith('w') ? (r.weekly[k.slice(1)] ?? null) : (r[k] ?? null);
  let list = rows.filter(r => (!v.pos || r.position === v.pos) && (v.who === 'all' || (v.who === 'fa') === (r.fantasy_team_id == null))
    && (!q || r.display_name.toLowerCase().includes(q) || (r.real_team || '').toLowerCase().includes(q) || teamName(r).toLowerCase().includes(q)));
  list.sort((a, b) => {
    const x = val(a, v.sort), y = val(b, v.sort);
    if (x == null && y == null) return a.display_name.localeCompare(b.display_name);
    if (x == null) return 1; if (y == null) return -1;     // blanks always last
    return (x < y ? -1 : x > y ? 1 : 0) * v.dir || a.display_name.localeCompare(b.display_name);
  });
  const cols = [['display_name', 'Player'], ['position', 'Pos'], ['real_team', isHockey() ? 'NHL Team' : 'School'], ['team', 'Team'], ['last_season_points', LAST + ' pts']].concat(cache.weeks.map(w => ['w' + w, 'W' + w]));
  $('st-head').innerHTML = '<tr>' + cols.map(([k, l]) => `<th class="sort" data-k="${k}">${l}${v.sort === k ? (v.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('') + '</tr>';
  $('st-head').querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; if (v.sort === k) v.dir *= -1; else { v.sort = k; v.dir = ['display_name', 'position', 'real_team', 'team'].includes(k) ? 1 : -1; } drawStats(); });
  $('st-body').innerHTML = list.slice(0, 100).map(r => `<tr><td><strong>${esc(r.display_name)}</strong></td><td>${POS_LABEL[r.position] || r.position || '-'}</td><td>${esc(r.real_team || '')}</td>
    <td>${r.fantasy_team_id ? esc(teamName(r)) : '<span class="muted">Free agent</span>'}</td><td>${pts(r.last_season_points)}</td>${cache.weeks.map(w => `<td>${r.weekly[w] != null ? pts(r.weekly[w]) : '-'}</td>`).join('')}</tr>`).join('');
  $('st-count').textContent = `Showing ${Math.min(100, list.length)} of ${list.length} players.`;
}

      const url = btn.getAttribute('data-copy-invite-url');
      const fullUrl = url.startsWith('http') ? url : (location.origin + url);
      navigator.clipboard.writeText(fullUrl).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = orig, 2000);
      }).catch(() => prompt('Copy invite link:', fullUrl));
    };
  });

  $('content').querySelectorAll('[data-assign-team]').forEach(btn => {
    btn.onclick = () => {
      const tid = Number(btn.getAttribute('data-assign-team'));
      const tname = btn.getAttribute('data-team-name');
      const isAi = btn.getAttribute('data-is-ai') === '1';
      const curEmail = btn.getAttribute('data-email') || '';
      AssignTeamModal.open({
        leagueId: LEAGUE_ID,
        teamId: tid,
        teamName: tname,
        isAi,
        currentEmail: curEmail,
        onAssigned: async () => {
          await renderTeams();
        }
      });
    };
  });
}

// ---- TEAM SETTINGS --------------------------------------------------------------------------------------------
async function renderTeamSettings() {
  await refreshOverview();
  const mine = myTeam();
  const teams = ov.teams || [];

  let targetTeam = mine || (isCommissioner && teams.length ? teams[0] : null);

  if (!targetTeam) {
    $('content').innerHTML = `
      <div class="card elev-sm" style="padding:var(--space-5);max-width:600px;margin:0 auto">
        <h3 style="margin:0 0 var(--space-2)">Team Settings</h3>
        <p class="muted">You do not own a team in this league yet.</p>
        <a href="/static/join-league.html?league_id=${LEAGUE_ID}" class="btn btn-primary">Claim a Team</a>
      </div>
    `;
    return;
  }

  $('content').innerHTML = `
    <div style="max-width:640px;margin:0 auto">
      <div class="card elev-sm" style="padding:var(--space-5)">
        <div class="card-kicker">Team Configuration</div>
        <h2 style="margin:var(--space-1) 0 var(--space-4)">Team Settings</h2>

        ${(isCommissioner && teams.length > 1) ? `
          <div style="margin-bottom:var(--space-4)">
            <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Select Team to Edit</label>
            <select id="settings-team-select" style="width:100%;padding:8px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-surface);color:inherit">
              ${teams.map(t => `<option value="${t.id}" ${t.id === targetTeam.id ? 'selected' : ''}>${esc(t.name)}${mine && t.id === mine.id ? ' (Your Team)' : ''}${t.is_ai_owned ? ' [AI]' : ''}</option>`).join('')}
            </select>
          </div>
        ` : ''}

        <form id="team-settings-form" style="display:flex;flex-direction:column;gap:var(--space-4)">
          <div>
            <label for="settings-team-name" style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Team Name</label>
            <input type="text" id="settings-team-name" value="${esc(targetTeam.name)}" required maxlength="60"
                   style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--color-divider);border-radius:var(--radius-md);font-size:15px;background:var(--color-bg);color:inherit">
            <p class="muted" style="font-size:12px;margin:6px 0 0">Choose a distinct name for your team across the league and scoreboard.</p>
          </div>

          <div style="display:flex;gap:var(--space-3);align-items:center;margin-top:var(--space-2)">
            <button type="submit" class="btn btn-primary" id="btn-save-team-name">Save Team Name</button>
            <span id="settings-status" class="muted" style="font-size:13px"></span>
          </div>
        </form>
      </div>
    </div>
  `;

  const sel = $('settings-team-select');
  if (sel) {
    sel.onchange = () => {
      const selectedId = Number(sel.value);
      targetTeam = teams.find(t => t.id === selectedId) || targetTeam;
      const nameInput = $('settings-team-name');
      if (nameInput) nameInput.value = targetTeam.name;
    };
  }

  const form = $('team-settings-form');
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const statusEl = $('settings-status');
      const submitBtn = $('btn-save-team-name');
      const newName = ($('settings-team-name').value || '').trim();
      if (!newName) return showError('Team name cannot be empty');
      submitBtn.disabled = true;
      if (statusEl) statusEl.textContent = 'Saving...';
      try {
        const updated = await FSC.patch(`/teams/${targetTeam.id}`, { name: newName });
        targetTeam.name = updated.name;
        if (teamsById[targetTeam.id]) teamsById[targetTeam.id].name = updated.name;
        const ovTeam = ov.teams.find(t => t.id === targetTeam.id);
        if (ovTeam) ovTeam.name = updated.name;
        showResult(`Team name successfully updated to "${esc(updated.name)}"`);
        if (statusEl) statusEl.textContent = 'Saved!';
        setTimeout(() => { if (statusEl) statusEl.textContent = ''; }, 3000);
      } catch (err) {
        showError(err.message || 'Failed to update team name');
        if (statusEl) statusEl.textContent = '';
      } finally {
        submitBtn.disabled = false;
      }
    };
  }
}

// ---- start ------------------------------------------------------------------------------------------------------
async function start() {
  if (!LEAGUE_ID) { showError('Missing league_id.'); return; }
  const session = await FSC.current();
  FSC.renderNav('nav-auth');

  const inviteBtn = $('invite-btn');
  if (inviteBtn) {
    const inviteUrl = `${location.origin}/static/join-league.html?league_id=${LEAGUE_ID}`;
    inviteBtn.onclick = () => {
      navigator.clipboard.writeText(inviteUrl).then(() => {
        const msg = $('invite-copied-msg');
        if (msg) { msg.style.display = 'inline'; setTimeout(() => msg.style.display = 'none', 3000); }
      }).catch(() => {
        prompt('Copy invite link:', inviteUrl);
      });
    };
  }

  const scoringBtn = $('btn-how-scoring-works');
  if (scoringBtn) {
    scoringBtn.onclick = () => {
      ScoringModal.open({ sport: isHockey() ? 'nhl' : 'football' });
    };
  }

  if (!session) {
    $('signin-box').style.display = 'flex';
    if ($('signin-page-link')) $('signin-page-link').href = `/static/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
    const users = await fetch('/users').then(r => r.json()).catch(() => []);
    $('signin-select').innerHTML = users.map(u => `<option value="${u.id}">${esc(u.display_name)}</option>`).join('');
    $('signin-btn').onclick = async () => { await FSC.signIn(Number($('signin-select').value)); location.reload(); };
    showError('Sign in to view the league.');
    return;
  }
  me = session.user_id;
  try { const cfg = await fetch('/config').then(r => r.json()); if (cfg.last_season) LAST = String(cfg.last_season); } catch (e) {}
  await refreshOverview();
  const ent = await api('/entitlements/me');
  isCommissioner = ov.commissioner_user_id === me;
  canActForAi = isCommissioner && ent.commissioner_mode;
  $('nav-brand').textContent = ov.name;
  $('league-name').textContent = ov.name;
  $('kicker').textContent = `${isHockey() ? 'NHL' : ov.universe_codes.length && !ov.universe_codes.includes('ncaaf') ? 'NFL' : 'College football'} · ${ov.teams.length} teams · commissioner ${ov.commissioner_name || ''}`;
  $('nav-cm').style.display = isCommissioner ? '' : 'none';
  document.title = ov.name;
  const want = params.get('tab');
  await go(tabList().some(([id]) => id === want) ? want : 'home');
}
start().catch(e => showError(`Failed to load: ${e.message}`));
</script>
</body>
