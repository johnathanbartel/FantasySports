<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup Audit - FantasyMotion</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  body{margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:var(--space-6) var(--space-4)}
  .muted{color:color-mix(in srgb,var(--color-text) 60%,transparent)}
  .banner{display:none;padding:var(--space-3);border-radius:var(--radius-md);margin-bottom:var(--space-4);background:var(--color-accent-2-100);color:var(--color-accent-2-800)}
  .tbl-wrap{overflow-x:auto}
  .table{font-size:13px}
  .table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill2{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--color-neutral-200)}
  .pill2.ok{background:var(--color-accent-100);color:var(--color-accent-800)}
  .pill2.warn{background:#fff6dc;color:#5c4500}
  .pill2.bad{background:#ffdede;color:#8a0010}
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text)">
  <div class="nav">
    <span class="nav-brand">NHL</span>
    <div style="display:flex;gap:var(--space-4);flex-wrap:wrap">
      <a href="/static/index.html">Home</a>
      <a href="/static/dashboard.html">My leagues</a>
      <a href="#" id="nav-league">League home</a>
      <a href="#" aria-current="page">Lineup audit</a>
    </div>
  </div>
  <main class="wrap">
    <p style="margin:0 0 var(--space-3)"><a class="btn btn-secondary" id="back-board" href="#" onclick="if(this.getAttribute('href')==='#'){history.back();return false;}">&larr; Return to scoreboard</a></p>
    <h1 style="margin:0 0 var(--space-2)">Lineup audit</h1>
    <p class="muted" style="margin:0">Every window game: the lineup the simulator froze, against what each team's pecking order gives on the schedule stored now. Read-only.</p>
    <div id="err" class="banner" role="alert"></div>
    <div id="out"><p class="muted">Loading…</p></div>
  </main>
</div>
<script src="/static/session.js"></script>
<script>
const LEAGUE_ID = Number(new URLSearchParams(location.search).get('league_id'));
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = {
  'ok': ['ok', 'ok', 'The frozen lineup is what the pecking order gives on the full schedule.'],
  'not started': ['', 'not started', 'No simulation yet: the lineup will be frozen on the full schedule.'],
  'repairs on sync': ['warn', 'repairs on next sync', 'Frozen on a possibly partial schedule and nothing is published yet: the engine resolves it again once.'],
  'locked, differs': ['bad', 'LOCKED, differs', 'Frozen on a possibly partial schedule and periods are already published, which never change.'],
  'frozen, differs': ['', 'frozen, differs', 'Frozen on the full schedule; today\'s pecking order differs because it was edited since. Not an error.'],
};
function sideHtml(s) {
  const bits = [`${s.frozen == null ? '–' : s.frozen} frozen / ${s.would_start_now} now`];
  if (s.missing_from_frozen && s.missing_from_frozen.length) bits.push(`<strong>missing:</strong> ${s.missing_from_frozen.map(esc).join(', ')}`);
  if (s.only_in_frozen && s.only_in_frozen.length) bits.push(`<span class="muted">only frozen: ${s.only_in_frozen.map(esc).join(', ')}</span>`);
  return `<div><strong>${esc(s.team)}</strong> · ${bits.join(' · ')}</div>`;
}
async function load() {
  try {
    const me = await FSC.current();
    if (!me) throw new Error('You need to be signed in.');
    const d = await FSC.api(`/simulator/leagues/${LEAGUE_ID}/lineup-audit`);
    $('nav-league').href = `/static/league.html?league_id=${LEAGUE_ID}`;
    $('back-board').href = `/static/league.html?league_id=${LEAGUE_ID}&tab=scoreboard`;
    const counts = {};
    d.games.forEach(g => { counts[g.status] = (counts[g.status] || 0) + 1; });
    const summary = Object.entries(counts).map(([k, v]) => `${v} ${esc((STATUS[k] || ['', k])[1])}`).join(' · ');
    $('out').innerHTML = `<p style="margin:var(--space-3) 0"><strong>${d.games.length} window games:</strong> ${summary || 'none'}</p>
      <div class="tbl-wrap"><table class="table"><thead><tr><th scope="col">Game</th><th scope="col">Window</th><th scope="col">Status</th><th class="num" scope="col">Periods published</th><th scope="col">Lineups</th><th scope="col">Box score</th></tr></thead><tbody>
      ${d.games.map(g => { const st = STATUS[g.status] || ['', g.status, '']; return `<tr><td>#${g.daily_game_id}</td><td>W${g.window_index} · ${esc(g.start)} to ${esc(g.end)} <span class="muted">(${g.stored_games_in_window} real games stored)</span></td>
        <td><span class="pill2 ${st[0]}" title="${esc(st[2])}">${esc(st[1])}</span>${g.repaired ? '<div class="muted" style="font-size:12px">repaired ' + esc(g.repaired.at.replace('T', ' ')) + ' UTC</div>' : ''}</td>
        <td class="num">${g.published_periods}</td><td>${sideHtml(g.sides.away)}${sideHtml(g.sides.home)}</td>
        <td><a href="/static/nhl-box.html?daily_game_id=${g.daily_game_id}">Box score</a>
          ${g.status === 'locked, differs' ? `<div style="margin-top:6px"><button type="button" class="btn btn-primary" data-resim="${g.daily_game_id}" style="font-size:11px;padding:4px 10px">Void and re-simulate</button></div>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div>`;
    document.querySelectorAll('[data-resim]').forEach(b => { b.onclick = () => resim(Number(b.dataset.resim)); });
  } catch (e) { $('err').textContent = (e && e.message) || 'Could not load the audit.'; $('err').style.display = 'block'; $('out').innerHTML = ''; }
}

async function resim(id) {
  if (!confirm(`Void game #${id} and simulate it again?\n\nIts events and everyone's watched progress are deleted. It is then simulated again from the stored feed with a lineup resolved on the full schedule, so every score, shot and highlight in it can change. This cannot be undone.`)) return;
  try {
    const r = await FSC.post(`/simulator/games/${id}/resimulate`);
    $('err').style.display = 'none';
    alert(r.message || 'Done.');
    load();
  } catch (e) { $('err').textContent = (e && (e.message || e.detail)) || 'Could not re-simulate this game.'; $('err').style.display = 'block'; }
}
if (!LEAGUE_ID) { $('err').textContent = 'Open this page with ?league_id=…'; $('err').style.display = 'block'; $('out').innerHTML = ''; }
else load();
</script>
</body>
</html>
